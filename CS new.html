<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه هوشمند برنامه‌ریزی هفتگی مدارس</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Vazirmatn', system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(226, 232, 240, 0.8); }
  .ts-control { border-radius: 0.5rem; border-color: #cbd5e1; padding: 0.5rem 0.75rem; font-family: inherit; }
  .ts-control.focus { border-color: #4f46e5; box-shadow: 0 0 0 1px #4f46e5; }
  .ts-dropdown { text-align: right; border-radius: 0.5rem; font-family: inherit; z-index: 1000; }
  .cell-selected { ring: 3px solid #4f46e5 !important; background-color: #e0e7ff !important; }
  .cell-swappable { cursor: pointer; transition: all 0.15s ease; }
  .cell-swappable:hover { filter: brightness(0.96); transform: scale(0.99); }
  @media print {
    body { background: white !important; color: black !important; padding-bottom: 0 !important; }
    .no-print { display: none !important; }
    .page-break { page-break-after: always; }
  }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <div id="toast-container" class="fixed top-4 left-4 z-[70] flex flex-col gap-2"></div>

  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-40 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="p-2 bg-indigo-800 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight" id="header-school-name">سامانه هوشمند برنامه کلاسی مدارس</h1>
          <span class="text-[11px] text-indigo-200 font-normal">نسخه جامع الگوریتمیک پداگوژیک و متعادل‌سازی ذهنی</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="navigateTo('scheduler')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3.5 py-1.5 rounded-lg text-sm transition-colors flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          تولید هوشمند برنامه
        </button>
        <button onclick="navigateTo('home')" class="hover:bg-indigo-600 px-3 py-1.5 rounded-lg transition-colors text-sm font-medium flex items-center gap-1">
          خانه
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8" id="app-content"></main>

  <div id="modal-backdrop" class="fixed inset-0 bg-black/50 hidden z-50 overflow-y-auto justify-center p-4 sm:p-6 fade-in items-start sm:items-center">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col my-auto max-h-[92vh] overflow-hidden"></div>
  </div>

<script>
const initialGradeLevels = ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم', 'یازدهم', 'دوازدهم'];
const majorsList = ['عمومی', 'ریاضی فیزیک', 'علوم تجربی', 'علوم انسانی', 'فنی و حرفه‌ای'];
const DAYS_OF_WEEK = ['شنبه', 'یک‌شنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه'];
const MAX_PERIODS = 8;
const MAX_PERIODS_PER_SUBJECT = 12;
const MAX_PERIOD_DURATION = 120;

let state = {
  settings: { schoolName: 'دبیرستان نمونه هوشمند' },
  gradeLevels: [...initialGradeLevels],
  subjects: [],
  teachers: [],
  classes: [],
  schedules: {}
};

let uiState = {
  sortRules: { subjects: 'date', teachers: 'date', classes: 'date' },
  teacherViewMode: 'grid',
  scheduleTab: 'classes',
  selectedCell: null,
  activeTomSelects: []
};

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function safeParseInt(val, fallback) {
  const n = parseInt(val, 10);
  return (isNaN(n) || n < 0) ? fallback : n;
}

function clampInt(val, min, max, fallback) {
  const n = parseInt(val, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function generateId() { return '_' + Math.random().toString(36).substr(2, 9); }

function isValidAvailability(avail) {
  if (!avail || typeof avail !== 'object') return false;
  for (let d = 0; d < 6; d++) {
    if (!Array.isArray(avail[d]) || avail[d].length < MAX_PERIODS) return false;
  }
  return true;
}

function generateDefaultAvailability() {
  let avail = {};
  for (let d = 0; d < 6; d++) avail[d] = new Array(MAX_PERIODS).fill(true);
  return avail;
}

const SUBJECT_DIFFICULTY_LEVELS = [
  { value: 1, label: '۱ — خیلی سبک (ورزش، پرورشی، تفکر)' },
  { value: 2, label: '۲ — سبک (هنر، کارگاه، مهارت)' },
  { value: 3, label: '۳ — متوسط (ادبیات، زبان، دین و زندگی)' },
  { value: 4, label: '۴ — سنگین (زیست‌شناسی، شیمی، عربی)' },
  { value: 5, label: '۵ — بسیار سنگین (ریاضی، فیزیک، حسابان، هندسه)' }
];

const SUBJECT_PREFERRED_SLOTS = [
  { value: 'any', label: 'بدون ترجیح خاص (هر زنگی)' },
  { value: 'morning', label: 'صبح زود (زنگ ۱ و ۲ — دروس نیازمند تمرکز بالا)' },
  { value: 'end', label: 'آخر روز (زنگ‌های پایانی — دروس عملی/ورزشی)' }
];

function ensureSubjectSchedulingFields(s) {
  if (typeof s.difficulty !== 'number' || s.difficulty < 1 || s.difficulty > 5) s.difficulty = 3;
  if (!['morning', 'end', 'any'].includes(s.preferredSlot)) {
    s.preferredSlot = /تربیت\s*بدنی|هنر|کار\s*و\s*فناوری|ورزش|سواد\s*رسانه‌ای/.test(s.name || '') ? 'end' : 'any';
  }
}

function ensureClassSubjectFields(cs) {
  if (typeof cs.doublePeriod !== 'boolean') cs.doublePeriod = false;
  if (typeof cs.periods !== 'number' || cs.periods < 1) cs.periods = 2;
}

function getClassCapacity(cls) {
  const activeDays = cls.config?.activeDays ||;
  const periodsCount = cls.config?.periodsCount || 5;
  return activeDays.length * periodsCount;
}

function getClassUsedSlots(cls) {
  return (cls.subjects || []).reduce((sum, cs) => sum + (cs.periods || 0), 0);
}

function validateStateStructure(data) {
  if (!data || typeof data !== 'object') return false;
  if (!Array.isArray(data.subjects)) return false;
  if (!Array.isArray(data.teachers)) return false;
  if (!Array.isArray(data.classes)) return false;
  if (!data.settings || typeof data.settings !== 'object') return false;
  return true;
}

function loadState() {
  const saved = localStorage.getItem('school_schedule_data_v2');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (validateStateStructure(parsed)) {
        state = parsed;
      }
    } catch(e) {
      console.error('State load error:', e);
      showToast('خطا در خواندن داده‌های ذخیره‌شده؛ از مقادیر پیش‌فرض استفاده شد.', 'error');
    }
  }

  if (!state.gradeLevels) state.gradeLevels = [...initialGradeLevels];
  if (!state.subjects) state.subjects = [];
  if (!state.teachers) state.teachers = [];
  if (!state.classes) state.classes = [];
  if (!state.settings) state.settings = { schoolName: 'دبیرستان نمونه هوشمند' };
  if (!state.schedules) state.schedules = {};

  state.subjects.forEach(s => {
    if (!s.createdAt) s.createdAt = Date.now();
    ensureSubjectSchedulingFields(s);
  });

  state.teachers.forEach(t => {
    if (!t.createdAt) t.createdAt = Date.now();
    if (!isValidAvailability(t.availability)) t.availability = generateDefaultAvailability();
    if (typeof t.maxDailyPeriods !== 'number') t.maxDailyPeriods = 5;
  });

  state.classes.forEach(c => {
    if (!c.createdAt) c.createdAt = Date.now();
    if (!Array.isArray(c.subjects)) c.subjects = [];
    c.subjects.forEach(cs => { if (cs) ensureClassSubjectFields(cs); });
    if (!c.config) c.config = { activeDays:, periodsCount: 5, periodDuration: 45 };
    if (!Array.isArray(c.config.activeDays) || c.config.activeDays.length === 0) c.config.activeDays =;
  });

  const headerEl = document.getElementById('header-school-name');
  if (headerEl) headerEl.innerText = state.settings.schoolName || 'سامانه هوشمند برنامه کلاسی مدارس';
  saveState();
}

function saveState() {
  try {
    localStorage.setItem('school_schedule_data_v2', JSON.stringify(state));
    const headerEl = document.getElementById('header-school-name');
    if (headerEl && state.settings.schoolName) headerEl.innerText = state.settings.schoolName;
  } catch(e) {
    console.error('Failed to save state:', e);
    showToast('خطا در ذخیره‌سازی داده‌ها. حافظه محلی مرورگر ممکن است پر باشد.', 'error');
  }
}

function showToast(msg, type = 'info') {
  const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-indigo-600', warning: 'bg-amber-600' };
  const toast = document.createElement('div');
  toast.className = `${colors[type] || colors.info} text-white px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium fade-in max-w-md border border-white/20`;
  toast.textContent = msg;
  const container = document.getElementById('toast-container');
  if (container) container.appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity .3s ease';
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

const modalBackdrop = document.getElementById('modal-backdrop');
const modalContent = document.getElementById('modal-content');

modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) hideModal();
});

function showModal(title, bodyHTML, footerHTML, onOpen = null) {
  modalContent.innerHTML = `
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl shrink-0">
      <h3 class="font-bold text-lg text-slate-800">${escapeHtml(title)}</h3>
      <button onclick="hideModal()" class="text-slate-400 hover:text-rose-500 transition-colors p-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="px-6 py-6 flex-1 overflow-y-auto custom-scrollbar">${bodyHTML}</div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50 rounded-b-2xl shrink-0">${footerHTML}</div>
  `;
  modalBackdrop.classList.remove('hidden');
  modalBackdrop.classList.add('flex');
  setTimeout(() => {
    initSearchableSelects();
    if(onOpen) onOpen();
  }, 50);
}

function hideModal() {
  modalBackdrop.classList.add('hidden');
  modalBackdrop.classList.remove('flex');
  destroyAllTomSelects();
}

function destroyAllTomSelects() {
  uiState.activeTomSelects.forEach(ts => {
    try { if (ts && typeof ts.destroy === 'function') ts.destroy(); } catch(e){}
  });
  uiState.activeTomSelects = [];
}

function initSearchableSelects() {
  destroyAllTomSelects();
  document.querySelectorAll('select.searchable').forEach(el => {
    if (!el.tomselect) {
      const ts = new TomSelect(el, {
        plugins: ['remove_button'],
        create: false,
        sortField: { field: "text", direction: "asc" },
        placeholder: el.getAttribute('placeholder') || 'جستجو و انتخاب...',
        render: { no_results: function() { return '<div class="p-2 text-sm text-slate-400 text-center">موردی یافت نشد</div>'; } }
      });
      uiState.activeTomSelects.push(ts);
    }
  });
}

function navigateTo(view) {
  destroyAllTomSelects();
  uiState.selectedCell = null;
  const content = document.getElementById('app-content');
  content.innerHTML = '';

  if (view === 'home') content.innerHTML = renderHome();
  else if (view === 'settings') content.innerHTML = renderSettings();
  else if (view === 'teachers') content.innerHTML = renderTeachers();
  else if (view === 'classes') content.innerHTML = renderClasses();
  else if (view === 'subjects') content.innerHTML = renderSubjects();
  else if (view === 'scheduler') content.innerHTML = renderScheduler();
  else if (view.startsWith('class_edit_')) {
    const classId = view.replace('class_edit_', '');
    content.innerHTML = renderClassEditor(classId);
  }

  setTimeout(() => initSearchableSelects(), 50);
}

function sortDataList(list, type) {
  return [...list].sort((a, b) => {
    if (type === 'alpha') return (a.name || '').localeCompare(b.name || '', 'fa');
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

function renderSortToggle(section, currentSort) {
  return `
    <select onchange="changeSort('${escapeHtml(section)}', this.value)" class="searchable text-sm border-slate-300 rounded-lg pr-8 bg-white" placeholder="مرتب‌سازی...">
      <option value="date" ${currentSort === 'date' ? 'selected' : ''}>مرتب‌سازی: جدیدترین</option>
      <option value="alpha" ${currentSort === 'alpha' ? 'selected' : ''}>مرتب‌سازی: حروف الفبا</option>
    </select>
  `;
}

function changeSort(section, val) {
  if (val !== 'date' && val !== 'alpha') return;
  uiState.sortRules[section] = val;
  navigateTo(section);
}

function renderHome() {
  const stats = {
    classesCount: state.classes.length,
    teachersCount: state.teachers.length,
    subjectsCount: state.subjects.length,
    hasSchedule: Object.keys(state.schedules || {}).length > 0
  };

  const menus = [
    { id: 'scheduler', title: 'ساخت و مشاهده برنامه هوشمند', desc: 'تولید خودکار، تنظیمات الگوریتم، خروجی‌های PDF/Excel و چاپ برنامه هفتگی معلمان و کلاس‌ها', icon: 'M13 10V3L4 14h7v7l9-11h-7z', color: 'bg-amber-500', highlight: true },
    { id: 'classes', title: 'مدیریت کلاس‌ها', desc: `${stats.classesCount} کلاس فعال | تنظیم هفتگی ساعات، دروس تخصصی و دروس مشترک بین رشته‌ها`, icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4', color: 'bg-blue-600' },
    { id: 'teachers', title: 'مدیریت اساتید و ساعات حضور', desc: `${stats.teachersCount} دبیر و استاد | ماتریس حضور روزانه و زنگ‌های آزاد و دروس تدریسی`, icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z', color: 'bg-emerald-600' },
    { id: 'subjects', title: 'مدیریت دروس و سختی شناختی', desc: `${stats.subjectsCount} درس ثبت‌شده | تنظیم بار ذهنی (۱ تا ۵) و زمان‌بندی بهینه روزانه`, icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253', color: 'bg-indigo-600' },
    { id: 'settings', title: 'تنظیمات و پشتیبان‌گیری', desc: 'تغییر نام آموزشگاه، دریافت فایل پشتیبان JSON و بازیابی کامل اطلاعات', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z', color: 'bg-slate-700' },
  ];

  let html = `
    <div class="fade-in space-y-6">
      <div class="bg-gradient-to-r from-indigo-700 via-indigo-800 to-slate-900 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="space-y-2 text-center md:text-right">
          <span class="inline-block bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 px-3 py-1 rounded-full text-xs font-semibold tracking-wide">نسخه جامع آموزشی و پداگوژیک</span>
          <h2 class="text-3xl font-extrabold tracking-tight">${escapeHtml(state.settings.schoolName)}</h2>
          <p class="text-indigo-200 text-sm max-w-xl leading-relaxed">تنظیم اتوماتیک بدون تداخل، مدیریت تعادل شناختی زنگ‌های صبح و عصر، کاهش ساعات سرگردانی اساتید و هماهنگی کامل دروس آزمایشگاهی و مشترک.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 shrink-0">
          <button onclick="navigateTo('scheduler')" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold px-6 py-3.5 rounded-2xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center gap-2 text-base">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            ورود به بخش زمان‌بندی هوشمند
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
  `;

  menus.forEach(m => {
    html += `
      <div onclick="navigateTo('${escapeHtml(m.id)}')" class="glass-card rounded-2xl p-6 cursor-pointer hover:-translate-y-1 hover:shadow-lg transition-all group flex flex-col justify-between border border-slate-200 relative overflow-hidden">
        <div class="flex items-start gap-4 mb-4">
          <div class="w-14 h-14 rounded-2xl ${m.color} text-white flex items-center justify-center shadow-md group-hover:scale-105 transition-transform shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${m.icon}" /></svg>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-800 mb-1 group-hover:text-indigo-600 transition-colors">${escapeHtml(m.title)}</h3>
            <p class="text-xs text-slate-500 leading-relaxed">${escapeHtml(m.desc)}</p>
          </div>
        </div>
        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs font-semibold text-indigo-600">
          <span>ورود به بخش</span>

function deleteSubject(id) {
  if (!confirm('آیا از حذف این درس اطمینان دارید؟')) return;
  state.subjects = state.subjects.filter(s => s.id !== id);
  state.teachers.forEach(t => { t.subjects = (t.subjects || []).filter(sid => sid !== id); });
  state.classes.forEach(c => { c.subjects = (c.subjects || []).filter(cs => cs.subjectId !== id); });

  for (const cid in state.schedules) {
    for (let d = 0; d < 6; d++) {
      if (state.schedules[cid] && state.schedules[cid][d]) {
        for (let p = 0; p < MAX_PERIODS; p++) {
          if (state.schedules[cid][d][p] && state.schedules[cid][d][p].subjectId === id) {
            state.schedules[cid][d][p] = null;
          }
        }
      }
    }
  }

  saveState();
  navigateTo('subjects');
  showToast('درس با موفقیت حذف شد.', 'success');
}

function deleteGrade(grade) {
  if (!confirm(`آیا از حذف کلیه دروس و تنظیمات مربوط به پایه «${grade}» اطمینان دارید؟`)) return;
  const deletedIds = state.subjects.filter(s => s.grade === grade).map(s => s.id);
  state.subjects = state.subjects.filter(s => s.grade !== grade);
  state.teachers.forEach(t => { t.subjects = (t.subjects || []).filter(sid => !deletedIds.includes(sid)); });
  state.classes = state.classes.filter(c => c.grade !== grade);

  saveState();
  navigateTo('subjects');
  showToast(`پایه ${grade} و کلیه دروس مربوطه حذف شدند.`, 'success');
}

function processSubjectsImport() {
  const file = document.getElementById('import_sub_file').files[0];
  if (!file) return showToast('لطفاً یک فایل انتخاب کنید', 'error');
  const grade = document.getElementById('import_sub_grade').value;
  const major = document.getElementById('import_sub_major').value;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
      let count = 0;
      json.slice(1).forEach(row => {
        if (row[0]) {
          const sName = String(row[0]).trim().slice(0, 100);
          const sGrade = String(row || grade).trim();
          const sMajor = String(row[2] || major).trim();
          const sDiff = clampInt(row[3], 1, 5, 3);
          state.subjects.push({
            id: generateId(),
            name: sName,
            grade: state.gradeLevels.includes(sGrade) ? sGrade : grade,
            major: majorsList.includes(sMajor) ? sMajor : major,
            difficulty: sDiff,
            preferredSlot: 'any',
            createdAt: Date.now()
          });
          count++;
        }
      });
      saveState();
      hideModal();
      navigateTo('subjects');
      showToast(`${count} درس با موفقیت افزوده شد.`, 'success');
    } catch(err) {
      console.error(err);
      showToast('خطا در پردازش فایل اکسل', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveTeacher(id) {
  const name = document.getElementById('edit_teacher_name').value.trim();
  const maxDaily = clampInt(document.getElementById('edit_teacher_max_daily').value, 1, MAX_PERIODS, 5);
  const selectedSubjects = Array.from(document.getElementById('edit_teacher_subjects').selectedOptions).map(opt => opt.value);

  if (!name) return showToast('نام دبیر الزامی است', 'error');

  let availability = {};
  for (let d = 0; d < 6; d++) {
    availability[d] = [];
    for (let p = 0; p < MAX_PERIODS; p++) {
      const cb = document.getElementById(`avail_${d}_${p}`);
      availability[d][p] = cb ? cb.checked : true;
    }
  }

  if (id) {
    const t = state.teachers.find(x => x.id === id);
    if (t) {
      t.name = name;
      t.subjects = selectedSubjects;
      t.availability = availability;
      t.maxDailyPeriods = maxDaily;
      t.updatedAt = Date.now();
    }
  } else {
    state.teachers.push({
      id: generateId(),
      name,
      subjects: selectedSubjects,
      availability,
      maxDailyPeriods: maxDaily,
      createdAt: Date.now()
    });
  }

  saveState();
  hideModal();
  navigateTo('teachers');
  showToast('مشخصات دبیر و برنامه حضور با موفقیت ثبت شد.', 'success');
}

function deleteTeacher(id) {
  if (!confirm('آیا از حذف این استاد اطمینان دارید؟ تمام انتساب‌های او در کلاس‌ها به حالت «بدون استاد» تغییر خواهند کرد.')) return;
  state.teachers = state.teachers.filter(t => t.id !== id);
  state.classes.forEach(c => {
    (c.subjects || []).forEach(cs => {
      if (cs.teacherId === id) cs.teacherId = null;
    });
  });

  for (const cid in state.schedules) {
    for (let d = 0; d < 6; d++) {
      if (state.schedules[cid] && state.schedules[cid][d]) {
        for (let p = 0; p < MAX_PERIODS; p++) {
          if (state.schedules[cid][d][p] && state.schedules[cid][d][p].teacherId === id) {
            state.schedules[cid][d][p].teacherId = null;
          }
        }
      }
    }
  }

  saveState();
  navigateTo('teachers');
  showToast('استاد حذف شد.', 'success');
}

function processTeachersImport() {
  const file = document.getElementById('import_teacher_file').files[0];
  if (!file) return showToast('لطفاً یک فایل انتخاب کنید', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
      let count = 0;
      json.forEach((row, idx) => {
        const raw = row[0];
        if (raw && typeof raw === 'string' && raw.trim().length > 0) {
          if (idx === 0 && (raw.includes('نام') || raw.includes('استاد') || raw.includes('دبیر'))) return;
          const cleanName = raw.trim().slice(0, 100);
          if (!state.teachers.some(t => t.name === cleanName)) {
            state.teachers.push({
              id: generateId(),
              name: cleanName,
              subjects: [],
              availability: generateDefaultAvailability(),
              maxDailyPeriods: 5,
              createdAt: Date.now()
            });
            count++;
          }
        }
      });
      saveState();
      hideModal();
      navigateTo('teachers');
      showToast(`${count} دبیر جدید ثبت شد.`, 'success');
    } catch(err) {
      showToast('خطا در خواندن فایل اکسل اساتید', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveNewClass() {
  const name = document.getElementById('new_class_name').value.trim();
  const grade = document.getElementById('new_class_grade').value;
  const major = document.getElementById('new_class_major').value;
  if (!name) return showToast('نام کلاس الزامی است', 'error');

  const matchingSubjects = state.subjects.filter(s => s.grade === grade && (s.major === major || s.major === 'عمومی'));
  const classSubjects = matchingSubjects.map(s => {
    const candidateTeachers = state.teachers.filter(t => (t.subjects || []).includes(s.id));
    return {
      subjectId: s.id,
      periods: 2,
      type: 'عادی',
      teacherId: candidateTeachers.length === 1 ? candidateTeachers[0].id : null,
      doublePeriod: false
    };
  });

  state.classes.push({
    id: generateId(),
    name,
    grade,
    major,
    subjects: classSubjects,
    config: { activeDays:, periodsCount: 5, periodDuration: 45 },
    createdAt: Date.now()
  });

  saveState();
  hideModal();
  navigateTo('classes');
  showToast('کلاس با موفقیت ساخته شد و دروس پیش‌فرض پایه افزوده شدند.', 'success');
}

function duplicateClass(id) {
  const cls = state.classes.find(c => c.id === id);
  if (!cls) return;
  const copy = JSON.parse(JSON.stringify(cls));
  copy.id = generateId();
  copy.name = copy.name + ' (رونوشت)';
  copy.createdAt = Date.now();
  copy.subjects.forEach(cs => { delete cs.jointId; });
  state.classes.push(copy);
  saveState();
  navigateTo('classes');
  showToast('رونوشت کلاس ساخته شد.', 'success');
}

function deleteClass(id) {
  if (!confirm('آیا از حذف این کلاس اطمینان دارید؟')) return;
  state.classes = state.classes.filter(c => c.id !== id);
  delete state.schedules[id];
  saveState();
  navigateTo('classes');
  showToast('کلاس حذف شد.', 'success');
}

}

function updateClassSubject(classId, subIndex, field, value) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls || !cls.subjects[subIndex]) return;

  if (field === 'periods') {
    value = clampInt(value, 1, MAX_PERIODS_PER_SUBJECT, 2);
  }
  if (field === 'doublePeriod') {
    value = (value === true || value === 'true');
  }

  cls.subjects[subIndex][field] = value;

  const jointId = cls.subjects[subIndex].jointId;
  if (jointId) {
    state.classes.forEach(c => {
      c.subjects.forEach(cs => {
        if (cs.jointId === jointId) cs[field] = value;
      });
    });
  }

  saveState();
  const cap = getClassCapacity(cls);
  const used = getClassUsedSlots(cls);
  if (used > cap) {
    showToast(`هشدار: کل ساعات (${used}) از ظرفیت کلاس (${cap}) بیشتر است.`, 'warning');
  }
}

function assignTeacherToClass(classId, subIndex, teacherId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls || !cls.subjects[subIndex]) return;

  const validTeacherId = teacherId ? teacherId : null;
  cls.subjects[subIndex].teacherId = validTeacherId;

  const jointId = cls.subjects[subIndex].jointId;
  if (jointId) {
    state.classes.forEach(c => {
      c.subjects.forEach(cs => {
        if (cs.jointId === jointId) cs.teacherId = validTeacherId;
      });
    });
  }

  saveState();
  showToast('استاد درس بروزرسانی شد.', 'success');
}

function removeClassSubject(classId, subIndex) {
  if (!confirm('آیا مایل به حذف این درس از کلاس هستید؟')) return;
  const cls = state.classes.find(c => c.id === classId);
  if (cls) {
    cls.subjects.splice(subIndex, 1);
    saveState();
    navigateTo(`class_edit_${classId}`);
  }
}

function addSubjectToClass(classId) {

window.toggleJointStatus = function(c1, idx1, c2, idx2, isChecked, jointId) {
  const cls1 = state.classes.find(c => c.id === c1);

  if (!cls1 || !cls2) return;

  if (isChecked) {
    cls1.subjects[idx1].jointId = jointId;
    cls2.subjects[idx2].jointId = jointId;
    cls2.subjects[idx2].teacherId = cls1.subjects[idx1].teacherId;
    cls2.subjects[idx2].periods = cls1.subjects[idx1].periods;
    cls2.subjects[idx2].doublePeriod = cls1.subjects[idx1].doublePeriod;
  } else {
    delete cls2.subjects[idx2].jointId;
    const anyoneElse = state.classes.some(c => c.id !== c1 && c.subjects.some(cs => cs.jointId === jointId));
    if (!anyoneElse) delete cls1.subjects[idx1].jointId;
  }
  saveState();
  openJointConfigModal(c1, idx1);
};

function runPreflightChecks() {
  const errors = [];
  const warnings = [];

  state.classes.forEach(cls => {
    const cap = getClassCapacity(cls);
    const used = getClassUsedSlots(cls);
    if (used > cap) {
      errors.push(`کلاس «${cls.name}»: کل ساعات دروس (${used} زنگ) از ظرفیت فعال کلاس (${cap} زنگ) بیشتر است.`);
    }
  });

  const teacherDemand = {};
  state.classes.forEach(cls => {
    cls.subjects.forEach(cs => {
      if (cs.teacherId) {
        if (!cs.jointId) {
          teacherDemand[cs.teacherId] = (teacherDemand[cs.teacherId] || 0) + (cs.periods || 0);
        } else {
          if (!teacherDemand[cs.teacherId + '_j_' + cs.jointId]) {
            teacherDemand[cs.teacherId + '_j_' + cs.jointId] = true;
            teacherDemand[cs.teacherId] = (teacherDemand[cs.teacherId] || 0) + (cs.periods || 0);
          }
        }
      } else {
        const sub = state.subjects.find(s => s.id === cs.subjectId);
        warnings.push(`کلاس «${cls.name}»: درس «${sub?.name || 'نامشخص'}» فاقد استاد مشخص است.`);
      }
    });
  });

  state.teachers.forEach(t => {
    let totalAvail = 0;
    for (let d = 0; d < 6; d++) {
      if (t.availability && t.availability[d]) {
        for (let p = 0; p < MAX_PERIODS; p++) {
          if (t.availability[d][p] !== false) totalAvail++;
        }
      }
    }
    const needed = teacherDemand[t.id] || 0;
    if (needed > totalAvail) {
      errors.push(`استاد «${t.name}»: مجموع نیاز تدریس موظف او (${needed} زنگ) از کل ساعات حضور آزاد اعلام‌شده (${totalAvail} زنگ) بیشتر است.`);
    }
  });

  return { errors, warnings };
}

            الگوریتم تبرید شبیه‌سازی‌شده (Simulated Annealing) با رعایت ۱۰۰٪ عدم تداخل اساتید، حفظ بلوک‌های متوالی دروس آزمایشگاهی، توزیع متوازن بار شناختی صبح/عصر، و کاهش پنجره‌های خالی اساتید.

const COGNITIVE_PERIOD_CAPACITY = [1.0, 0.95, 0.88, 0.72, 0.60, 0.52, 0.45, 0.40];

let activeScheduleRunner = null;

function executeSmartScheduler() {
  if (activeScheduleRunner) return showToast('زمان‌بندی دیگری در حال اجراست؛ لطفاً شکیبا باشید.', 'info');

  const runBtn = document.getElementById('run-scheduler-btn');
  if (runBtn) { runBtn.disabled = true; runBtn.innerText = 'در حال محاسبه...'; }

  const atomicBlocks = [];

  state.classes.forEach(cls => {
    const pCount = cls.config?.periodsCount || 5;

    cls.subjects.forEach(cs => {
      const sub = state.subjects.find(s => s.id === cs.subjectId);
      if (!sub) return;

      const difficulty = clampInt(sub.difficulty, 1, 5, 3);
      const prefSlot = sub.preferredSlot || 'any';
      let remaining = cs.periods || 2;

      if (cs.doublePeriod && pCount >= 2) {
        while (remaining >= 2) {
          atomicBlocks.push({
            id: generateId(),
            classId: cls.id,
            subjectId: cs.subjectId,
            teacherId: cs.teacherId,
            name: sub.name,
            difficulty,
            preferredSlot: prefSlot,
            length: 2,
            jointId: cs.jointId || null
          });
          remaining -= 2;
        }
      }

      while (remaining > 0) {
        atomicBlocks.push({
          id: generateId(),
          classId: cls.id,
          subjectId: cs.subjectId,
          teacherId: cs.teacherId,
          name: sub.name,
          difficulty,
          preferredSlot: prefSlot,
          length: 1,
          jointId: cs.jointId || null
        });
        remaining--;
      }
    });
  });

  const classIds = state.classes.map(c => c.id);
  const classMeta = {};
  classIds.forEach(cid => {
    const cls = state.classes.find(c => c.id === cid);
    const activeDays = Array.isArray(cls.config?.activeDays) ? cls.config.activeDays :;
    const pCount = cls.config?.periodsCount || 5;
    classMeta[cid] = { activeDays, pCount };
  });

  const teacherAvail = {};
  state.teachers.forEach(t => {
    teacherAvail[t.id] = isValidAvailability(t.availability) ? t.availability : generateDefaultAvailability();
  });

  function cloneGrid(grid) {
    const copy = {};
    classIds.forEach(cid => {
      copy[cid] = {};
      for (let d = 0; d < 6; d++) copy[cid][d] = grid[cid][d].slice();
    });
    return copy;
  }

  function emptyGrid() {
    const grid = {};
    classIds.forEach(cid => {
      grid[cid] = {};
      for (let d = 0; d < 6; d++) grid[cid][d] = new Array(MAX_PERIODS).fill(null);
    });
    return grid;
  }

  function evaluateGrid(grid) {
    let cost = 0;

    for (let d = 0; d < 6; d++) {
      for (let p = 0; p < MAX_PERIODS; p++) {
        const teacherOccupants = {};
        const jointSeen = {};

        for (let i = 0; i < classIds.length; i++) {
          const cid = classIds[i];
          const item = grid[cid][d][p];
          if (!item || !item.teacherId) continue;

          if (item.jointId) {
            if (jointSeen[item.jointId]) continue;
            jointSeen[item.jointId] = true;
          }

          const tid = item.teacherId;
          teacherOccupants[tid] = (teacherOccupants[tid] || 0) + 1;

          const avail = teacherAvail[tid];
          if (avail && avail[d] && avail[d][p] === false) {
            cost += 600000;
          }
        }

        for (const tid in teacherOccupants) {
          if (teacherOccupants[tid] > 1) {
            cost += (teacherOccupants[tid] - 1) * 800000;
          }
        }
      }
    }

    state.teachers.forEach(t => {
      const tid = t.id;
      for (let d = 0; d < 6; d++) {
        let minP = 99, maxP = -1, teachCount = 0;
        const busyPeriods = {};

        for (let i = 0; i < classIds.length; i++) {
          const cid = classIds[i];
          for (let p = 0; p < MAX_PERIODS; p++) {
            const item = grid[cid][d][p];
            if (item && item.teacherId === tid) {
              busyPeriods[p] = true;
              if (p < minP) minP = p;
              if (p > maxP) maxP = p;
            }
          }
        }

        teachCount = Object.keys(busyPeriods).length;
        if (teachCount > 0) {
          if (teachCount > (t.maxDailyPeriods || 5)) {
            cost += (teachCount - (t.maxDailyPeriods || 5)) * 400;
          }
          for (let p = minP; p <= maxP; p++) {
            if (!busyPeriods[p]) {
              cost += 80;
            }
          }
        }
      }
    });

    classIds.forEach(cid => {
      const meta = classMeta[cid];
      const daySubjectCounts = {};

      for (let d = 0; d < 6; d++) {
        if (!meta.activeDays.includes(d)) continue;

        for (let p = 0; p < meta.pCount; p++) {
          const item = grid[cid][d][p];
          if (!item) continue;

          const capacity = COGNITIVE_PERIOD_CAPACITY[p] || 0.4;
          const demand = item.difficulty / 5;
          if (demand > capacity + 0.15) {
            cost += Math.round((demand - capacity) * 70);
          }

          if (item.preferredSlot === 'morning' && p >= 3) cost += 40;
          if (item.preferredSlot === 'end' && p < meta.pCount - 2) cost += 40;

          if (p + 1 < meta.pCount) {
            const next = grid[cid][d][p + 1];
            if (next && item.subjectId !== next.subjectId) {
              if (item.difficulty >= 4 && next.difficulty >= 4) {
                cost += 35;
              }
            }
          }

          if (!daySubjectCounts[item.subjectId]) daySubjectCounts[item.subjectId] = [0,0,0,0,0,0];
          daySubjectCounts[item.subjectId][d]++;
        }
      }

      for (const sid in daySubjectCounts) {
        for (let d = 0; d < 6; d++) {
          if (daySubjectCounts[sid][d] > 2) {
            cost += (daySubjectCounts[sid][d] - 2) * 50;
          }
        }
      }
    });

    return cost;
  }

  let currentGrid = emptyGrid();

  atomicBlocks.sort((a, b) => {
    if (a.jointId && !b.jointId) return -1;
    if (!a.jointId && b.jointId) return 1;
    return b.length - a.length;
  });

  atomicBlocks.forEach(block => {
    const cid = block.classId;
    const meta = classMeta[cid];
    let placed = false;

    if (block.length === 2) {
      for (let d of meta.activeDays) {
        for (let p = 0; p < meta.pCount - 1; p++) {
          if (!currentGrid[cid][d][p] && !currentGrid[cid][d][p+1]) {
            currentGrid[cid][d][p] = block;
            currentGrid[cid][d][p+1] = block;
            placed = true;
            break;
          }
        }
        if (placed) break;
      }
    }

    if (!placed) {
      for (let d of meta.activeDays) {
        for (let p = 0; p < meta.pCount; p++) {
          if (!currentGrid[cid][d][p]) {
            currentGrid[cid][d][p] = block;
            if (block.length === 2 && p + 1 < meta.pCount && !currentGrid[cid][d][p+1]) {
              currentGrid[cid][d][p+1] = block;
            }
            placed = true;
            break;
          }
        }
        if (placed) break;
      }
    }
  });

  let currentCost = evaluateGrid(currentGrid);
  let bestGrid = cloneGrid(currentGrid);
  let bestCost = currentCost;

  let iteration = 0;
  const maxIterations = 35000;
  let T = 1.0;
  const alpha = 0.9997;

  activeScheduleRunner = true;

  function step() {
    if (!activeScheduleRunner) return;

    const start = performance.now();
    while (performance.now() - start < 45 && iteration < maxIterations) {
      iteration++;

      const cid = classIds[Math.floor(Math.random() * classIds.length)];
      const meta = classMeta[cid];
      if (meta.activeDays.length === 0 || meta.pCount === 0) continue;

      const d1 = meta.activeDays[Math.floor(Math.random() * meta.activeDays.length)];
      const p1 = Math.floor(Math.random() * meta.pCount);
      const d2 = meta.activeDays[Math.floor(Math.random() * meta.activeDays.length)];
      const p2 = Math.floor(Math.random() * meta.pCount);

      if (d1 === d2 && p1 === p2) continue;

      const item1 = currentGrid[cid][d1][p1];
      const item2 = currentGrid[cid][d2][p2];
      if (!item1 && !item2) continue;

      currentGrid[cid][d1][p1] = item2;
      currentGrid[cid][d2][p2] = item1;

      const newCost = evaluateGrid(currentGrid);
      const delta = newCost - currentCost;

      if (delta < 0 || Math.exp(-delta / (T * 120)) > Math.random()) {
        currentCost = newCost;
        if (currentCost < bestCost) {
          bestCost = currentCost;
          bestGrid = cloneGrid(currentGrid);
          if (bestCost === 0) {
            iteration = maxIterations;
            break;
          }
        }
      } else {
        currentGrid[cid][d1][p1] = item1;
        currentGrid[cid][d2][p2] = item2;
      }

      T *= alpha;
    }

    if (iteration < maxIterations) {
      const pct = Math.round((iteration / maxIterations) * 100);
      if (runBtn) runBtn.innerText = `در حال بهینه‌سازی الگوریتم... ${pct}٪`;
      setTimeout(step, 10);
    } else {
      state.schedules = bestGrid;
      saveState();
      activeScheduleRunner = null;
      if (runBtn) {
        runBtn.disabled = false;
        runBtn.innerText = 'اجرای مجدد الگوریتم هوشمند';
      }
      const container = document.getElementById('schedule-dashboard');
      if (container) container.innerHTML = renderScheduleTabsAndContent();
      showToast('برنامه با موفقیت تولید و بهینه‌سازی شد.', 'success');
    }
  }

  showToast('الگوریتم هوشمند شروع به کار کرد...', 'info');
  setTimeout(step, 40);
}

function switchScheduleTab(tab) {
  uiState.scheduleTab = tab;
  uiState.selectedCell = null;
  const container = document.getElementById('schedule-dashboard');
  if (container) container.innerHTML = renderScheduleTabsAndContent();
}

function cancelCellSelection() {
  uiState.selectedCell = null;
  const container = document.getElementById('schedule-dashboard');
  if (container) container.innerHTML = renderScheduleTabsAndContent();
}

function handleCellClick(classId, d, p) {
  if (!uiState.selectedCell) {
    uiState.selectedCell = { classId, d, p };
    const container = document.getElementById('schedule-dashboard');
    if (container) container.innerHTML = renderScheduleTabsAndContent();
  } else {
    if (uiState.selectedCell.classId !== classId) {
      showToast('جابجایی دستی فقط بین زنگ‌های یک کلاس امکان‌پذیر است.', 'warning');
      uiState.selectedCell = null;
      const container = document.getElementById('schedule-dashboard');
      if (container) container.innerHTML = renderScheduleTabsAndContent();
      return;
    }

    const { d: d1, p: p1 } = uiState.selectedCell;
    const d2 = d, p2 = p;

    const tmp = state.schedules[classId][d1][p1];
    state.schedules[classId][d1][p1] = state.schedules[classId][d2][p2];
    state.schedules[classId][d2][p2] = tmp;

    uiState.selectedCell = null;
    saveState();
    const container = document.getElementById('schedule-dashboard');
    if (container) container.innerHTML = renderScheduleTabsAndContent();
    showToast('دو زنگ با موفقیت جابجا شدند.', 'success');
  }
}

function renderTeachersTimetables() {

      const sched = state.schedules[cls.id];

          </table>
        </div>
      </div>`;
  });

  return html;
}

function exportSchedule(type) {
  const el = document.getElementById('print-area');
  if (!el) return;

  if (type === 'pdf') {
    const opt = {
      margin: 0.3,
      filename: `${state.settings.schoolName || 'schedule'}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(el).save();
  } else if (type === 'excel') {
    const wb = XLSX.utils.book_new();
    const usedSheetNames = new Set();

    if (uiState.scheduleTab === 'classes') {
      state.classes.forEach(cls => {
        const table = document.getElementById(`table_${cls.id}`);
        if (table) {
          const ws = XLSX.utils.table_to_sheet(table);
          let rawName = (cls.name || 'Class').replace(/[\\/*?[\]:]/g, '_').trim().substring(0, 26);
          let safeName = rawName || 'Class';
          let counter = 1;
          while (usedSheetNames.has(safeName)) {
            safeName = `${rawName}_${counter++}`;
          }
          usedSheetNames.add(safeName);
          XLSX.utils.book_append_sheet(wb, ws, safeName);
        }
      });
    } else {
      state.teachers.forEach(t => {
        const table = document.getElementById(`table_teacher_${t.id}`);
        if (table) {
          const ws = XLSX.utils.table_to_sheet(table);
          let rawName = (t.name || 'Teacher').replace(/[\\/*?[\]:]/g, '_').trim().substring(0, 26);
          let safeName = rawName || 'Teacher';
          let counter = 1;
          while (usedSheetNames.has(safeName)) {
            safeName = `${rawName}_${counter++}`;
          }
          usedSheetNames.add(safeName);
          XLSX.utils.book_append_sheet(wb, ws, safeName);
        }
      });
    }

    XLSX.writeFile(wb, `${state.settings.schoolName || 'schedules'}.xlsx`);
  }
}

function saveSettings() {
  const name = document.getElementById('setting_school_name').value.trim();
  if (!name) return showToast('نام مدرسه الزامی است', 'error');
  state.settings.schoolName = name.slice(0, 100);
  saveState();
  showToast('تنظیمات با موفقیت ذخیره شد.', 'success');
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `school_schedule_backup_${Date.now()}.json`;
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (validateStateStructure(data)) {
        Object.assign(state, data);
        state.teachers.forEach(t => {
          if (!isValidAvailability(t.availability)) t.availability = generateDefaultAvailability();
        });
        saveState();
        navigateTo('home');
        showToast('اطلاعات با موفقیت بازیابی شد.', 'success');
      } else {
        showToast('فرمت فایل پشتیبان نامعتبر است.', 'error');
      }
    } catch(err) {
      showToast('خطا در خواندن فایل JSON', 'error');
    }
  };
  reader.readAsText(file);
}

function resetAllData() {
  if (confirm('آیا از حذف کامل تمام اطلاعات سامانه اطمینان دارید؟ این عملیات غیرقابل بازگشت است.')) {
    localStorage.removeItem('school_schedule_data_v2');
    location.reload();
  }
}
