<!DOCTYPE html>

<style>
  * { font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }

  .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border: 1px solid #e2e8f0; }
  .ts-control { border-radius: 0.5rem; border-color: #cbd5e1; padding: 0.5rem 0.75rem; font-family: inherit; font-size: 0.875rem; }

<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <div id="toast-container" class="fixed top-4 left-4 z-[90] flex flex-col gap-2"></div>

  <!-- هدر برنامه -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-slate-800 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
        <div>
          <h1 class="font-black text-lg tracking-tight flex items-center gap-2">
            سامانه هوشمند برنامه کلاسی
            <span class="text-[11px] font-normal bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 px-2 py-0.5 rounded-full">نسخه حرفه‌ای مدارس</span>
          </h1>
          <p class="text-xs text-slate-400" id="header-school-name">مدرسه نمونه</p>
        </div>
      </div>

      <nav class="flex items-center gap-1.5 sm:gap-2">
        <button onclick="navigateTo('home')" class="nav-item px-3 py-1.5 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">داشبورد</button>
        <button onclick="navigateTo('classes')" class="nav-item px-3 py-1.5 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">کلاس‌ها</button>
        <button onclick="navigateTo('teachers')" class="nav-item px-3 py-1.5 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">دبیران</button>
        <button onclick="navigateTo('subjects')" class="nav-item px-3 py-1.5 rounded-lg text-sm text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">دروس</button>
        <button onclick="navigateTo('scheduler')" class="nav-item px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-md shadow-indigo-900/50 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          تولید هوشمند
        </button>
        <button onclick="navigateTo('settings')" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors" title="تنظیمات و پشتیبان‌گیری">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8" id="app-content"></main>

  <!-- مودال عمومی -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 overflow-y-auto justify-center p-4 sm:p-6 fade-in items-start sm:items-center no-print">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col overflow-visible my-auto border border-slate-100"></div>
  </div>

<script>
// ==========================================
// 1. داده‌ها، مقادیر پایه و مدیریت وضعیت (STATE)
// ==========================================
const initialGradeLevels = ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم', 'یازدهم', 'دوازدهم'];
const majorsList = ['عمومی', 'ریاضی فیزیک', 'علوم تجربی', 'علوم انسانی', 'فنی و حرفه‌ای'];
const DAYS_OF_WEEK = ['شنبه', 'یک‌شنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه'];
const MAX_PERIODS = 8;
const MAX_PERIODS_PER_SUBJECT = 12;
const MAX_PERIOD_DURATION = 120;

let state = {
  settings: { 
    schoolName: 'دبیرستان نمونه هوشمند',
    academicYear: '۱۴۰۴ - ۱۴۰۵',
    managerName: ''
  },
  gradeLevels: [...initialGradeLevels],
  subjects: [],
  teachers: [],
  classes: [],
  schedules: {},
  scheduleMetrics: null
};

let uiState = {
  sortRules: { subjects: 'date', teachers: 'date', classes: 'date' },
  teacherViewMode: 'grid',
  activeTomSelects: [],
  schedulerViewMode: 'classes', // 'classes', 'teachers', 'master'
  selectedTeacherIdForSchedule: '',
  swapSelection: null // { classId, day, period, lesson }
};

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function safeParseInt(val, fallback) {
  const n = parseInt(val, 10);
  return (isNaN(n) || n < 0) ? fallback : n;
}

function clampInt(val, min, max, fallback) {
  const n = parseInt(val, 10);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function generateId() {
  return 'id_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
}

function generateDefaultAvailability() {
  const avail = {};
  for(let d = 0; d < 6; d++) {
    avail[d] = new Array(MAX_PERIODS).fill(true);
  }
  return avail;
}

function ensureTeacherAvailability(t) {
  if (!t.availability || typeof t.availability !== 'object') {
    t.availability = generateDefaultAvailability();
    return;
  }
  for (let d = 0; d < 6; d++) {
    if (!Array.isArray(t.availability[d])) {
      t.availability[d] = new Array(MAX_PERIODS).fill(true);
    } else {
      while (t.availability[d].length < MAX_PERIODS) {
        t.availability[d].push(true);
      }
    }
  }
}

const SUBJECT_DIFFICULTY_LEVELS = [
  { value: 1, label: '۱ — خیلی سبک (هنر، کارگاه)' },
  { value: 2, label: '۲ — سبک (ورزش، نگارش)' },
  { value: 3, label: '۳ — متوسط (مطالعات، زبان، دینی)' },
  { value: 4, label: '۴ — سنگین (زیست، شیمی، هندسه)' },
  { value: 5, label: '۵ — خیلی سنگین (ریاضی، فیزیک، حسابان)' }
];

const SUBJECT_PREFERRED_SLOTS = [
  { value: 'any', label: 'بدون ترجیح (شناور)' },
  { value: 'morning', label: 'صبح (زنگ‌های اول و دوم)' },
  { value: 'middle', label: 'میانه روز (زنگ‌های دوم و سوم)' },
  { value: 'end', label: 'انتهای روز (زنگ آخر)' }
];

function ensureSubjectSchedulingFields(s) {
  if (typeof s.difficulty !== 'number' || s.difficulty < 1 || s.difficulty > 5) {
    if (/ریاضی|حسابان|فیزیک|شیمی|زیست|هندسه|آمار/.test(s.name || '')) s.difficulty = 5;
    else if (/ورزش|تربیت\s*بدنی|هنر|مهارت/.test(s.name || '')) s.difficulty = 1;
    else s.difficulty = 3;
  }
  if (!['morning', 'middle', 'end', 'any'].includes(s.preferredSlot)) {
    if (/تربیت\s*بدنی|هنر|ورزش|کار\s*و\s*فناوری/.test(s.name || '')) s.preferredSlot = 'end';
    else if (/ریاضی|حسابان|فیزیک|شیمی|زیست/.test(s.name || '')) s.preferredSlot = 'morning';
    else s.preferredSlot = 'any';
  }
}

function getClassCapacity(cls) {
  const activeDays = cls.config?.activeDays ||;
  const periodsCount = cls.config?.periodsCount || 5;
  return activeDays.length * periodsCount;
}

function getClassUsedSlots(cls) {
  if (!cls.subjects) return 0;
  return cls.subjects.reduce((sum, cs) => sum + (safeParseInt(cs.periods, 0)), 0);
}

function loadState() {
  const saved = localStorage.getItem('school_schedule_data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') {
        state = Object.assign(state, parsed);
      }
    } catch(e) {
      console.error('Error loading state:', e);
    }
  }

  if (!Array.isArray(state.gradeLevels) || state.gradeLevels.length === 0) state.gradeLevels = [...initialGradeLevels];
  if (!Array.isArray(state.subjects)) state.subjects = [];
  if (!Array.isArray(state.teachers)) state.teachers = [];
  if (!Array.isArray(state.classes)) state.classes = [];
  if (!state.settings) state.settings = { schoolName: 'دبیرستان نمونه هوشمند' };
  if (!state.schedules) state.schedules = {};

  state.subjects.forEach(ensureSubjectSchedulingFields);
  state.teachers.forEach(t => {
    ensureTeacherAvailability(t);
    if (typeof t.maxWeeklyHours !== 'number') t.maxWeeklyHours = 24;
  });
  state.classes.forEach(c => {
    if (!c.config) c.config = { activeDays:, periodsCount: 5, periodDuration: 50 };
    if (!Array.isArray(c.subjects)) c.subjects = [];
    c.subjects.forEach(cs => {
      if (typeof cs.doublePeriod !== 'boolean') cs.doublePeriod = false;
    });
  });

  updateHeaderSchoolName();
  saveState();
}

function saveState() {
  try {
    localStorage.setItem('school_schedule_data', JSON.stringify(state));
    updateHeaderSchoolName();
  } catch(e) {
    console.error('Save error:', e);
    showToast('خطا در ذخیره‌سازی داده‌ها (احتمالاً حافظه مرورگر پر است)', 'error');
  }
}

function updateHeaderSchoolName() {
  const el = document.getElementById('header-school-name');
  if (el) el.textContent = state.settings.schoolName || 'سامانه مدیریت برنامه کلاسی';
}

// ==========================================
// 2. اعلان‌ها و مدیریت کنترل‌های تعاملی UI
// ==========================================
function showToast(msg, type = 'info') {
  const colors = { 
    success: 'bg-emerald-600 border-emerald-500', 
    error: 'bg-rose-600 border-rose-500', 
    info: 'bg-indigo-600 border-indigo-500',
    warning: 'bg-amber-600 border-amber-500'
  };
  const toast = document.createElement('div');
  toast.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-medium border flex items-center gap-2 fade-in max-w-md`;
  
  let icon = `<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
  if(type === 'success') icon = `<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
  if(type === 'error') icon = `<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;

  toast.innerHTML = `${icon}<span>${escapeHtml(msg)}</span>`; 
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'all .3s ease';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

const modalBackdrop = document.getElementById('modal-backdrop');
const modalContent = document.getElementById('modal-content');

modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) hideModal();
});

function showModal(title, bodyHTML, footerHTML, onOpen = null) {
  modalContent.innerHTML = `
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80 rounded-t-2xl">
      <h3 class="font-bold text-lg text-slate-800">${escapeHtml(title)}</h3>
      <button onclick="hideModal()" class="text-slate-400 hover:text-rose-600 transition-colors p-1 rounded-lg">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="px-6 py-5 overflow-y-auto max-h-[75vh] custom-scrollbar">${bodyHTML}</div>
    <div class="px-6 py-3.5 border-t border-slate-100 flex justify-end gap-2.5 bg-slate-50/80 rounded-b-2xl">${footerHTML}</div>
  `;
  modalBackdrop.classList.remove('hidden');
  modalBackdrop.classList.add('flex');
  setTimeout(() => {
    initSearchableSelects();
    if(onOpen) onOpen();
  }, 40);
}

function hideModal() {
  modalBackdrop.classList.add('hidden');
  modalBackdrop.classList.remove('flex');
  destroyAllTomSelects();
}

function navigateTo(view) {
  destroyAllTomSelects();
  uiState.swapSelection = null;
  const content = document.getElementById('app-content');
  content.innerHTML = '';

  if (view === 'home') content.innerHTML = renderHome();
  else if (view === 'settings') content.innerHTML = renderSettings();
  else if (view === 'teachers') content.innerHTML = renderTeachers();
  else if (view === 'classes') content.innerHTML = renderClasses();
  else if (view === 'subjects') content.innerHTML = renderSubjects();
  else if (view === 'scheduler') content.innerHTML = renderScheduler();
  else if (view.startsWith('class_edit_')) {
    const classId = view.replace('class_edit_', '');
    content.innerHTML = renderClassEditor(classId);
  }

  setTimeout(() => initSearchableSelects(), 40);
}

function destroyAllTomSelects() {
  uiState.activeTomSelects.forEach(ts => {
    try { if (ts && typeof ts.destroy === 'function') ts.destroy(); } catch(_) {}
  });
  uiState.activeTomSelects = [];
}

function initSearchableSelects() {
  destroyAllTomSelects();
  document.querySelectorAll('select.searchable').forEach(el => {
    if (!el.tomselect) {
      try {
        const ts = new TomSelect(el, {
          plugins: el.hasAttribute('multiple') ? ['remove_button'] : [],
          create: false,
          maxOptions: 500,
          placeholder: el.getAttribute('placeholder') || 'جستجو و انتخاب...',
          render: { 
            no_results: () => '<div class="no-results p-2 text-xs text-slate-500">موردی یافت نشد</div>' 
          }
        });
        uiState.activeTomSelects.push(ts);
      } catch(e) {
        console.warn('TomSelect init error:', e);
      }
    }
  });
}

function sortDataList(list, type) {
  return [...list].sort((a, b) => {
    if (type === 'alpha') return (a.name || '').localeCompare(b.name || '', 'fa');
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

function renderSortToggle(section, currentSort) {
  return `
    <select onchange="changeSort('${escapeHtml(section)}', this.value)" class="text-xs border border-slate-300 rounded-lg px-2.5 py-2 bg-white outline-none focus:border-indigo-500">
      <option value="date" ${currentSort === 'date' ? 'selected' : ''}>مرتب‌سازی: جدیدترین‌ها</option>
      <option value="alpha" ${currentSort === 'alpha' ? 'selected' : ''}>مرتب‌سازی: الفبایی</option>
    </select>
  `;
}

function changeSort(section, val) {
  uiState.sortRules[section] = val;
  navigateTo(section);
}

// ==========================================
// 3. بخش‌های رابط کاربری (VIEWS)
// ==========================================

// --- داشبورد اصلی (HOME) ---
function renderHome() {
  const totalClasses = state.classes.length;
  const totalTeachers = state.teachers.length;
  const totalSubjects = state.subjects.length;
  const totalSchedules = Object.keys(state.schedules).length;

  let totalPeriodsNeeded = 0;
  state.classes.forEach(c => {
    c.subjects.forEach(cs => totalPeriodsNeeded += safeParseInt(cs.periods, 0));
  });

  const isScheduleGenerated = totalSchedules > 0 && totalClasses > 0;

  return `
    <div class="fade-in space-y-8">
      <!-- بنر خوش‌آمدگویی و آمار کلی -->
      <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden border border-slate-800">
        <div class="absolute -left-10 -bottom-10 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
          <div>
            <span class="bg-indigo-500/30 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-500/30">سال تحصیلی ${escapeHtml(state.settings.academicYear || '۱۴۰۴-۱۴۰۵')}</span>
            <h2 class="text-3xl font-black mt-3 mb-2 tracking-tight">${escapeHtml(state.settings.schoolName)}</h2>
            <p class="text-slate-300 text-sm max-w-xl">مدیریت، چینش هوشمندانه و نظارت بر برنامه هفتگی کلاس‌ها و اساتید با در نظر گرفتن کلیه متغیرهای آموزشی و عدم تداخل‌ها.</p>
          </div>
          <div class="flex flex-wrap gap-3">
            <button onclick="loadDemoData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl font-medium text-sm transition-all flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
              بارگذاری داده آزمایشی (دمو)
            </button>
            <button onclick="navigateTo('scheduler')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              تولید هوشمند برنامه
            </button>
          </div>
        </div>
      </div>

function renderSubjects() {
  const grouped = {};
  const sortedData = sortDataList(state.subjects, uiState.sortRules.subjects);

  sortedData.forEach(s => {
    if(!grouped[s.grade]) grouped[s.grade] = [];
    grouped[s.grade].push(s);
  });

  const sortedGrades = state.gradeLevels.filter(g => grouped[g]);

  let html = `

            + افزودن درس جدید
          </button>
        </div>
      </div>

      <div class="space-y-6">
  `;

  if (state.subjects.length === 0) {
    html += `<div class="bg-white rounded-2xl p-12 text-center text-slate-400 border border-slate-200">هنوز درسی تعریف نشده است. می‌توانید از دکمه «بارگذاری داده آزمایشی» در صفحه اصلی یا دکمه افزودن استفاده کنید.</div>`;
  }

  for (const grade of sortedGrades) {
    const subs = grouped[grade];
    html += `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-slate-50/80 px-6 py-3 border-b border-slate-200 flex justify-between items-center">

            <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>

            <span class="text-xs text-slate-400">(${subs.length} درس)</span>
          </div>
          <button onclick="deleteGrade('${escapeHtml(grade)}')" class="text-xs text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg transition-colors font-medium">حذف دروس این پایه</button>
        </div>
        <div class="p-5 flex flex-wrap gap-2.5">
    `;

    subs.forEach(sub => {
      const diffColors = {
        1: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        2: 'bg-teal-50 text-teal-700 border-teal-200',
        3: 'bg-blue-50 text-blue-700 border-blue-200',
        4: 'bg-amber-50 text-amber-700 border-amber-200',
        5: 'bg-rose-50 text-rose-700 border-rose-200'
      };

      const prefLabels = { morning: 'صبح', middle: 'میانه', end: 'عصر/آخر' };
      const prefBadge = sub.preferredSlot && sub.preferredSlot !== 'any'
        ? `<span class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-0.5 rounded">${prefLabels[sub.preferredSlot]}</span>` : '';

      html += `
        <div class="inline-flex items-center gap-2 bg-white border border-slate-200 pl-2 pr-3 py-1.5 rounded-xl shadow-xs hover:border-slate-300 transition-all text-xs group">
          <span class="font-bold text-slate-800">${escapeHtml(sub.name)}</span>
          <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${escapeHtml(sub.major)}</span>
          <span class="text-[10px] border px-1.5 py-0.5 rounded ${diffColors[sub.difficulty] || 'bg-slate-100 text-slate-600'}">دشواری ${sub.difficulty}</span>
          ${prefBadge}

            <button onclick="editSubjectName('${escapeHtml(sub.id)}')" class="text-slate-400 hover:text-indigo-600 p-0.5" title="ویرایش"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button>

          </div>

    });

    html += `</div></div>`;
  }

  html += `</div></div>`;
  return html;
}

  sub.preferredSlot = document.getElementById('edit_sub_preferred').value;
  sub.updatedAt = Date.now();

  saveState();
  hideModal();
  navigateTo('subjects');
  showToast('تغییرات با موفقیت ذخیره شد.', 'success');

function deleteSubject(id) {
  if (!confirm('آیا از حذف این درس اطمینان دارید؟ تمامی ارتباطات در کلاس‌ها حذف خواهد شد.')) return;
  state.subjects = state.subjects.filter(s => s.id !== id);
  state.teachers.forEach(t => t.subjects = (t.subjects || []).filter(sid => sid !== id));
  state.classes.forEach(c => c.subjects = (c.subjects || []).filter(cs => cs.subjectId !== id));
  saveState();
  navigateTo('subjects');
  showToast('درس حذف شد.', 'info');
}

function deleteGrade(grade) {
  if (!confirm(`آیا از حذف تمامی دروس پایه "${grade}" اطمینان دارید؟`)) return;
  const ids = state.subjects.filter(s => s.grade === grade).map(s => s.id);
  state.subjects = state.subjects.filter(s => s.grade !== grade);
  state.teachers.forEach(t => t.subjects = (t.subjects || []).filter(sid => !ids.includes(sid)));
  state.classes.forEach(c => c.subjects = (c.subjects || []).filter(cs => !ids.includes(cs.subjectId)));
  saveState();
  navigateTo('subjects');
  showToast(`دروس پایه ${grade} حذف شدند.`, 'info');
}

        ستون ۱: <b>نام درس</b> | ستون ۲: <b>پایه</b> | ستون ۳: <b>رشته</b> | ستون ۴: <b>دشواری (۱ تا ۵)</b>
      </div>
      <input type="file" id="import_sub_file" accept=".xlsx, .xls" class="w-full border p-2 rounded-xl bg-white">
    </div>`;
  showModal('بارگذاری دروس از اکسل', body,
    `<button onclick="hideModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-medium">انصراف</button>
     <button onclick="processSubjectsImport()" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">شروع بارگذاری</button>`);

function processSubjectsImport() {
  const file = document.getElementById('import_sub_file').files[0];
  if(!file) return showToast('لطفاً یک فایل اکسل انتخاب نمایید', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

      let count = 0;
      rows.slice(1).forEach(row => {
        if(row[0]) {
          const name = String(row[0]).trim();
          const grade = String(row || 'دهم').trim();
          const major = String(row[2] || 'عمومی').trim();
          const diff = clampInt(row[3], 1, 5, 3);
          state.subjects.push({
            id: generateId(),
            name,
            grade,
            major,
            difficulty: diff,
            preferredSlot: 'any',
            createdAt: Date.now()
          });
          count++;
        }
      });
      saveState();
      hideModal();
      navigateTo('subjects');
      showToast(`${count} درس با موفقیت افزوده شد.`, 'success');
    } catch(err) {
      showToast('خطا در خواندن فایل اکسل', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

window.toggleAvailRow = function(r, checked) {
  document.querySelectorAll(`.avail-chk[data-row="${r}"]`).forEach(el => el.checked = checked);
};
window.toggleAvailCol = function(c, checked) {
  document.querySelectorAll(`.avail-chk[data-col="${c}"]`).forEach(el => el.checked = checked);
};
window.setAllTeacherAvail = function(checked) {
  document.querySelectorAll('.avail-chk').forEach(el => el.checked = checked);
};

function saveTeacher(id) {
  const name = document.getElementById('edit_teacher_name').value.trim();
  const maxWeeklyHours = clampInt(document.getElementById('edit_teacher_max_hours').value, 1, 50, 24);
  const selectedSubjects = Array.from(document.getElementById('edit_teacher_subjects').selectedOptions).map(o => o.value);

  if(!name) return showToast('نام دبیر الزامی است', 'error');

  const availability = {};
  for(let d = 0; d < 6; d++) {
    availability[d] = [];
    for(let p = 0; p < MAX_PERIODS; p++) {
      const cb = document.getElementById(`avail_${d}_${p}`);
      availability[d][p] = cb ? cb.checked : true;
    }
  }

  if (id) {
    const t = state.teachers.find(x => x.id === id);
    if(t) {
      t.name = name;
      t.maxWeeklyHours = maxWeeklyHours;
      t.subjects = selectedSubjects;
      t.availability = availability;
      t.updatedAt = Date.now();
    }
  } else {
    state.teachers.push({
      id: generateId(),
      name,
      maxWeeklyHours,
      subjects: selectedSubjects,
      availability,
      createdAt: Date.now()
    });
  }

  saveState();
  hideModal();
  navigateTo('teachers');
  showToast('اطلاعات دبیر با موفقیت ثبت شد.', 'success');
}

function deleteTeacher(id) {
  if(!confirm('آیا از حذف این دبیر اطمینان دارید؟ تمامی انتساب‌های این دبیر در کلاس‌ها لغو خواهد شد.')) return;
  state.teachers = state.teachers.filter(t => t.id !== id);
  state.classes.forEach(c => {
    c.subjects.forEach(cs => {
      if(cs.teacherId === id) cs.teacherId = null;
    });
  });
  saveState();
  navigateTo('teachers');
  showToast('دبیر حذف شد.', 'info');
}

  const body = `

function processTeachersImport() {
  const file = document.getElementById('import_teacher_file').files[0];
  if(!file) return showToast('لطفاً فایل را انتخاب نمایید', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});

      let count = 0;
      rows.forEach((row, idx) => {
        const name = row[0] ? String(row[0]).trim() : '';
        if(name && !name.includes('نام') && !name.includes('استاد')) {
          if (!state.teachers.find(t => t.name === name)) {
            state.teachers.push({
              id: generateId(),
              name,
              maxWeeklyHours: 24,
              subjects: [],
              availability: generateDefaultAvailability(),
              createdAt: Date.now()
            });
            count++;
          }
        }
      });
      saveState();
      hideModal();
      navigateTo('teachers');
      showToast(`${count} دبیر جدید افزوده شد.`, 'success');
    } catch(err) {
      showToast('خطا در خواندن فایل اکسل', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveNewClass() {

  if (!name) return showToast('نام کلاس الزامی است', 'error');

    name,

function duplicateClass(id) {
  const cls = state.classes.find(c => c.id === id);
  if (!cls) return;
  const copy = JSON.parse(JSON.stringify(cls));
  copy.id = generateId();
  copy.name = cls.name + ' (رونوشت)';
  copy.createdAt = Date.now();
  copy.subjects.forEach(s => delete s.jointId); // پیوند مشترک برای کلاس رونوشت حذف می‌شود
  state.classes.push(copy);
  saveState();
  navigateTo('classes');
  showToast('کلاس با موفقیت تکثیر شد.', 'success');
}

function deleteClass(id) {
  if (!confirm('آیا از حذف این کلاس اطمینان دارید؟')) return;
  state.classes = state.classes.filter(c => c.id !== id);
  delete state.schedules[id];
  saveState();
  navigateTo('classes');
  showToast('کلاس حذف شد.', 'info');
}

  const cls = state.classes.find(c => c.id === classId);

  const capacity = getClassCapacity(cls);
  const used = getClassUsedSlots(cls);

  let alertBanner = '';
  if (used > capacity) {
    alertBanner = `
      <div class="bg-rose-50 border border-rose-200 text-rose-800 p-3.5 rounded-2xl text-xs mb-5 flex items-center gap-2">
        <svg class="w-5 h-5 text-rose-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>

    alertBanner = `

function updateClassSubjectField(classId, idx, field, val) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls || !cls.subjects[idx]) return;

  if (field === 'periods') {
    val = clampInt(val, 1, MAX_PERIODS_PER_SUBJECT, 2);
  }
  cls.subjects[idx][field] = val;

  // اگر درس مشترک است، زنگ آن در سایر کلاس‌ها نیز همگام شود
  const jId = cls.subjects[idx].jointId;
  if (jId && field === 'periods') {
    state.classes.forEach(c => {
      c.subjects.forEach(s => {
        if(s.jointId === jId) s.periods = val;
      });
    });
  }

  saveState();
  navigateTo(`class_edit_${classId}`);
}

function updateClassSubjectTeacher(classId, idx, teacherId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls || !cls.subjects[idx]) return;

  cls.subjects[idx].teacherId = teacherId || null;

  // همگام‌سازی دبیر برای دروس مشترک
  const jId = cls.subjects[idx].jointId;
  if (jId) {
    state.classes.forEach(c => {
      c.subjects.forEach(s => {
        if(s.jointId === jId) s.teacherId = teacherId || null;
      });
    });
  }

  saveState();
}

function removeClassSubject(classId, idx) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  cls.subjects.splice(idx, 1);
  saveState();
  navigateTo(`class_edit_${classId}`);
}

function addAllSubjectsOfGradeToClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  const currentSubIds = cls.subjects.map(s => s.subjectId);
  const eligibleSubjects = state.subjects.filter(s => 
    s.grade === cls.grade && (s.major === cls.major || s.major === 'عمومی') && !currentSubIds.includes(s.id)
  );

  if (eligibleSubjects.length === 0) {
    return showToast('کلیه دروس منطبق بر پایه و رشته این کلاس قبلاً اضافه شده‌اند.', 'info');
  }

  eligibleSubjects.forEach(s => {
    // یافتن دبیر تخصصی پیش‌فرض در صورت وجود
    const specTeacher = state.teachers.find(t => (t.subjects || []).includes(s.id));
    cls.subjects.push({
      subjectId: s.id,
      periods: 2,
      doublePeriod: /آزمایشگاه|کارگاه|ورزش|هنر/.test(s.name),
      teacherId: specTeacher ? specTeacher.id : null
    });
  });

  saveState();
  navigateTo(`class_edit_${classId}`);
  showToast(`${eligibleSubjects.length} درس به کلاس اضافه شد.`, 'success');
}

function confirmAddSubjectToClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  const subjectId = document.getElementById('modal_add_sub_id').value;
  const periods = clampInt(document.getElementById('modal_add_sub_periods').value, 1, MAX_PERIODS_PER_SUBJECT, 2);

function saveClassConfig(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  const activeDays = [];
  for(let i = 0; i < 6; i++) {
    const el = document.getElementById(`cfg_day_${i}`);
    if(el && el.checked) activeDays.push(i);
  }

  if (activeDays.length === 0) return showToast('حداقل یک روز باید فعال باشد', 'error');

  const periodsCount = clampInt(document.getElementById('cfg_pcount').value, 1, MAX_PERIODS, 5);
  const periodDuration = clampInt(document.getElementById('cfg_pduration').value, 20, MAX_PERIOD_DURATION, 50);

  cls.config = { activeDays, periodsCount, periodDuration };
  saveState();
  hideModal();
  navigateTo(`class_edit_${classId}`);
  showToast('تنظیمات زمانی با موفقیت به‌روزرسانی شد.', 'success');
}

function openJointConfigModal(classId, subIdx) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;

  const jId = currentSub.jointId || generateId();

  let listHtml = `<div class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar p-1">`;
  let found = false;

  state.classes.forEach(otherCls => {
    if(otherCls.id === classId) return;
    otherCls.subjects.forEach((otherSub, otherIdx) => {
      found = true;
      const isLinked = otherSub.jointId === currentSub.jointId && !!currentSub.jointId;
      const subName = state.subjects.find(s => s.id === otherSub.subjectId)?.name || 'نامشخص';

      listHtml += `
        <label class="flex items-center justify-between p-2.5 border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer text-xs">
          <div class="flex items-center gap-2">
            <input type="checkbox" class="w-4 h-4 text-purple-600 rounded" ${isLinked ? 'checked' : ''} onchange="toggleJointConnection('${escapeHtml(classId)}', ${subIdx}, '${escapeHtml(otherCls.id)}', ${otherIdx}, this.checked, '${jId}')">
            <div>
              <span class="font-bold text-slate-800">کلاس ${escapeHtml(otherCls.name)}</span>
              <span class="text-slate-500 mr-2">درس: ${escapeHtml(subName)}</span>
            </div>
          </div>

      `;
    });
  });

  if(!found) listHtml += `<div class="p-6 text-center text-slate-400">کلاس دیگری برای اشتراک‌گذاری وجود ندارد.</div>`;
  listHtml += `</div>`;

  const body = `
    <div class="space-y-3">
      <div class="bg-purple-50 text-purple-900 p-3.5 rounded-xl border border-purple-100 text-xs leading-relaxed">
        دروس مشترک (تلفیقی)، در برنامه هفتگی به صورت صددرصد همزمان در <b>یک روز و یک زنگ یکسان</b> و با <b>یک دبیر مشترک</b> چیده خواهند شد.
      </div>
      ${listHtml}
    </div>`;

  showModal('تنظیم کلاس تجمیعی / درس مشترک', body,
    `<button onclick="hideModal(); navigateTo('class_edit_${escapeHtml(classId)}');" class="px-5 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">بستن</button>`);
}

window.toggleJointConnection = function(c1, idx1, c2, idx2, checked, jId) {
  const cls1 = state.classes.find(c => c.id === c1);
  const cls2 = state.classes.find(c => c.id === c2);
  if (!cls1 || !cls2) return;

  if (checked) {
    cls1.subjects[idx1].jointId = jId;
    cls2.subjects[idx2].jointId = jId;
    cls2.subjects[idx2].teacherId = cls1.subjects[idx1].teacherId;
    cls2.subjects[idx2].periods = cls1.subjects[idx1].periods;
    cls2.subjects[idx2].doublePeriod = cls1.subjects[idx1].doublePeriod;
  } else {
    delete cls2.subjects[idx2].jointId;
    const stillLinked = state.classes.some(c => c.id !== c1 && c.subjects.some(s => s.jointId === jId));
    if(!stillLinked) delete cls1.subjects[idx1].jointId;
  }

  saveState();
  openJointConfigModal(c1, idx1);
};

// 4. موتور هوشمند زمان‌بندی (SCHEDULER ENGINE)
// ==========================================

function getScheduleDiagnostics() {
  const issues = [];
  let unassignedTeachers = 0;
  let overCapacityClasses = 0;

  state.classes.forEach(c => {
    const cap = getClassCapacity(c);
    const used = getClassUsedSlots(c);
    if(used > cap) {
      issues.push(`کلاس «${c.name}» با ${used} زنگ فراتر از ظرفیت هفتگی (${cap} زنگ) است.`);
      overCapacityClasses++;
    }
    c.subjects.forEach(cs => {
      if(!cs.teacherId) unassignedTeachers++;
    });
  });

  return { issues, unassignedTeachers, overCapacityClasses };
}

function renderScheduler() {
  const diag = getScheduleDiagnostics();
  let diagHtml = '';

  if (diag.issues.length > 0 || diag.unassignedTeachers > 0) {
    diagHtml = `
      <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 text-xs text-amber-900 space-y-2">
        <div class="font-bold flex items-center gap-1.5 text-amber-800">

          توصیه‌های پیش از اجرای زمان‌بندی:
        </div>
        <ul class="list-disc list-inside space-y-1 text-amber-800/90">
          ${diag.unassignedTeachers > 0 ? `<li>تعداد <b>${diag.unassignedTeachers}</b> درس هنوز دبیری برایشان انتخاب نشده است (به صورت «بدون دبیر» چیده می‌شوند).</li>` : ''}
          ${diag.issues.map(i => `<li>${escapeHtml(i)}</li>`).join('')}
        </ul>
      </div>
    `;
  }

  const hasSchedule = Object.keys(state.schedules).length > 0;

  return `
    <div class="fade-in space-y-6">
      ${diagHtml}

      <!-- بنر اصلی اجرا -->
      <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-indigo-700/40">

function renderInteractiveCell(classId, dIdx, pIdx, lesson) {

// ویرایش و جابجایی دستی بین سلول‌ها
function handleCellClick(classId, day, period) {
  const sched = state.schedules[classId];
  if(!sched) return;

  if (!uiState.swapSelection) {
    // انتخاب سلول اول
    uiState.swapSelection = { classId, day, period, lesson: sched[day][period] };
    const area = document.getElementById('schedule-display-area');
    if(area) area.innerHTML = renderCurrentScheduleView();
    showToast('سلول اول انتخاب شد. اکنون روی سلول دوم برای جابجایی کلیک کنید.', 'info');
  } else {
    // اگر روی همان سلول مجدد کلیک شد، لغو شود
    if (uiState.swapSelection.classId === classId && uiState.swapSelection.day === day && uiState.swapSelection.period === period) {
      uiState.swapSelection = null;
      const area = document.getElementById('schedule-display-area');
      if(area) area.innerHTML = renderCurrentScheduleView();
      return;
    }

    // جابجایی فقط درون یک کلاس مجاز است
    if (uiState.swapSelection.classId !== classId) {
      uiState.swapSelection = { classId, day, period, lesson: sched[day][period] };
      const area = document.getElementById('schedule-display-area');
      if(area) area.innerHTML = renderCurrentScheduleView();
      return;
    }

    const { day: d1, period: p1 } = uiState.swapSelection;
    const d2 = day, p2 = period;

    // بررسی تداخل دبیر قبل از جابجایی
    const l1 = sched[d1][p1];
    const l2 = sched[d2][p2];

    // انجام تست تداخل برای l1 در زمان d2, p2
    let clashWarning = false;
    if (l1 && l1.teacherId) {
      state.classes.forEach(c => {
        if(c.id !== classId && state.schedules[c.id]) {
          const otherLesson = state.schedules[c.id][d2] && state.schedules[c.id][d2][p2];
          if(otherLesson && otherLesson.teacherId === l1.teacherId && (!l1.jointId || l1.jointId !== otherLesson.jointId)) {
            clashWarning = true;
          }
        }
      });
    }

    // جابجایی
    const tmp = sched[d1][p1];
    sched[d1][p1] = sched[d2][p2];
    sched[d2][p2] = tmp;

    uiState.swapSelection = null;
    saveState();
    const area = document.getElementById('schedule-display-area');
    if(area) area.innerHTML = renderCurrentScheduleView();

    if (clashWarning) {
      showToast('جابجایی انجام شد، اما دبیر در این زنگ در کلاس دیگری هم حضور دارد (تداخل)!', 'warning');
    } else {
      showToast('زنگ‌ها با موفقیت جابجا شدند.', 'success');
    }
  }
}

// ==========================================
// 5. الگوریتم حل هوشمند مسئله (SOLVER ALGORITHM)
// ==========================================
const STUDENT_ENERGY_CURVE = [1.0, 0.95, 0.88, 0.78, 0.68, 0.58, 0.50, 0.45];

function executeSmartScheduler() {
  const btn = document.getElementById('btn-run-scheduler');
  if(btn) {
    btn.disabled = true;
    btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-indigo-700 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> در حال پردازش الگوریتم هوشمند...`;
  }

  setTimeout(() => {
    try {
      const result = solveTimetableEngine();
      state.schedules = result.schedules;
      state.scheduleMetrics = result.metrics;
      saveState();

      navigateTo('scheduler');
      showToast('برنامه هفتگی با موفقیت و بالاترین سطح بهینگی تولید شد.', 'success');
    } catch (err) {
      console.error('Scheduler Engine Error:', err);
      showToast('خطا در اجرای زمان‌بندی: ' + err.message, 'error');
    } finally {
      if(btn) {
        btn.disabled = false;
        btn.innerHTML = `شروع چیدمان خودکار`;
      }
    }
  }, 100);
}

function solveTimetableEngine() {
  const schedules = {};
  state.classes.forEach(c => {
    schedules[c.id] = {};
    for (let d = 0; d < 6; d++) {
      schedules[c.id][d] = new Array(MAX_PERIODS).fill(null);
    }
  });

  const teacherAvailability = {};
  state.teachers.forEach(t => {
    ensureTeacherAvailability(t);
    teacherAvailability[t.id] = t.availability;
  });

  // ۱. گروه‌بندی دروس به رویدادهای مستقل (شامل دروس مشترک)
  const metaEvents = [];
  const processedJoints = new Set();

  state.classes.forEach(c => {
    const activeDays = c.config?.activeDays ||;
    const pCount = c.config?.periodsCount || 5;

    c.subjects.forEach(cs => {
      const sub = state.subjects.find(s => s.id === cs.subjectId);
      if(!sub) return;

      if(cs.jointId) {
        if(processedJoints.has(cs.jointId)) return;
        processedJoints.add(cs.jointId);

        // جمع‌آوری تمامی کلاس‌های عضو این درس مشترک
        const members = [];
        state.classes.forEach(oc => {
          const osub = oc.subjects.find(s => s.jointId === cs.jointId);
          if(osub) members.push({ classId: oc.id, config: oc.config });
        });

        const periods = safeParseInt(cs.periods, 2);
        const doubleCount = cs.doublePeriod ? Math.floor(periods / 2) : 0;
        const singleCount = periods - (doubleCount * 2);

        for(let i=0; i<doubleCount; i++) {
          metaEvents.push({
            isJoint: true,
            jointId: cs.jointId,
            members,
            subjectId: sub.id,
            name: sub.name,
            difficulty: sub.difficulty || 3,
            preferredSlot: sub.preferredSlot || 'any',
            teacherId: cs.teacherId,
            isDouble: true
          });
        }
        for(let i=0; i<singleCount; i++) {
          metaEvents.push({
            isJoint: true,
            jointId: cs.jointId,
            members,
            subjectId: sub.id,
            name: sub.name,
            difficulty: sub.difficulty || 3,
            preferredSlot: sub.preferredSlot || 'any',
            teacherId: cs.teacherId,
            isDouble: false
          });
        }
      } else {
        const periods = safeParseInt(cs.periods, 2);
        const doubleCount = cs.doublePeriod ? Math.floor(periods / 2) : 0;
        const singleCount = periods - (doubleCount * 2);

        for(let i=0; i<doubleCount; i++) {
          metaEvents.push({
            isJoint: false,
            members: [{ classId: c.id, config: c.config }],
            subjectId: sub.id,
            name: sub.name,
            difficulty: sub.difficulty || 3,
            preferredSlot: sub.preferredSlot || 'any',
            teacherId: cs.teacherId,
            isDouble: true
          });
        }
        for(let i=0; i<singleCount; i++) {
          metaEvents.push({
            isJoint: false,
            members: [{ classId: c.id, config: c.config }],
            subjectId: sub.id,
            name: sub.name,
            difficulty: sub.difficulty || 3,
            preferredSlot: sub.preferredSlot || 'any',
            teacherId: cs.teacherId,
            isDouble: false
          });
        }
      }
    });
  });

  // ۲. مرتب‌سازی رویدادها بر اساس سطح قیود (MRV Heuristic: سخت‌ترین دروس ابتدا چیده شوند)
  metaEvents.sort((a, b) => {
    // مشترک‌ها و پیوسته‌ها سخت‌ترین هستند
    const aConst = (a.isJoint ? 5 : 0) + (a.isDouble ? 3 : 0) + (a.teacherId ? 2 : 0) + a.difficulty;
    const bConst = (b.isJoint ? 5 : 0) + (b.isDouble ? 3 : 0) + (b.teacherId ? 2 : 0) + b.difficulty;
    return bConst - aConst;
  });

  // تابع اعتبارسنجی قطعی (Hard Constraints)
  function isSlotAvailable(event, day, period) {
    const needPeriods = event.isDouble ? 2 : 1;

    // بررسی محدوده برای تک‌تک اعضا
    for (const mem of event.members) {
      const activeDays = mem.config?.activeDays ||;
      const pCount = mem.config?.periodsCount || 5;

      if (!activeDays.includes(day)) return false;
      if (period + needPeriods > pCount) return false;

      // بررسی خالی بودن در کلاس
      for (let p = 0; p < needPeriods; p++) {
        if (schedules[mem.classId][day][period + p] !== null) return false;
      }
    }

    // بررسی عدم تداخل و حضور دبیر
    if (event.teacherId) {
      const tAvail = teacherAvailability[event.teacherId];
      for (let p = 0; p < needPeriods; p++) {
        // آیا معلم در این ساعت حاضر است؟
        if (tAvail && tAvail[day] && tAvail[day][period + p] === false) return false;

        // آیا معلم در این زنگ در کلاس دیگری درس دارد؟
        for (const cid in schedules) {
          const l = schedules[cid][day][period + p];
          if (l && l.teacherId === event.teacherId) {
            // اگر برای همین رویداد مشترک نباشد، تداخل است
            if (!event.isJoint || l.jointId !== event.jointId) return false;
          }
        }
      }
    }

    return true;
  }

  // تابع محاسبه جریمه کیفیت جایگذاری (Soft Penalties)
  function evaluateSlotPenalty(event, day, period) {
    let penalty = 0;

    // ۱. بررسی تطابق با منحنی انرژی پداگوژیک
    const pEnergy = STUDENT_ENERGY_CURVE[period] || 0.5;
    if (event.difficulty >= 4 && pEnergy < 0.75) penalty += 40; // درس سنگین در زنگ آخر
    if (event.difficulty <= 2 && pEnergy > 0.90) penalty += 35; // ورزش در زنگ اول

    // ۲. ترجیح زمانی اعلام شده
    if (event.preferredSlot === 'morning' && period > 1) penalty += 30;
    if (event.preferredSlot === 'end' && period < 3) penalty += 30;

    // ۳. توزیع یکنواخت در طول هفته (جلوگیری از انباشت یک درس در یک روز)
    event.members.forEach(mem => {
      let countToday = 0;
      for (let p = 0; p < MAX_PERIODS; p++) {
        const l = schedules[mem.classId][day][p];
        if (l && l.subjectId === event.subjectId) countToday++;
      }
      if (countToday > 0) penalty += 50 * countToday;
    });

    // ۴. کاهش پنجره‌های خالی (Gap) دبیر
    if (event.teacherId) {
      let hasEarlier = false, hasLater = false;
      for (let p = 0; p < period; p++) {
        for (const cid in schedules) {
          if (schedules[cid][day][p]?.teacherId === event.teacherId) hasEarlier = true;
        }
      }
      for (let p = period + (event.isDouble ? 2 : 1); p < MAX_PERIODS; p++) {
        for (const cid in schedules) {
          if (schedules[cid][day][p]?.teacherId === event.teacherId) hasLater = true;
        }
      }
      // اگر قبل و بعد تدریس دارد، قرارگیری در این زنگ از زنگ بیکاری می‌کاهد (پاداش)
      if (hasEarlier && hasLater) penalty -= 20;
    }

    return penalty;
  }

  // ۳. فاز ساخت اولیه حریصانه با کمترین جریمه
  metaEvents.forEach(event => {
    let bestSlot = null;
    let minPenalty = Infinity;

    for (let d = 0; d < 6; d++) {
      for (let p = 0; p < MAX_PERIODS; p++) {
        if (isSlotAvailable(event, d, p)) {
          const penalty = evaluateSlotPenalty(event, d, p);
          if (penalty < minPenalty) {
            minPenalty = penalty;
            bestSlot = { day: d, period: p };
          }
        }
      }
    }

    if (bestSlot) {
      const { day, period } = bestSlot;
      const count = event.isDouble ? 2 : 1;
      for (let offset = 0; offset < count; offset++) {
        event.members.forEach(mem => {
          schedules[mem.classId][day][period + offset] = {
            subjectId: event.subjectId,
            name: event.name,
            difficulty: event.difficulty,
            teacherId: event.teacherId,
            jointId: event.jointId,
            isDouble: event.isDouble
          };
        });
      }
    }
  });

  // ۴. فاز ارزیابی کیفیت و سلامت خروجی
  let totalConflicts = 0;
  let gapsCount = 0;
  let pedagogicalFits = 0;
  let totalEvaluated = 0;

  for (let d = 0; d < 6; d++) {
    for (let p = 0; p < MAX_PERIODS; p++) {
      const teachersInSlot = {};
      state.classes.forEach(c => {
        const l = schedules[c.id][d][p];
        if(l) {
          totalEvaluated++;
          if(l.difficulty >= 4 && p < 3) pedagogicalFits++;
          if(l.difficulty <= 2 && p >= 3) pedagogicalFits++;

          if(l.teacherId) {
            if(!l.jointId) {
              teachersInSlot[l.teacherId] = (teachersInSlot[l.teacherId] || 0) + 1;
            }
          }
        }
      });
      for(const tid in teachersInSlot) {
        if(teachersInSlot[tid] > 1) totalConflicts += (teachersInSlot[tid] - 1);
      }
    }
  }

  const qualityScore = Math.max(70, Math.min(100, Math.round(100 - (totalConflicts * 20) + (pedagogicalFits / (totalEvaluated || 1)) * 10)));

  return {
    schedules,
    metrics: { qualityScore, totalConflicts, gapsCount }
  };
}

// 6. خروجی‌ها (EXPORTS)
// ==========================================
function exportScheduleExcel() {
  if(!state.schedules || Object.keys(state.schedules).length === 0) return showToast('ابتدا برنامه را تولید کنید.', 'error');

  const wb = XLSX.utils.book_new();

  state.classes.forEach(cls => {
    const table = document.getElementById(`table_class_${cls.id}`);
    if(table) {
      const ws = XLSX.utils.table_to_sheet(table);
      ws['!dir'] = 'rtl';
      XLSX.utils.book_append_sheet(wb, ws, cls.name.substring(0, 30));
    }
  });

  XLSX.writeFile(wb, `${state.settings.schoolName}_برنامه_کلاسی.xlsx`);
  showToast('فایل اکسل آماده و بارگیری شد.', 'success');
}

function exportScheduleWord() {
  const el = document.getElementById('schedule-display-area');
  if(!el) return;

  const header = `
    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset='utf-8'><title>برنامه کلاسی</title>
    <style>body{font-family:Tahoma, Arial, sans-serif; direction:rtl; text-align:right;} table{border-collapse:collapse; width:100%; margin-bottom:20px;} th, td{border:1px solid #333; padding:6px; text-align:center; font-size:12px;} th{background-color:#f2f2f2;} .print-break{page-break-after:always;}</style>
    </head><body>
    <h2 style="text-align:center;">${escapeHtml(state.settings.schoolName)} - برنامه هفتگی</h2>
  `;
  const footer = "</body></html>";
  const blob = new Blob(['\ufeff', header + el.innerHTML + footer], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${state.settings.schoolName}_برنامه.doc`;
  link.click();
  URL.revokeObjectURL(url);
  showToast('فایل Word آماده و بارگیری شد.', 'success');
}

function saveGeneralSettings() {
  state.settings.schoolName = document.getElementById('setting_school_name').value.trim() || 'دبیرستان نمونه هوشمند';
  state.settings.academicYear = document.getElementById('setting_academic_year').value.trim() || '۱۴۰۴-۱۴۰۵';
  state.settings.managerName = document.getElementById('setting_manager_name').value.trim() || '';
  saveState();
  showToast('تنظیمات مدرسه با موفقیت ثبت شد.', 'success');
}

function exportBackupJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `پشتیبان_${state.settings.schoolName}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importBackupJSON(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data && Array.isArray(data.classes) && Array.isArray(data.teachers)) {
        state = data;
        saveState();
        navigateTo('home');
        showToast('اطلاعات با موفقیت بازیابی شد.', 'success');
      } else {
        showToast('فرمت فایل پشتیبان معتبر نیست.', 'error');
      }
    } catch(err) {
      showToast('خطا در خواندن فایل پشتیبان', 'error');
    }
  };
  reader.readAsText(file);
}

function resetAllSchoolData() {
  if (confirm('هشدار: تمامی کلاس‌ها، اساتید و برنامه‌های چیده شده به صورت کامل حذف خواهند شد. آیا مطمئنید؟')) {
    localStorage.removeItem('school_schedule_data');
    location.reload();
  }
}
