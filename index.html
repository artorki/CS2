<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نرم‌افزار هوشمند زمان‌بندی مدارس (نسخه حرفه‌ای)</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- SheetJS for Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous"></script>

<!-- html2pdf for PDF Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

<!-- TomSelect for Searchable Dropdowns -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js" crossorigin="anonymous"></script>

<!-- Vazirmatn Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root { --primary: #4f46e5; --primary-hover: #4338ca; }
  * { font-family: 'Vazirmatn', system-ui, sans-serif; }
  body { background-color: #f8fafc; color: #334155; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  
  .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  
  .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
  
  /* TomSelect Customization */
  .ts-control { border-radius: 0.75rem; border-color: #cbd5e1; padding: 0.6rem 1rem; font-family: inherit; }
  .ts-control.focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
  .ts-dropdown { text-align: right; border-radius: 0.75rem; font-family: inherit; z-index: 9999; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
  .ts-dropdown .option { padding: 0.6rem 1rem; cursor: pointer; transition: background 0.1s; }
  .ts-dropdown .active { background-color: #eef2ff; color: var(--primary); font-weight: 500; }
  .ts-dropdown .optgroup-header { font-weight: 700; background-color: #f1f5f9; color: #475569; padding: 0.5rem 1rem; }

  /* Print Styles */
  @media print {
    body { background: white !important; }
    .no-print { display: none !important; }
    .print-area { padding: 0 !important; }
    .page-break { page-break-after: always; }
  }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 left-5 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-indigo-700 to-indigo-900 text-white shadow-lg sticky top-0 z-40 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer group" onclick="navigateTo('home')">
        <div class="bg-white/20 p-2 rounded-xl group-hover:bg-white/30 transition">
          <svg class="w-6 h-6 text-indigo-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
        </div>
        <div>
            <h1 class="font-black text-lg tracking-tight">نرم‌افزار زمان‌بندی مدارس</h1>
            <p class="text-[10px] text-indigo-200 font-medium -mt-1" id="header-school-name">نسخه حرفه‌ای + امکانات یکپارچه</p>
        </div>
      </div>
      <nav class="hidden md:flex gap-1 bg-black/20 p-1 rounded-xl">
        <button onclick="navigateTo('home')" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-white/20 transition">داشبورد</button>
        <button onclick="navigateTo('scheduler')" class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium bg-white text-indigo-900 shadow hover:bg-indigo-50 transition">زمان‌بند هوشمند</button>
      </nav>
      <button onclick="navigateTo('home')" class="md:hidden bg-white/20 p-2 rounded-lg"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="app-content"></main>

  <!-- Modal Backdrop -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[100] overflow-y-auto py-10 items-start justify-center opacity-0 transition-opacity duration-300">
    <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl flex flex-col overflow-hidden mx-4 transform scale-95 transition-transform duration-300 relative"></div>
  </div>

<script>
/* ==========================================
   1. CORE STATE & DATA MODELS
========================================== */
const CONSTANTS = {
    GRADES: ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم', 'یازدهم', 'دوازدهم'],
    MAJORS: ['عمومی', 'ریاضی فیزیک', 'علوم تجربی', 'علوم انسانی', 'فنی و حرفه‌ای', 'کاردانش'],
    DAYS: ['شنبه', 'یک‌شنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه'],
    MAX_PERIODS: 8,
    DIFFICULTY_LEVELS: [
        { v: 1, l: 'بسیار سبک (نیاز به تمرکز کم)' },
        { v: 2, l: 'سبک' },
        { v: 3, l: 'متوسط (پیش‌فرض)' },
        { v: 4, l: 'سنگین (تئوری/محاسباتی)' },
        { v: 5, l: 'بسیار سنگین' }
    ],
    PREFERRED_SLOTS: [
        { v: 'any', l: 'هر زمانی در روز (بدون ترجیح)' },
        { v: 'morning', l: 'ابتدای روز (زنگ‌های اول و دوم)' },
        { v: 'end', l: 'انتهای روز (زنگ آخر)' },
        { v: 'first_or_last', l: 'فقط زنگ اول یا زنگ آخر روز' }
    ]
};

let state = {
    settings: { schoolName: 'نام مدرسه خود را تنظیم کنید' },
    subjects: [], // { id, name, grade, major, difficulty, preferredSlot }
    teachers: [], // { id, name, subjects[], availability[6][MAX] }
    classes: [],  // { id, name, grade, major, config{}, subjects[{ subjectId, periods, teacherId, doublePeriod }] }
    linkedGroups: [], // { id, name, classIds[], subjectId, teacherId, periods, isDouble, difficulty, preferredSlot }
    schedules: {}
};

let uiState = { activeTomSelects: [], teacherViewMode: 'grid' };

/* STREAMING_CHUNK:Initializing Utility Functions... */
const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
const generateId = () => 'id_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
const safeInt = (val, min, max, fallback) => { let n = parseInt(val); return (isNaN(n) || n < min || n > max) ? fallback : n; };

function showToast(msg, type = 'info') {
    const icons = { success: '✅', error: '❌', info: '💡', warning: '⚠️' };
    const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-indigo-600', warning: 'bg-amber-500' };
    const toast = document.createElement('div');
    toast.className = `${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg font-medium flex items-center gap-3 fade-in pointer-events-auto transition-opacity duration-300`;
    toast.innerHTML = `<span class="text-xl">${icons[type]}</span><span>${escapeHtml(msg)}</span>`;
    const container = document.getElementById('toast-container');
    container.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
}

/* STREAMING_CHUNK:Loading and Validating State... */
function loadState() {
    try {
        const saved = localStorage.getItem('school_data_pro');
        if (saved) {
            const parsed = JSON.parse(saved);
            state = { ...state, ...parsed };
        }
    } catch (e) { console.error("Corrupted save file", e); showToast('خطا در بارگذاری اطلاعات ذخیره شده.', 'error'); }

    state.subjects.forEach(s => {
        s.difficulty = safeInt(s.difficulty, 1, 5, 3);
        if (!['any', 'morning', 'end', 'first_or_last'].includes(s.preferredSlot)) s.preferredSlot = 'any';
    });
    state.teachers.forEach(t => {
        if (!t.availability || t.availability.length < 6) {
            t.availability = Array.from({length: 6}, () => Array(CONSTANTS.MAX_PERIODS).fill(true));
        }
    });
    if (!state.linkedGroups) state.linkedGroups = [];
    document.getElementById('header-school-name').textContent = state.settings.schoolName;
    saveState();
}

function saveState() {
    localStorage.setItem('school_data_pro', JSON.stringify(state));
    document.getElementById('header-school-name').textContent = state.settings.schoolName;
}

/* STREAMING_CHUNK:Modal and Navigation Logic... */
function showModal(title, bodyHTML, footerHTML, onOpen = null) {
    const backdrop = document.getElementById('modal-backdrop');
    const content = document.getElementById('modal-content');
    content.innerHTML = `
        <div class="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/80">
            <h3 class="font-black text-xl text-slate-800">${escapeHtml(title)}</h3>
            <button onclick="hideModal()" class="text-slate-400 hover:text-red-500 bg-white hover:bg-red-50 p-2 rounded-xl transition"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="px-8 py-6 flex-1 overflow-visible text-slate-700">${bodyHTML}</div>
        <div class="px-8 py-5 border-t border-slate-100 bg-slate-50/80 flex justify-end gap-3">${footerHTML}</div>
    `;
    backdrop.classList.remove('hidden');
    backdrop.classList.add('flex');
    setTimeout(() => {
        backdrop.style.opacity = '1';
        content.style.transform = 'scale(1)';
        initTomSelects();
        if (onOpen) onOpen();
    }, 10);
}

function hideModal() {
    const backdrop = document.getElementById('modal-backdrop');
    const content = document.getElementById('modal-content');
    backdrop.style.opacity = '0';
    content.style.transform = 'scale(0.95)';
    setTimeout(() => {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
        destroyTomSelects();
    }, 300);
}

function initTomSelects() {
    destroyTomSelects();
    document.querySelectorAll('select.searchable').forEach(el => {
        if (!el.tomselect) {
            uiState.activeTomSelects.push(new TomSelect(el, {
                create: false, sortField: { field: "text", direction: "asc" },
                render: { no_results: function() { return '<div class="p-3 text-sm text-slate-500">موردی یافت نشد.</div>'; } }
            }));
        }
    });
}
function destroyTomSelects() {
    uiState.activeTomSelects.forEach(ts => { try { ts.destroy(); } catch (e) {} });
    uiState.activeTomSelects = [];
}

function navigateTo(view, param = null) {
    destroyTomSelects();
    const c = document.getElementById('app-content');
    if (view === 'home') c.innerHTML = viewHome();
    else if (view === 'subjects') c.innerHTML = viewSubjects();
    else if (view === 'teachers') c.innerHTML = viewTeachers();
    else if (view === 'classes') c.innerHTML = viewClasses();
    else if (view === 'class_edit') c.innerHTML = viewClassEdit(param);
    else if (view === 'linked') c.innerHTML = viewLinkedGroups();
    else if (view === 'scheduler') c.innerHTML = viewScheduler();
    else if (view === 'settings') c.innerHTML = viewSettings();
    setTimeout(initTomSelects, 50);
}

/* ==========================================
   2. VIEWS (UI GENERATION)
========================================== */

/* STREAMING_CHUNK:Rendering Dashboard... */
function viewHome() {
    const stats = [
        { label: 'کلاس‌ها', val: state.classes.length, icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4', c: 'from-blue-500 to-blue-600', r: 'classes' },
        { label: 'اساتید', val: state.teachers.length, icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z', c: 'from-emerald-500 to-emerald-600', r: 'teachers' },
        { label: 'دروس مدرسه', val: state.subjects.length, icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253', c: 'from-purple-500 to-purple-600', r: 'subjects' },
        { label: 'کلاس‌های ادغامی (مشترک)', val: state.linkedGroups.length, icon: 'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1', c: 'from-pink-500 to-pink-600', r: 'linked' },
    ];
    
    let h = `<div class="fade-in space-y-8">
        <div class="glass-panel p-8 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-6 bg-gradient-to-br from-white to-slate-50">
            <div>
                <h2 class="text-3xl font-black text-slate-800 mb-2">به سامانه حرفه‌ای زمان‌بندی خوش آمدید</h2>
                <p class="text-slate-500 text-lg">برای شروع، اطلاعات پایه (دروس، اساتید، کلاس‌ها) را تکمیل کنید و سپس الگوریتم هوشمند را اجرا نمایید.</p>
            </div>
            <button onclick="navigateTo('scheduler')" class="shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-200 transition-all hover:scale-105 flex items-center gap-3">
                <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                ساخت برنامه کلاسی
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">`;
    
    stats.forEach(s => {
        h += `<div onclick="navigateTo('${s.r}')" class="glass-panel p-6 rounded-3xl cursor-pointer hover:-translate-y-2 hover:shadow-xl transition-all group relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-gradient-to-br ${s.c} opacity-10 rounded-full group-hover:scale-150 transition-transform"></div>
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${s.c} text-white flex items-center justify-center shadow-lg mb-4">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${s.icon}"/></svg>
                </div>
                <h3 class="text-slate-500 font-medium">${s.label}</h3>
                <p class="text-3xl font-black text-slate-800 mt-1">${s.val}</p>
              </div>`;
    });
    
    h += `</div>
        <div class="flex justify-center mt-8">
            <button onclick="navigateTo('settings')" class="text-slate-400 hover:text-slate-600 flex items-center gap-2 font-medium bg-white px-6 py-2 rounded-xl shadow-sm border border-slate-200"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg> تنظیمات و پشتیبان‌گیری</button>
        </div>
    </div>`;
    return h;
}

/* STREAMING_CHUNK:Rendering Subjects... */
function viewSubjects() {
    let html = `<div class="fade-in space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h2 class="text-2xl font-black text-slate-800 flex items-center gap-3">
                    <span class="bg-purple-100 text-purple-600 p-2 rounded-xl"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg></span>
                    مدیریت دروس مدرسه
                </h2>
                <p class="text-sm text-slate-500 mt-1">مشخصات دروس، سطح دشواری و زمان‌های ترجیحی آن‌ها را اینجا تعریف کنید.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="openImportSubjectsModal()" class="bg-white border-2 border-purple-600 text-purple-700 hover:bg-purple-50 px-4 py-2.5 rounded-xl font-bold shadow-sm transition">ورود از فایل</button>
                <button onclick="subjectModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md transition-all flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> افزودن درس جدید
                </button>
            </div>
        </div>
        <div class="grid grid-cols-1 gap-4">`;

    if (state.subjects.length === 0) {
        html += `<div class="text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300 text-slate-400 font-medium">هیچ درسی ثبت نشده است.</div>`;
    } else {
        const byGrade = {};
        state.subjects.forEach(s => { (byGrade[s.grade] = byGrade[s.grade] || []).push(s); });
        CONSTANTS.GRADES.forEach(g => {
            if (!byGrade[g]) return;
            html += `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-50/80 px-6 py-4 border-b border-slate-200 font-black text-slate-700 flex justify-between items-center">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-purple-500"></div> پایه ${g}</div>
                    <button onclick="deleteGrade('${g}')" class="text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition font-bold">حذف کامل پایه</button>
                </div>
                <div class="p-6 flex flex-wrap gap-3">`;
            byGrade[g].forEach(sub => {
                const diffLabel = CONSTANTS.DIFFICULTY_LEVELS.find(d=>d.v===sub.difficulty)?.l.split(' ')[0] || 'متوسط';
                const prefLabel = CONSTANTS.PREFERRED_SLOTS.find(p=>p.v===sub.preferredSlot)?.l.split(' ')[0] || 'هر زمان';
                html += `<div class="flex flex-col bg-slate-50 border border-slate-200 rounded-xl overflow-hidden group hover:border-purple-300 hover:shadow-md transition-all w-64">
                    <div class="p-3 flex justify-between items-start border-b border-slate-100 bg-white">
                        <div class="font-bold text-slate-800 truncate pr-1" title="${escapeHtml(sub.name)}">${escapeHtml(sub.name)}</div>
                        <div class="flex gap-1 shrink-0">

function saveSubject(id) {
    const name = document.getElementById('sub_name').value.trim();
    if (!name) return showToast('نام درس الزامی است', 'error');
    
    const data = {
        name: name.slice(0, 100),
        grade: document.getElementById('sub_grade').value,
        major: document.getElementById('sub_major').value,
        difficulty: safeInt(document.getElementById('sub_diff').value, 1, 5, 3),
        preferredSlot: document.getElementById('sub_pref').value
    };

    if (id) {
        const idx = state.subjects.findIndex(s => s.id === id);
        if (idx !== -1) state.subjects[idx] = { ...state.subjects[idx], ...data };
    } else {
        state.subjects.push({ id: generateId(), ...data });
    }
    saveState(); hideModal(); navigateTo('subjects'); showToast('درس با موفقیت ذخیره شد.', 'success');
}

function deleteSubject(id) {
    if (!confirm('آیا از حذف این درس اطمینان دارید؟ تمام ارتباطات آن با اساتید و کلاس‌ها نیز پاک می‌شود.')) return;
    state.subjects = state.subjects.filter(s => s.id !== id);
    state.teachers.forEach(t => t.subjects = t.subjects.filter(sid => sid !== id));
    state.classes.forEach(c => c.subjects = c.subjects.filter(cs => cs.subjectId !== id));
    state.linkedGroups = state.linkedGroups.filter(lg => lg.subjectId !== id);
    saveState(); navigateTo('subjects'); showToast('درس حذف شد', 'success');
}

function deleteGrade(grade) {
    if(!confirm(`آیا از حذف کامل پایه "${grade}" و تمام دروس و کلاس‌های مرتبط آن اطمینان دارید؟`)) return;
    const subjectIds = state.subjects.filter(s => s.grade === grade).map(s => s.id);
    const classIds = state.classes.filter(c => c.grade === grade).map(c => c.id);

    state.subjects = state.subjects.filter(s => s.grade !== grade);
    state.classes = state.classes.filter(c => c.grade !== grade);
    
    state.teachers.forEach(t => {
        t.subjects = t.subjects.filter(sid => !subjectIds.includes(sid));
    });

    state.linkedGroups = state.linkedGroups.filter(lg => {
        lg.classIds = lg.classIds.filter(cid => !classIds.includes(cid));
        return lg.classIds.length >= 2 && !subjectIds.includes(lg.subjectId);
    });

    saveState(); navigateTo('subjects'); showToast(`پایه ${grade} پاکسازی شد`, 'success');
}

function processSubjectsImport() {
    const file = document.getElementById('import_sub_file').files[0];
    if(!file) return showToast('لطفا یک فایل انتخاب کنید', 'error');
    const defGrade = document.getElementById('import_sub_grade').value;
    const defMajor = document.getElementById('import_sub_major').value;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheetName = workbook.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

            let count = 0;
            json.slice(1).forEach(row => {
                if(row[0]) {
                    const subName = String(row[0]).trim().slice(0, 100);
                    const subGrade = CONSTANTS.GRADES.includes(String(row[1]).trim()) ? String(row[1]).trim() : defGrade;
                    const subMajor = CONSTANTS.MAJORS.includes(String(row[2]).trim()) ? String(row[2]).trim() : defMajor;
                    const subDiff = safeInt(row[3], 1, 5, 3);
                    
                    const prefRaw = String(row[4] || '').trim().toLowerCase();
                    let subPref = 'any';
                    if (['صبح', 'morning', 'اول', 'اول روز'].includes(prefRaw)) subPref = 'morning';
                    if (['آخر', 'end', 'آخر روز', 'زنگ آخر'].includes(prefRaw)) subPref = 'end';

                    state.subjects.push({ id: generateId(), name: subName, grade: subGrade, major: subMajor, difficulty: subDiff, preferredSlot: subPref });
                    count++;
                }
            });
            saveState(); hideModal(); navigateTo('subjects'); showToast(`${count} درس با موفقیت اضافه شد`, 'success');
        } catch(err) { showToast('خطا در خواندن فایل اکسل', 'error'); console.error(err); }
    };
    reader.readAsArrayBuffer(file);
}

    if (!name) return showToast('نام استاد الزامی است', 'error');
    
    const subs = Array.from(document.getElementById('t_subs').selectedOptions).map(o => o.value);
    
    let avail = Array.from({length: 6}, () => Array(CONSTANTS.MAX_PERIODS).fill(false));
    let hasAvail = false;
    for(let d=0; d<6; d++) {
        for(let p=0; p<CONSTANTS.MAX_PERIODS; p++) {
            const el = document.getElementById(`ta_${d}_${p}`);
            if (el && el.checked) { avail[d][p] = true; hasAvail = true; }
        }
    }

    if (!hasAvail) showToast('هشدار: این استاد هیچ زمان آزادی ندارد!', 'warning');

    const data = { name: name.slice(0, 100), subjects: subs, availability: avail };

    if (id) {
        const idx = state.teachers.findIndex(x => x.id === id);
        if (idx !== -1) state.teachers[idx] = { ...state.teachers[idx], ...data };
        state.classes.forEach(c => c.subjects.forEach(cs => { if(cs.teacherId === id && !subs.includes(cs.subjectId)) cs.teacherId = null; }));
        state.linkedGroups.forEach(lg => { if(lg.teacherId === id && !subs.includes(lg.subjectId)) lg.teacherId = null; });
    } else {
        state.teachers.push({ id: generateId(), ...data });
    }
    saveState(); hideModal(); navigateTo('teachers'); showToast('اطلاعات استاد ذخیره شد.', 'success');
}

function deleteTeacher(id) {
    if (!confirm('آیا از حذف این استاد اطمینان دارید؟')) return;
    state.teachers = state.teachers.filter(t => t.id !== id);
    state.classes.forEach(c => c.subjects.forEach(cs => { if(cs.teacherId === id) cs.teacherId = null; }));
    state.linkedGroups.forEach(lg => { if(lg.teacherId === id) lg.teacherId = null; });
    saveState(); navigateTo('teachers'); showToast('استاد حذف شد', 'success');
}

function openImportTeachersModal() {
    const body = `<div class="space-y-4">

            لطفاً فایل اکسل خود را انتخاب کنید. سیستم اسامی موجود در <b>ستون اول</b> فایل را به عنوان نام اساتید شناسایی و ثبت می‌کند. زمان آزاد آن‌ها به صورت پیش‌فرض کاملاً آزاد در نظر گرفته خواهد شد.
        </div>
        <input type="file" id="import_teacher_file" accept=".xlsx" class="w-full border-2 border-slate-200 p-2.5 rounded-xl bg-white">
    </div>`;
    showModal('افزودن اساتید از فایل', body, `<button onclick="hideModal()" class="px-6 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-medium transition">انصراف</button><button onclick="processTeachersImport()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md transition">بارگذاری فایل</button>`);
}

function processTeachersImport() {
    const file = document.getElementById('import_teacher_file').files[0];
    if(!file) return showToast('لطفا فایل اکسل را انتخاب کنید', 'error');

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheetName = workbook.SheetNames[0];
            const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

            let count = 0;
            json.forEach((row, index) => {
                const name = row[0];
                if (name && typeof name === 'string' && name.trim().length > 0) {
                    if (index === 0 && (name.includes('نام') || name.includes('استاد') || name.includes('Name'))) return;
                    const cleanName = name.trim().slice(0, 100);
                    if (!state.teachers.find(t => t.name === cleanName)) {
                        state.teachers.push({
                            id: generateId(), name: cleanName, subjects: [],
                            availability: Array.from({length: 6}, () => Array(CONSTANTS.MAX_PERIODS).fill(true))
                        });
                        count++;
                    }
                }
            });
            saveState(); hideModal(); navigateTo('teachers');
            if (count > 0) showToast(`${count} استاد جدید با موفقیت اضافه شد.`, 'success');
            else showToast('استاد جدیدی یافت نشد (یا تکراری بودند).', 'warning');
        } catch(err) { showToast('خطا در خواندن فایل اکسل', 'error'); console.error(err); }
    };
    reader.readAsArrayBuffer(file);
}

function saveClassConfig(id) {

function addClassSubjectModal(id) {
    const cls = state.classes.find(c => c.id === id);
    const existingIds = cls.subjects.map(cs => cs.subjectId);
    const availSubs = state.subjects.filter(s => !existingIds.includes(s.id) && (s.grade === cls.grade && (s.major === cls.major || s.major === 'عمومی')));
    const otherSubs = state.subjects.filter(s => !existingIds.includes(s.id) && !availSubs.includes(s));

function saveNewCS(id) {
    const cls = state.classes.find(c => c.id === id);
    const sid = document.getElementById('ncs_id').value;
    if (!sid) return showToast('لطفاً درسی انتخاب کنید', 'error');
    
    const p = safeInt(document.getElementById('ncs_p').value, 1, 10, 2);
    const d = document.getElementById('ncs_d').checked;
    
    const specT = state.teachers.find(t => t.subjects.includes(sid));
    
    cls.subjects.push({ subjectId: sid, periods: p, doublePeriod: d, teacherId: specT ? specT.id : null });
    saveState(); hideModal(); navigateTo('class_edit', id); showToast('درس اضافه شد', 'success');
}

function addAllGradeSubjectsToClass(classId) {
    const cls = state.classes.find(c => c.id === classId);
    if (!cls) return;
    const existingSubIds = cls.subjects.map(cs => cs.subjectId);
    const availableSubjects = state.subjects.filter(s => !existingSubIds.includes(s.id) && s.grade === cls.grade && (s.major === cls.major || s.major === 'عمومی'));

    if (availableSubjects.length === 0) return showToast('تمام دروس مرتبط قبلاً اضافه شده‌اند.', 'info');

    availableSubjects.forEach(sub => {
        const specT = state.teachers.find(t => t.subjects.includes(sub.id));
        cls.subjects.push({ subjectId: sub.id, periods: 2, doublePeriod: false, teacherId: specT ? specT.id : null });
    });
    
    saveState(); navigateTo('class_edit', classId);
    showToast(`${availableSubjects.length} درس با موفقیت اضافه شد.`, 'success');
}

function updateCS(cid, sIdx, field, val) {
    const cls = state.classes.find(c => c.id === cid);
    if(field === 'periods') val = safeInt(val, 1, 10, 2);
    cls.subjects[sIdx][field] = val || null;
    saveState();
}
function removeCS(cid, sIdx) {
    if(!confirm('حذف این درس از کلاس؟')) return;
    state.classes.find(c => c.id === cid).subjects.splice(sIdx, 1);
    saveState(); navigateTo('class_edit', cid);
}

function saveLinked(id) {
    const name = document.getElementById('lg_name').value.trim();
    const tId = document.getElementById('lg_t').value;
    const sId = document.getElementById('lg_s').value;
    const cIds = Array.from(document.getElementById('lg_c').selectedOptions).map(o=>o.value);
    
    if (!name) return showToast('عنوان گروه الزامی است', 'error');
    if (!tId) return showToast('انتخاب استاد الزامی است', 'error');
    if (!sId) return showToast('انتخاب درس پایه الزامی است', 'error');
    if (cIds.length < 2) return showToast('حداقل ۲ کلاس باید انتخاب شود', 'error');

    const commonDays = cIds.reduce((acc, cid) => {
        const c = state.classes.find(x=>x.id===cid);
        return acc.filter(d => c.config.activeDays.includes(d));
    }, [0,1,2,3,4,5]);
    
    if (commonDays.length === 0) return showToast('خطا: کلاس‌های انتخاب شده هیچ روز فعالی مشترکی در هفته ندارند!', 'error');

    const data = {
        name: name.slice(0, 100), teacherId: tId, subjectId: sId, classIds: cIds,
        periods: safeInt(document.getElementById('lg_p').value, 1, 5, 1),
        isDouble: document.getElementById('lg_d').checked,
        preferredSlot: document.getElementById('lg_pref').value,
        difficulty: safeInt(document.getElementById('lg_diff').value, 1, 5, 3)
    };

    if (id) {
        const idx = state.linkedGroups.findIndex(x => x.id === id);
        if(idx !== -1) state.linkedGroups[idx] = { ...state.linkedGroups[idx], ...data };
    } else {
        state.linkedGroups.push({ id: generateId(), ...data });
    }
    
    const teacher = state.teachers.find(t=>t.id===tId);
    if(teacher && !teacher.subjects.includes(sId)) teacher.subjects.push(sId);

    saveState(); hideModal(); navigateTo('linked'); showToast('گروه مشترک ذخیره شد', 'success');
}

function deleteLinked(id) {
    if(!confirm('حذف این گروه مشترک؟')) return;
    state.linkedGroups = state.linkedGroups.filter(x => x.id !== id);
    saveState(); navigateTo('linked'); showToast('حذف شد', 'success');
}

function runSA() {
    if (schedulerWorker) { schedulerWorker.terminate(); schedulerWorker = null; }
    
    document.getElementById('btn-run-sa').disabled = true;
    document.getElementById('btn-run-sa').classList.add('opacity-50', 'cursor-not-allowed');
    document.getElementById('sa-progress-container').classList.remove('hidden');
    document.getElementById('sa-progress-container').classList.add('flex');
    document.getElementById('schedule-results').innerHTML = '';

    const payload = {
        classes: state.classes.map(c => ({ id: c.id, activeDays: c.config.activeDays, pCount: c.config.periodsCount, subjects: c.subjects })),
        teachers: state.teachers.map(t => ({ id: t.id, avail: t.availability })),
        subjects: state.subjects,
        linkedGroups: state.linkedGroups,
        constants: CONSTANTS
    };

    const workerCode = `
    const STUDENT_ENERGY = [1.0, 0.95, 0.90, 0.82, 0.76, 0.70, 0.64, 0.58];
    
    self.onmessage = function(e) {
        const data = e.data;
        const result = runAlgorithm(data);
        self.postMessage(result);
    };

    function runAlgorithm(data) {
        const { classes, teachers, subjects, linkedGroups, constants } = data;
        let blocks = [];
        
        linkedGroups.forEach(lg => {
            const sub = subjects.find(s=>s.id===lg.subjectId);
            for(let i=0; i<lg.periods; i++) {
                blocks.push({
                    id: 'lg_' + lg.id + '_' + i, classIds: lg.classIds, teacherId: lg.teacherId,
                    subjectId: lg.subjectId, isDouble: lg.isDouble, difficulty: lg.difficulty,
                    preferredSlot: lg.preferredSlot, name: lg.name + (sub ? ' ('+sub.name+')' : '')
                });
            }
        });

        classes.forEach(c => {
            c.subjects.forEach(cs => {
                const sub = subjects.find(s=>s.id===cs.subjectId);
                if(!sub) return;
                for(let i=0; i<cs.periods; i++) {
                    blocks.push({
                        id: 'cs_' + c.id + '_' + cs.subjectId + '_' + i, classIds: [c.id],
                        teacherId: cs.teacherId, subjectId: cs.subjectId, isDouble: cs.doublePeriod,
                        difficulty: sub.difficulty, preferredSlot: sub.preferredSlot, name: sub.name
                    });
                }
            });
        });

        if(blocks.length === 0) return { error: 'هیچ درسی برای زمان‌بندی وجود ندارد.' };

        const classMeta = {};
        classes.forEach(c => classMeta[c.id] = c);

        blocks.forEach(b => {
            b.validSlots = [];
            for(let d=0; d<6; d++) {
                for(let p=0; p<constants.MAX_PERIODS; p++) {
                    let valid = true;
                    for(let cid of b.classIds) {
                        const meta = classMeta[cid];
                        if(!meta.activeDays.includes(d)) { valid = false; break; }
                        if(p >= meta.pCount) { valid = false; break; }
                        if(b.isDouble && p + 1 >= meta.pCount) { valid = false; break; }
                    }
                    if(valid) b.validSlots.push({d, p});
                }
            }
        });

        const impossible = blocks.filter(b => b.validSlots.length === 0);
        blocks = blocks.filter(b => b.validSlots.length > 0);
        
        let stateBlocks = blocks.map(b => ({ ...b, d: -1, p: -1 }));

        function getColliders(stateArr, blockIndex, targetD, targetP) {
            const b = stateArr[blockIndex];
            const pLength = b.isDouble ? 2 : 1;
            const colliders = [];
            for(let i=0; i<stateArr.length; i++) {
                if(i === blockIndex) continue;
                const ob = stateArr[i];
                if(ob.d === -1) continue;
                if(ob.d !== targetD) continue;
                const sharesClass = b.classIds.some(cid => ob.classIds.includes(cid));
                if(sharesClass) {
                    const obLen = ob.isDouble ? 2 : 1;
                    const bStart = targetP; const bEnd = targetP + pLength - 1;
                    const obStart = ob.p; const obEnd = ob.p + obLen - 1;
                    if(bStart <= obEnd && bEnd >= obStart) colliders.push(i);
                }
            }
            return colliders;
        }

        for(let i=0; i<stateBlocks.length; i++) {
            const b = stateBlocks[i];
            const slot = b.validSlots[Math.floor(Math.random() * b.validSlots.length)];
            b.d = slot.d; b.p = slot.p;
        }

        const PENALTIES = { clash: 10000, overlapClass: 20000, unavail: 5000, gap: 15, spread: 40, pref: 60, energy: 30, doubleUnpaired: 200, heavySeq: 50 };
        const tAvailMap = {};
        teachers.forEach(t => tAvailMap[t.id] = t.avail);

        function calcCost(stateArr) {
            let cost = 0;
            const tGrid = {};
            const cGrid = {};
            const subjSpread = {};
            
            for(let i=0; i<stateArr.length; i++) {
                const b = stateArr[i];
                if(b.d === -1) continue;
                const pLen = b.isDouble ? 2 : 1;
                
                if(b.teacherId) {
                    if(!tGrid[b.teacherId]) tGrid[b.teacherId] = Array.from({length:6}, ()=>Array(8).fill(0));
                    for(let x=0; x<pLen; x++) {
                        tGrid[b.teacherId][b.d][b.p + x]++;
                        const ta = tAvailMap[b.teacherId];
                        if(ta && (!ta[b.d] || !ta[b.d][b.p + x])) cost += PENALTIES.unavail;
                    }
                }

                b.classIds.forEach(cid => {
                    if(!cGrid[cid]) cGrid[cid] = Array.from({length:6}, ()=>Array(8).fill(0));
                    if(!subjSpread[cid]) subjSpread[cid] = {};
                    if(!subjSpread[cid][b.subjectId]) subjSpread[cid][b.subjectId] = Array(6).fill(0);
                    
                    for(let x=0; x<pLen; x++) {
                        cGrid[cid][b.d][b.p + x]++;
                        if(cGrid[cid][b.d][b.p + x] > 1) cost += PENALTIES.overlapClass;
                    }
                    subjSpread[cid][b.subjectId][b.d]++;
                    
                    const capacity = STUDENT_ENERGY[b.p] || 0.5;
                    const need = b.difficulty / 5;
                    if(need > capacity + 0.1) cost += (need - capacity) * PENALTIES.energy;

                    const maxP = classMeta[cid].pCount;
                    if(b.preferredSlot === 'morning' && b.p > 1) cost += PENALTIES.pref;
                    if(b.preferredSlot === 'end' && (b.p + pLen - 1) !== maxP - 1) cost += PENALTIES.pref;
                    if(b.preferredSlot === 'first_or_last') {
                        if(b.p !== 0 && (b.p + pLen - 1) !== maxP - 1) cost += PENALTIES.pref * 1.5;
                    }
                });
            }

            for(let tid in tGrid) {
                for(let d=0; d<6; d++) {
                    let first = -1, last = -1;
                    for(let p=0; p<8; p++) {
                        if(tGrid[tid][d][p] > 1) cost += (tGrid[tid][d][p] - 1) * PENALTIES.clash;
                        if(tGrid[tid][d][p] > 0) {
                            if(first === -1) first = p;
                            last = p;
                        }
                    }
                    if(first !== -1) {
                        for(let p=first; p<=last; p++) {
                            if(tGrid[tid][d][p] === 0) {
                                const ta = tAvailMap[tid];
                                if(ta && ta[d] && ta[d][p]) cost += PENALTIES.gap;
                            }
                        }
                    }
                }
            }
            
            for(let cid in subjSpread) {
                for(let sid in subjSpread[cid]) {
                    const days = subjSpread[cid][sid];
                    for(let d=0; d<6; d++) {
                        if(days[d] > 2) cost += PENALTIES.spread;
                    }
                }
            }

            return cost;
        }

        const T0 = 1000, TMin = 0.1;
        const Iterations = Math.min(100000, blocks.length * 500); 
        const alpha = Math.pow(TMin/T0, 1/Iterations);
        
        let currentCost = calcCost(stateBlocks);
        let bestState = stateBlocks.map(b => ({...b}));
        let bestCost = currentCost;
        let T = T0;

        for(let iter=0; iter<Iterations; iter++) {
            if(iter % 5000 === 0) self.postMessage({ progress: iter / Iterations });

            const bIdx = Math.floor(Math.random() * stateBlocks.length);
            const b = stateBlocks[bIdx];
            const slot = b.validSlots[Math.floor(Math.random() * b.validSlots.length)];
            
            const oldD = b.d, oldP = b.p;
            const colliders = getColliders(stateBlocks, bIdx, slot.d, slot.p);
            const backup = colliders.map(idx => ({ idx, d: stateBlocks[idx].d, p: stateBlocks[idx].p }));
            
            b.d = slot.d; b.p = slot.p;
            
            for(let cIdx of colliders) {
                const cb = stateBlocks[cIdx];
                const fitsOld = cb.validSlots.some(s => s.d === oldD && s.p === oldP);
                if(fitsOld) {
                    cb.d = oldD; cb.p = oldP;
                } else {
                    const rSlot = cb.validSlots[Math.floor(Math.random() * cb.validSlots.length)];
                    cb.d = rSlot.d; cb.p = rSlot.p;
                }
            }
            
            const newCost = calcCost(stateBlocks);
            const delta = newCost - currentCost;
            
            if(delta < 0 || Math.exp(-delta / T) > Math.random()) {
                currentCost = newCost;
                if(currentCost < bestCost) {
                    bestCost = currentCost;
                    bestState = stateBlocks.map(sb => ({...sb}));
                    if(bestCost === 0) break;
                }
            } else {
                b.d = oldD; b.p = oldP;
                backup.forEach(bk => { stateBlocks[bk.idx].d = bk.d; stateBlocks[bk.idx].p = bk.p; });
            }
            
            T *= alpha;
        }

        const schedules = {};
        classes.forEach(c => {
            schedules[c.id] = {};
            c.activeDays.forEach(d => schedules[c.id][d] = Array(c.pCount).fill(null));
        });

        bestState.forEach(b => {
            if(b.d === -1) return;
            b.classIds.forEach(cid => {
                if(schedules[cid] && schedules[cid][b.d]) {
                    schedules[cid][b.d][b.p] = { name: b.name, teacherId: b.teacherId, isDouble: b.isDouble, span: 1, isJoint: b.classIds.length > 1 };
                    if(b.isDouble && b.p + 1 < schedules[cid][b.d].length) {
                        schedules[cid][b.d][b.p].span = 2;
                        schedules[cid][b.d][b.p + 1] = { skip: true };
                    }
                }
            });
        });

        return { schedules, bestCost, impossibleCount: impossible.length };
    }
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    schedulerWorker = new Worker(URL.createObjectURL(blob));

    schedulerWorker.onmessage = function(e) {
        if(e.data.progress !== undefined) {
            const pct = Math.round(e.data.progress * 100);
            document.getElementById('sa-progress-bar').style.width = pct + '%';
            if (pct > 50) document.getElementById('sa-status-text').textContent = 'در حال بهینه‌سازی و حذف تداخل‌ها...';
        } else if(e.data.error) {
            cleanupUI(false);
            showToast(e.data.error, 'error');
        } else {
            state.schedules = e.data.schedules;
            saveState();
            cleanupUI(true);
            document.getElementById('schedule-results').innerHTML = renderTimetables();
            
            if(e.data.impossibleCount > 0) showToast(`${e.data.impossibleCount} درس به دلیل کمبود ظرفیت زمانی کلاس جای نگرفت.`, 'error');
            else if(e.data.bestCost < 1000) showToast('برنامه با موفقیت کامل و بدون تداخل تولید شد!', 'success');
            else showToast('برنامه تولید شد، اما ممکن است برخی محدودیت‌های نرم کاملاً رعایت نشده باشد.', 'warning');
        }
    };

    schedulerWorker.postMessage(payload);

    function cleanupUI(success) {
        document.getElementById('btn-run-sa').disabled = false;
        document.getElementById('btn-run-sa').classList.remove('opacity-50', 'cursor-not-allowed');
        const pc = document.getElementById('sa-progress-container');
        pc.classList.remove('flex'); pc.classList.add('hidden');
        document.getElementById('sa-progress-bar').style.width = '0%';
        if(schedulerWorker) { schedulerWorker.terminate(); schedulerWorker = null; }
    }
}

function renderTimetables() {

    let html = `<div class="flex flex-wrap justify-end gap-2 mb-6 no-print">

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition flex items-center gap-2">دانلود Excel</button>
    </div><div id="print-canvas" class="space-y-12 bg-white rounded-xl p-4">`;

    state.classes.forEach(c => {
        const sched = state.schedules[c.id];
        if (!sched) return;
        
        const activeDays = c.config.activeDays || [0,1,2,3,4];
        const pCount = c.config.periodsCount || 5;

        html += `<div class="border-2 border-slate-800 rounded-2xl overflow-hidden shadow-sm page-break print-area">
            <div class="bg-slate-800 text-white text-center py-4 px-6 flex justify-between items-center" style="background-color: #1e293b; color: white;">
                <span class="font-bold text-slate-300 text-sm">${escapeHtml(state.settings.schoolName)}</span>
                <h3 class="font-black text-2xl tracking-tight">برنامه هفتگی کلاس ${escapeHtml(c.name)}</h3>
                <span class="font-bold text-slate-300 text-sm">پایه ${escapeHtml(c.grade)}</span>
            </div>
            <table class="w-full text-center border-collapse" style="border: 1px solid #cbd5e1; direction: rtl;" id="tbl_${c.id}">
                <thead>
                    <tr class="bg-slate-100 border-b-2 border-slate-300 text-slate-700" style="background-color: #f1f5f9;">
                        <th class="p-4 border-l border-slate-300 font-black w-32" style="border: 1px solid #cbd5e1; padding: 10px;">روز / زنگ</th>
                        ${Array.from({length: pCount}).map((_, i) => `<th class="p-4 border-l border-slate-300 font-black text-lg" style="border: 1px solid #cbd5e1; padding: 10px;">زنگ ${i+1}<div class="text-xs font-normal text-slate-500 mt-1">${c.config.periodDuration} دقیقه</div></th>`).join('')}
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200">`;

        activeDays.forEach(d => {
            html += `<tr><td class="p-4 font-black bg-slate-50 border-l border-slate-300 text-lg text-slate-800" style="background-color: #f8fafc; border: 1px solid #cbd5e1; padding: 10px;">${CONSTANTS.DAYS[d]}</td>`;
            for (let p = 0; p < pCount; p++) {
                const lesson = sched[d] ? sched[d][p] : null;
                if (!lesson) {
                    html += `<td class="p-4 border-l border-slate-200 text-slate-300 text-sm font-medium" style="border: 1px solid #cbd5e1; padding: 10px;">---</td>`;
                } else if (lesson.skip) {
                    // Handled by colspan
                } else {
                    const tName = state.teachers.find(t=>t.id===lesson.teacherId)?.name || 'بدون استاد';
                    const colspan = lesson.span > 1 ? `colspan="${lesson.span}"` : '';
                    const jointBadge = lesson.isJoint ? `<span class="bg-pink-100 text-pink-700 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1 border border-pink-200">کلاس مشترک</span>` : '';
                    const bgColor = lesson.span > 1 ? 'background-color: #eff6ff;' : '';
                    html += `<td ${colspan} class="p-4 border-l border-slate-200 bg-white relative group" style="${bgColor} border: 1px solid #cbd5e1; padding: 10px; text-align: center;">
                        <div class="font-black text-slate-800 text-base mb-1" style="font-weight: bold;">${escapeHtml(lesson.name)} ${jointBadge}</div>
                        <div class="text-sm font-bold text-emerald-600" style="color: #059669;">${escapeHtml(tName)}</div>
                    </td>`;
                    if (lesson.span > 1) p += (lesson.span - 1);
                }
            }
            html += `</tr>`;
        });
        html += `</tbody></table></div><br>`;
    });
    html += `</div>`;
    return html;
}

function exportToExcel() {
    const wb = XLSX.utils.book_new();
    state.classes.forEach(c => {
        const table = document.getElementById(`tbl_${c.id}`);
        if(table) {
            const ws = XLSX.utils.table_to_sheet(table);
            XLSX.utils.book_append_sheet(wb, ws, c.name.substring(0, 31));
        }
    });
    XLSX.writeFile(wb, "School_Schedules_Pro.xlsx");
}

function exportSchedulePDF() {
    const el = document.getElementById('print-canvas');

        margin: 0.5,

    };

}

    const val = document.getElementById('set_school').value.trim();

function exportDataJSON() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'school_scheduler_backup.json'; a.click();
}
function importDataJSON(e) {
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const data = JSON.parse(ev.target.result);
            if(data.classes && data.subjects) {
                state = data;
                if(!state.linkedGroups) state.linkedGroups = [];
                saveState(); location.reload();
            } else throw new Error("Invalid structure");
        } catch(err) { showToast('فایل نامعتبر است.', 'error'); }
    };
    reader.readAsText(f);
}
function factoryReset() {
    if(confirm('هشدار جدی: تمامی اطلاعات پاک شده و غیرقابل بازگشت خواهد بود! ادامه می‌دهید؟')) {
        if(confirm('آیا کاملا مطمئن هستید؟')) {
            localStorage.removeItem('school_data_pro');
            location.reload();
        }
    }
}
