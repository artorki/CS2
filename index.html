// --- مدل انرژی دانش‌آموز: ظرفیت تمرکز نسبی در هر زنگ (زنگ ۱ تا ۸) ---
const STUDENT_ENERGY_CURVE = [1.0, 0.95, 0.90, 0.82, 0.76, 0.70, 0.64, 0.58];
// دروس با دشواری >= این مقدار «سنگین» محسوب می‌شوند (قید: دو درس سنگین پشت‌سرهم نشوند)
const HEAVY_SUBJECT_THRESHOLD = 4;
const SCHEDULER_PENALTIES = {
  teacherClash: 1000,        // تداخل یک استاد در دو کلاس هم‌زمان
  teacherUnavailable: 1000,  // زنگ خارج از زمان آزاد استاد
  teacherDayGap: 8,          // FIX: هر زنگ خالی میان اولین و آخرین زنگ تدریس یک استاد در همان روز (شکاف روزانه)
  energyMismatch: 60,        // ناسازگاری دشواری درس با انرژی باقی‌ماندهٔ دانش‌آموز در آن زنگ
  heavyBackToBack: 12,       // دو درس سنگین پشت‌سرهم
  preferredSlot: 10,         // عدم رعایت زمان ترجیحی صریح درس (صبح/آخر)
  doubleUnpaired: 40,        // زنگ پیوسته که کنار جفت خود قرار نگرفته است
  dailySpread: 20,           // تجمع بیش از حد مجاز یک درس در یک روز
  sameSubjectAdjacent: 10    // تکرار همان درس در دو زنگ پشت‌سرهم (برای دروس غیرپیوسته)
};

let activeSchedulerRun = null; // جلوگیری از اجرای همزمان دو زمان‌بندی

function runSmartScheduler() {
  if (activeSchedulerRun) return showToast('زمان‌بندی دیگری در حال اجراست؛ چند لحظه صبر کنید.', 'info');

  window.lastScheduleDiagnostics = { impossible: [] };
  const runBtn = document.getElementById('run-scheduler-btn');
  if (runBtn) { runBtn.disabled = true; runBtn.innerText = 'در حال آماده‌سازی...'; }

  const allClassIds = state.classes.map(c => c.id);
  const classMeta = {};
  state.classes.forEach(c => {
    const activeDays = Array.isArray(c.config?.activeDays) ? c.config.activeDays.filter(d => d >= 0 && d < 6) : [];
    const pCount = Math.min(MAX_PERIODS, Math.max(1, safeParseInt(c.config?.periodsCount, 5)));
    classMeta[c.id] = { activeDays, pCount, grade: c.grade, major: c.major };
  });

  const teacherAvail = {};
  state.teachers.forEach(t => teacherAvail[t.id] = (t.availability && Array.isArray(t.availability[0])) ? t.availability : generateDefaultAvailability());

  const sharedGroups = (state.sharedGroups || []).filter(g => Array.isArray(g.members) && g.members.length >= 2);
  const sharedMemberKey = new Set();
  sharedGroups.forEach(g => (g.members || []).forEach(m => sharedMemberKey.add(`${m.classId}::${m.subjectId}`)));

  // هر واحد یک «جلسه» مستقل است؛ در گروه مشترک، همین جلسه هم‌زمان در چند کلاس قرار می‌گیرد.
  const units = [];
  const diagnostics = [];

  function subjectInfo(classId, subjectId) {
    const cls = state.classes.find(c => c.id === classId);
    const cs = cls?.subjects.find(x => x.subjectId === subjectId);
    const sub = state.subjects.find(s => s.id === subjectId);
    return { cls, cs, sub };
  }

  function staticEligibleSlots(members, teacherId, length = 1) {
    const slots = [];
    for (let d = 0; d < 6; d++) for (let p = 0; p < MAX_PERIODS; p++) {
      let ok = p + length <= MAX_PERIODS;
      for (let k=0; k<length && ok; k++) {
        const pp = p+k;
        for (const m of members) {
          const meta = classMeta[m.classId];
          if (!meta || !meta.activeDays.includes(d) || pp >= meta.pCount) { ok = false; break; }
        }
        if (teacherId) {
          const av = teacherAvail[teacherId];
          if (!av || !av[d] || av[d][pp] === false) ok = false;
        }
      }
      if (ok) slots.push([d,p]);
    }
    return slots;
  }

  sharedGroups.forEach(group => {
    const members = [];
    let periods = null;
    let valid = true;
    for (const m of group.members) {
      const info = subjectInfo(m.classId, m.subjectId);
      if (!info.cls || !info.cs || !info.sub) { valid = false; break; }
      if (periods === null) periods = Math.max(1, Math.min(info.cs.periods || 1, MAX_PERIODS_PER_SUBJECT));
      if ((info.cs.periods || 1) !== periods) valid = false;
      members.push(m);
    }
    if (!valid || members.length < 2) return;
    const firstCs = subjectInfo(members[0].classId, members[0].subjectId).cs;
    const double = firstCs?.doublePeriod === true;
    let i = 0;
    while (i < periods) {
      const length = double && i + 1 < periods ? 2 : 1;
      units.push({
        id: `G:${group.id}:${i}`,
        sharedGroupId: group.id,
        teacherId: group.teacherId || firstCs?.teacherId || null,
        members,
        index: i,
        length,
        shared: true
      });
      i += length;
    }
  });

  state.classes.forEach(cls => {
    cls.subjects.forEach(cs => {
      const key = `${cls.id}::${cs.subjectId}`;
      if (sharedMemberKey.has(key)) return;
      const sub = state.subjects.find(s => s.id === cs.subjectId);
      if (!sub) return;
      const periods = Math.max(1, Math.min(cs.periods || 1, MAX_PERIODS_PER_SUBJECT));
      let i = 0;
      while (i < periods) {
        const length = cs.doublePeriod === true && i + 1 < periods ? 2 : 1;
        units.push({
          id: `S:${cls.id}:${cs.subjectId}:${i}`,
          sharedGroupId: null,
          teacherId: cs.teacherId || null,
          members: [{classId: cls.id, subjectId: cs.subjectId}],
          index: i,
          length,
          shared: false
        });
        i += length;
      }
    });
  });

  if (units.length === 0) {
    state.schedules = {};
    saveState();
    const el = document.getElementById('schedule-results');
    if (el) el.innerHTML = renderScheduleTables();
    if (runBtn) { runBtn.disabled = false; runBtn.innerText = 'اجرای زمان‌بندی هوشمند'; }
    showToast('هیچ درسی برای زمان‌بندی وجود ندارد.', 'info');
    return;
  }

  units.forEach(u => {
    u.eligible = staticEligibleSlots(u.members, u.teacherId, u.length || 1);
    if (u.eligible.length === 0) {
      const info = subjectInfo(u.members[0].classId, u.members[0].subjectId);
      diagnostics.push({
        grade: info.cls?.grade || 'نامشخص',
        className: info.cls?.name || 'نامشخص',
        major: info.cls?.major || '',
        subjectName: info.sub?.name || 'نامشخص',
        teacherName: state.teachers.find(t=>t.id===u.teacherId)?.name || 'بدون استاد',
        reason: u.teacherId ? 'هیچ زنگی هم‌زمان با روزهای فعال کلاس و زمان آزاد استاد وجود ندارد.' : 'برای این درس استاد تخصیص داده نشده است؛ قابلیت قرارگیری بدون استاد وجود دارد اما تخصیص استاد توصیه می‌شود.'
      });
    }
  });

  const schedTemplate = {};
  allClassIds.forEach(cid => {
    schedTemplate[cid] = {};
    for (let d=0; d<6; d++) schedTemplate[cid][d] = new Array(MAX_PERIODS).fill(null);
  });

  function cloneSchedule(s) {
    const c = {};
    Object.keys(s).forEach(cid => { c[cid] = {}; for (let d=0; d<6; d++) c[cid][d] = s[cid][d].slice(); });
    return c;
  }

  function shuffle(arr) {
    for (let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  }

  function isTeacherBusy(teacherBusy, teacherId, d, p) { return !!(teacherId && teacherBusy[teacherId]?.[d]?.[p]); }

  function canPlace(u, d, p, sched, teacherBusy) {
    const length = u.length || 1;
    if (!u.eligible.some(([ed,ep]) => ed===d && ep===p)) return false;
    for (let k=0; k<length; k++) {
      const pp=p+k;
      if (u.teacherId && isTeacherBusy(teacherBusy,u.teacherId,d,pp)) return false;
      for (const m of u.members) if (sched[m.classId][d][pp]) return false;
    }
    return true;
  }

  function placeUnit(u,d,p,sched,teacherBusy,placements) {
    const length=u.length||1;
    placements[u.id]=[d,p];
    for (const m of u.members) {
      const info=subjectInfo(m.classId,m.subjectId), sub=info.sub, cs=info.cs;
      for (let k=0;k<length;k++) {
        const pp=p+k;
        sched[m.classId][d][pp]={
          unitId:u.id, sharedGroupId:u.sharedGroupId, classId:m.classId, subjectId:m.subjectId,
          teacherId:u.teacherId, name:sub?.name||'',
          difficulty:Math.min(5,clampInt(sub?.difficulty,1,5,3)+(cs?.type==='تخصصی'?1:0)),
          preferredSlot:['morning','end','any'].includes(sub?.preferredSlot)?sub.preferredSlot:'any',
          isDouble:cs?.doublePeriod===true, sharedUnitLength:length, sharedUnitStart:p
        };
      }
    }
    if(u.teacherId){
      if(!teacherBusy[u.teacherId]) teacherBusy[u.teacherId]=Array.from({length:6},()=>new Array(MAX_PERIODS).fill(false));
      for(let k=0;k<length;k++) teacherBusy[u.teacherId][d][p+k]=true;
    }
  }

  function buildStats(sched) {
    const teacherDays={}, teacherBusy={}, classDays={};
    state.teachers.forEach(t=> { teacherDays[t.id]=new Set(); teacherBusy[t.id]={}; });
    allClassIds.forEach(cid=> classDays[cid]=new Set());
    allClassIds.forEach(cid=> { for(let d=0; d<6; d++) for(let p=0;p<MAX_PERIODS;p++) {
      const l=sched[cid][d][p]; if(!l) continue;
      classDays[cid].add(d);
      if(l.teacherId) {
        teacherDays[l.teacherId]?.add(d);
        (teacherBusy[l.teacherId][d] || (teacherBusy[l.teacherId][d]=new Set())).add(p);
      }
    }});
    return {teacherDays,teacherBusy,classDays};
  }

  function dayGap(set) {
    if (!set || set.size < 2) return 0;
    const arr=[...set].sort((a,b)=>a-b); let gap=0;
    for(let i=arr[0];i<=arr[arr.length-1];i++) if(!set.has(i)) gap++;
    return gap;
  }

  function scoreCandidate(u,d,p,sched,stats) {
    let score = 0;
    const members = u.members;
    if (u.teacherId) {
      const days = stats.teacherDays[u.teacherId] || new Set();
      score += (days.has(d) ? -520 : 520); // ترجیح قوی برای متمرکز کردن کلاس‌های استاد در یک روز
      const periods = stats.teacherBusy[u.teacherId]?.[d] || new Set();
      if (periods.size) {
        const near = [...periods].some(pp => Math.abs(pp-p)===1);
        score += near ? -260 : 320;
      }
    }
    members.forEach(m => {
      const days = stats.classDays[m.classId] || new Set();
      score += days.has(d) ? -180 : 260; // روز جدید برای کلاس نیز نامطلوب است
      const row = sched[m.classId][d];
      const neighbors = [(p>0?row[p-1]:null),(p<MAX_PERIODS-1?row[p+1]:null)];
      if (neighbors.some(n=>n)) score -= 90;
      const info = subjectInfo(m.classId,m.subjectId);
      const sub=info.sub;
      const preferred=sub?.preferredSlot || 'any';
      if (preferred==='morning' && p<=2) score-=70;
      else if (preferred==='morning' && p>2) score+=90;
      if (preferred==='end' && p===classMeta[m.classId].pCount-1) score-=70;
      else if (preferred==='end') score+=90;
    });
    // امتیاز قوی برای فشردگی ساعت معلم و جلوگیری از روزهای نصفه
    if (u.teacherId) {
      const busy = stats.teacherBusy[u.teacherId]?.[d] || new Set();
      if (busy.size) {
        const arr=[...busy].sort((a,b)=>a-b);
        score += Math.min(240, Math.abs(p-arr[0])*35 + Math.abs(p-arr[arr.length-1])*35);
      }
    }
    return score + Math.random()*35;
  }

  // ساخت اولیه با «پر کردن حداکثری» و تعمیر زنجیره‌ای.
  // هدف این است که یک انتخاب حریصانه باعث از دست رفتن زنگ مجازی برای واحد دیگری نشود.
  function randomConstruct() {
    const sched = cloneSchedule(schedTemplate);
    const teacherBusy = {};
    const placements = {};
    const unplaced = [];
    const placedUnits = new Set();

    const refreshBusy = () => {
      Object.keys(teacherBusy).forEach(tid => delete teacherBusy[tid]);
      allClassIds.forEach(cid => {
        for (let d=0; d<6; d++) for (let p=0; p<MAX_PERIODS; p++) {
          const l = sched[cid][d][p];
          if (!l?.teacherId) continue;
          if (!teacherBusy[l.teacherId]) teacherBusy[l.teacherId]=Array.from({length:6},()=>new Array(MAX_PERIODS).fill(false));
          teacherBusy[l.teacherId][d][p]=true;
        }
      });
    };

    const removeUnit = (u) => {
      const old = placements[u.id];
      if (!old) return false;
      const [od,op] = old;
      const len=u.length||1;
      u.members.forEach(m => {
        for(let k=0;k<len;k++) sched[m.classId][od][op+k]=null;
      });
      delete placements[u.id];
      placedUnits.delete(u.id);
      refreshBusy();
      return true;
    };

    const tryPlace = (u, d, p) => {
      if (!canPlace(u,d,p,sched,teacherBusy)) return false;
      placeUnit(u,d,p,sched,teacherBusy,placements);
      placedUnits.add(u.id);
      return true;
    };

    // تلاش برای جابه‌جایی زنجیره‌ای: اگر جای هدف اشغال باشد، تا عمق محدود واحد
    // مزاحم را به یک جای قانونی دیگر منتقل می‌کنیم. این کار ظرفیت واقعی را بهتر پر می‌کند.
    const relocateFor = (target, d, p, depth, seen) => {
      if (depth > 3) return false;
      const blockers = new Map();
      for (const m of target.members) {
        for (let k=0;k<(target.length||1);k++) {
          const pp=p+k;
          const cell=sched[m.classId][d][pp];
          if (cell?.unitId) {
            const bu = units.find(x=>x.id===cell.unitId);
            if (bu) blockers.set(bu.id, bu);
          }
        }
      }
      if (target.teacherId) {
        for (const cid of allClassIds) for (let dd=0;dd<6;dd++) for(let pp=0;pp<MAX_PERIODS;pp++) {
          if (!isTeacherBusy(teacherBusy,target.teacherId,dd,pp)) continue;
          const cell=sched[cid][dd][pp];
          if (cell?.unitId) {
            const bu=units.find(x=>x.id===cell.unitId);
            if(bu) blockers.set(bu.id,bu);
          }
        }
      }
      if (blockers.size===0) return false;
      if ([...blockers.keys()].some(id=>seen.has(id))) return false;

      for (const blocker of blockers.values()) {
        seen.add(blocker.id);
        const old = placements[blocker.id];
        if (!old) { seen.delete(blocker.id); continue; }
        const oldD=old[0], oldP=old[1];
        removeUnit(blocker);

        const candidates = shuffle(blocker.eligible.slice()).sort((a,b)=>{
          const ac = canPlace(blocker,a[0],a[1],sched,teacherBusy) ? 0 : 1;
          const bc = canPlace(blocker,b[0],b[1],sched,teacherBusy) ? 0 : 1;
          return ac-bc;
        });

        let moved=false;
        for (const [bd,bp] of candidates) {
          if (bd===oldD && bp===oldP) continue;
          if (tryPlace(blocker,bd,bp)) { moved=true; break; }
          // اگر جای blocker اشغال بود، یک لایهٔ دیگر تعمیر کن.
          if (relocateFor(blocker,bd,bp,depth+1,seen) && tryPlace(blocker,bd,bp)) { moved=true; break; }
        }
        if (moved) {
          seen.delete(blocker.id);
          if (canPlace(target,d,p,sched,teacherBusy)) return tryPlace(target,d,p);
        }

        // اگر جابه‌جایی blocker موفق نشد، آن را به جای قبلی برگردان.
        if (!placements[blocker.id]) tryPlace(blocker,oldD,oldP);
        seen.delete(blocker.id);
      }
      return false;
    };

    // واحدهای بدون جای کافی زودتر تعیین تکلیف می‌شوند؛ گروه‌های مشترک و زنگ‌های دوتایی نیز مقدم‌اند.
    const ordered = units.filter(u=>u.eligible.length>0).slice().sort((a,b)=>{
      const aHard=(a.members.length>1? -100:0)+(a.length>1?-80:0);
      const bHard=(b.members.length>1? -100:0)+(b.length>1?-80:0);
      return (a.eligible.length+aHard)-(b.eligible.length+bHard);
    });

    for (const u of ordered) {
      const stats=buildStats(sched);
      const candidates = shuffle(u.eligible.slice()).sort((a,b)=>scoreCandidate(u,a[0],a[1],sched,stats)-scoreCandidate(u,b[0],b[1],sched,stats));
      let placed=false;
      // ابتدا چند گزینه برتر، سپس کل گزینه‌های باقی‌مانده با تعمیر زنجیره‌ای.
      const firstPass=candidates.slice(0,Math.min(12,candidates.length));
      const secondPass=candidates.slice(Math.min(12,candidates.length));
      for (const [d,p] of firstPass) {
        if (tryPlace(u,d,p)) { placed=true; break; }
        if (relocateFor(u,d,p,0,new Set([u.id]))) { placed=true; break; }
      }
      if (!placed) {
        for (const [d,p] of secondPass) {
          if (tryPlace(u,d,p)) { placed=true; break; }
          if (relocateFor(u,d,p,0,new Set([u.id]))) { placed=true; break; }
        }
      }
      if (!placed) unplaced.push(u);
    }

    // تلاش نهایی: واحدهای باقی‌مانده را دوباره در برنامه‌ای که تا اینجا ساخته شده جای بده.
    for (let pass=0; pass<2 && unplaced.length; pass++) {
      const remaining=unplaced.splice(0);
      for (const u of remaining) {
        let placed=false;
        const candidates=shuffle(u.eligible.slice());
        for (const [d,p] of candidates) {
          if (tryPlace(u,d,p)) { placed=true; break; }
          if (relocateFor(u,d,p,0,new Set([u.id]))) { placed=true; break; }
        }
        if (!placed) unplaced.push(u);
      }
    }

    return {sched,placements,unplaced};
  }

  function objective(sched) {
    let score=0;
    const stats=buildStats(sched);
    Object.keys(stats.teacherDays).forEach(tid=>{
      const days=stats.teacherDays[tid];
      score += Math.max(0, days.size-1)*1800;
      score += dayGap(days)*1100;
      Object.keys(stats.teacherBusy[tid]||{}).forEach(d=>{
        const set=stats.teacherBusy[tid][d];
        if(set && set.size>1) {
          const arr=[...set].sort((a,b)=>a-b);
          score += (arr[arr.length-1]-arr[0]+1-set.size)*900;
        }
      });
    });
    Object.keys(stats.classDays).forEach(cid=>{
      const days=stats.classDays[cid];
      score += Math.max(0, days.size-1)*500;
      score += dayGap(days)*300;
    });
    allClassIds.forEach(cid=>{
      const meta=classMeta[cid];
      for(let d=0;d<6;d++) for(let p=0;p<meta.pCount;p++) {
        const l=sched[cid][d][p]; if(!l) continue;
        const need=l.difficulty/5, cap=STUDENT_ENERGY_CURVE[p]||0.55;
        if(need>cap) score+=(need-cap)*SCHEDULER_PENALTIES.energyMismatch;
        if(l.preferredSlot==='morning' && p>2) score+=SCHEDULER_PENALTIES.preferredSlot;
        if(l.preferredSlot==='end' && p!==meta.pCount-1) score+=SCHEDULER_PENALTIES.preferredSlot;
        const row=sched[cid][d];
        if(p+1<meta.pCount && row[p+1]) {
          if(l.difficulty>=HEAVY_SUBJECT_THRESHOLD && row[p+1].difficulty>=HEAVY_SUBJECT_THRESHOLD) score+=SCHEDULER_PENALTIES.heavyBackToBack;
          if(l.subjectId===row[p+1].subjectId && !l.isDouble) score+=SCHEDULER_PENALTIES.sameSubjectAdjacent;
        }
      }
    });
    return score;
  }

  let best = null;
  const restartCount = Math.min(45, Math.max(12, Math.ceil(units.length/20)));
  for(let r=0; r<restartCount; r++) {
    const candidate=randomConstruct();
    const score=objective(candidate.sched) + candidate.unplaced.length*50000;
    if(!best || score<best.score) best={...candidate,score};
    if(candidate.unplaced.length===0 && score===0) break;
  }

  // بهبود محلی: انتقال واحدها به زنگ‌های مجاز دیگر، با حفظ قیود سخت.
  if(best) {
    for(let pass=0; pass<4; pass++) {
      let improved=false;
      const current=best.sched;
      const currentUnits = units.filter(u => best.placements[u.id]);
      for(const u of shuffle(currentUnits.slice())) {
        const old=best.placements[u.id];
        const oldScore=objective(current);
        // برداشتن کامل واحد از تمام کلاس‌های عضو
        const oldLen = u.length || 1;
        u.members.forEach(m=> { for(let k=0;k<oldLen;k++) current[m.classId][old[0]][old[1]+k]=null; });
        const trialSlots=shuffle(u.eligible.slice()).filter(([d,p])=> !(d===old[0]&&p===old[1]) && canPlace(u,d,p,current,buildTeacherBusyFromSchedule(current)));
        let accepted=false;
        for(const [d,p] of trialSlots.slice(0,12)) {
          placeUnit(u,d,p,current,buildTeacherBusyFromSchedule(current),best.placements);
          const newScore=objective(current);
          if(newScore < oldScore) { improved=true; accepted=true; break; }
          const trialLen = u.length || 1;
          u.members.forEach(m=> { for(let k=0;k<trialLen;k++) current[m.classId][d][p+k]=null; });
        }
        if(!accepted) {
          placeUnit(u,old[0],old[1],current,buildTeacherBusyFromSchedule(current),best.placements);
        }
      }
      if(!improved) break;
      best.score=objective(current)+best.unplaced.length*50000;
    }
  }

  function buildTeacherBusyFromSchedule(sched) {
    const busy={};
    allClassIds.forEach(cid=>{for(let d=0;d<6;d++)for(let p=0;p<MAX_PERIODS;p++){const l=sched[cid][d][p];if(l?.teacherId){const key=l.teacherId;if(!busy[key])busy[key]=Array.from({length:6},()=>new Array(MAX_PERIODS).fill(false));busy[key][d][p]=true;}}});
    return busy;
  }

  // بازسازی تشخیص واحدهای جای‌گذاری‌نشده پس از آخرین تلاش
  const finalSched = best?.sched || cloneSchedule(schedTemplate);
  const finalUnplaced = (best?.unplaced || []).map(u => ({
    grade: subjectInfo(u.members[0].classId,u.members[0].subjectId).cls?.grade || 'نامشخص',
    className: u.members.map(m=>subjectInfo(m.classId,m.subjectId).cls?.name || '').filter(Boolean).join(' + '),
    major: u.members.map(m=>subjectInfo(m.classId,m.subjectId).cls?.major || '').filter(Boolean).join(' / '),
    subjectName: u.members.map(m=>subjectInfo(m.classId,m.subjectId).sub?.name || '').filter(Boolean).join(' + '),
    teacherName: state.teachers.find(t=>t.id===u.teacherId)?.name || 'بدون استاد',
    reason: u.eligible.length===0 ? 'هیچ زنگ مجاز مشترکی با محدودیت کلاس و استاد وجود ندارد.' : 'در تخصیص نهایی، ظرفیت زنگ‌های مجاز پیش از این واحد مصرف شده است.'
  }));

  state.schedules = finalSched;
  saveState();
  const resultsEl=document.getElementById('schedule-results'); if(resultsEl) resultsEl.innerHTML=renderScheduleTables();
  if(runBtn){runBtn.disabled=false;runBtn.innerText='اجرای زمان‌بندی هوشمند';}
  activeSchedulerRun=null;

  window.lastScheduleDiagnostics = {
    impossible: [...diagnostics, ...finalUnplaced].filter((v,i,a)=> a.findIndex(x=>`${x.grade}|${x.className}|${x.subjectName}|${x.teacherName}`===`${v.grade}|${v.className}|${v.subjectName}|${v.teacherName}`)===i),
    restarts: restartCount,
    objective: objective(finalSched)
  };
  const count=window.lastScheduleDiagnostics.impossible.length;
  if(count===0) showToast('برنامه با رعایت زمان‌های آزاد اساتید و با حداقل زنگ خالی ساخته شد.', 'success');
  else {
    const totalUnits = units.length;
    const placedUnits = totalUnits - finalUnplaced.length;
    showToast(`برنامه ساخته شد؛ ${placedUnits} مورد از ${totalUnits} واحد درسی قرار گرفت و ${count} مورد به دلیل محدودیت واقعی باقی ماند.`, 'error');
  }
}

function renderScheduleTables() {
    if(!state.schedules || Object.keys(state.schedules).length === 0) return `<div class="text-center text-gray-400 py-10 border-2 border-dashed rounded-xl">هنوز برنامه‌ای ساخته نشده است. روی دکمه بالا کلیک کنید.</div>`;

    let html = '';
    const diag = window.lastScheduleDiagnostics?.impossible || [];
    if (diag.length > 0) {
      const grouped = {};
      diag.forEach(x => { (grouped[x.grade] || (grouped[x.grade] = [])).push(x); });
      html += `<div class="mb-6 bg-red-50 border border-red-200 rounded-2xl p-4">
        <div class="font-bold text-red-800 mb-2">زنگ‌هایی که در حال حاضر امکان قرارگیری ندارند — به تفکیک پایه</div>
        <div class="space-y-3">${Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'fa')).map(grade => `
          <div class="bg-white/70 rounded-xl p-3 border border-red-100">
            <div class="font-bold text-red-700 mb-2">پایه ${escapeHtml(grade)}</div>
            <div class="space-y-1 text-xs text-red-900">${grouped[grade].map(x => `<div>• ${escapeHtml(x.subjectName)} — ${escapeHtml(x.className)}${x.major ? ` / ${escapeHtml(x.major)}` : ''} — استاد: ${escapeHtml(x.teacherName)} — ${escapeHtml(x.reason)}</div>`).join('')}</div>
          </div>`).join('')}</div>
      </div>`;
    }
    html += `<div class="flex flex-wrap gap-2 mb-4 justify-end">
        <button onclick="exportSchedule('pdf')" class="bg-red-50 text-red-600 px-4 py-2 rounded font-bold border border-red-200 text-sm">خروجی PDF</button>
        <button onclick="exportSchedule('word')" class="bg-blue-50 text-blue-600 px-4 py-2 rounded font-bold border border-blue-200 text-sm">خروجی Word</button>
        <button onclick="exportSchedule('excel')" class="bg-green-50 text-green-600 px-4 py-2 rounded font-bold border border-green-200 text-sm">خروجی Excel</button>
    </div><div id="print-area" class="space-y-8 bg-white p-4 rounded">`;

    state.classes.forEach(cls => {
        const sched = state.schedules[cls.id];
        if(!sched) return;
        const activeDays = cls.config?.activeDays || [0,1,2,3,4];
        const pCount = cls.config?.periodsCount || 5;

        html += `
        <div class="schedule-table-wrapper border-2 border-slate-800 rounded-lg overflow-hidden mb-8 page-break-after">
            <div class="bg-slate-800 text-white text-center py-2 font-bold text-lg">${escapeHtml(state.settings.schoolName)} - برنامه کلاس ${escapeHtml(cls.name)}</div>
            <table class="w-full text-center text-sm border-collapse" id="table_${escapeHtml(cls.id)}">
                <thead>
                    <tr class="bg-slate-100 border-b border-slate-300">
                        <th class="p-3 border-l border-slate-300 font-bold w-24">روز / زنگ</th>
                        ${Array.from({length:pCount}).map((_,i)=>`<th class="p-3 border-l border-slate-300 font-bold">زنگ ${i+1}<br><span class="text-[10px] font-normal text-gray-500">${cls.config?.periodDuration||45} دقیقه</span></th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${activeDays.map(dIdx => {
                        return `<tr class="border-b border-slate-200">
                            <td class="p-3 font-bold bg-slate-50 border-l border-slate-300">${escapeHtml(DAYS_OF_WEEK[dIdx])}</td>
                            ${Array.from({length:pCount}).map((_, pIdx) => {
                                const lesson = sched[dIdx] && sched[dIdx][pIdx];
                                if(!lesson) return `<td class="p-3 border-l border-slate-200 text-gray-300 text-xs">- خالی -</td>`;
                                const teacherName = state.teachers.find(t=>t.id===lesson.teacherId)?.name || 'بدون استاد';
                                return `<td class="p-3 border-l border-slate-200">
                                    <div class="font-bold text-slate-800">${escapeHtml(lesson.name)}</div>
                                    <div class="text-[11px] text-slate-500 mt-1">${escapeHtml(teacherName)}</div>
                                </td>`;
                            }).join('')}
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`;
    });
    html += `</div>`;
    return html;
}

function exportSchedule(type) {
    const el = document.getElementById('print-area');
    if(!el) return;

    if(type === 'pdf') {
        const opt = { margin: 0.5, filename: 'schedule.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' } };
        html2pdf().set(opt).from(el).save();
    }
    else if(type === 'excel') {
        const wb = XLSX.utils.book_new();
        state.classes.forEach(cls => {
            const table = document.getElementById(`table_${cls.id}`);
            if(table) {
                const ws = XLSX.utils.table_to_sheet(table);
                XLSX.utils.book_append_sheet(wb, ws, cls.name.substring(0,30));
            }
        });
        XLSX.writeFile(wb, "schedules.xlsx");
    }
    else if(type === 'word') {
        const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>body{font-family: Tahoma, Arial, sans-serif; direction: rtl;} table{border-collapse:collapse;width:100%;} td,th{border:1px solid black;padding:8px;text-align:center;} .page-break-after{page-break-after:always;}</style></head><body>`;
        const footer = "</body></html>";
        const blob = new Blob(['\ufeff', header + el.innerHTML + footer], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = 'schedules.doc'; link.click(); URL.revokeObjectURL(url);
    }
}

// SETTINGS VIEW
function renderSettings() {
  return `
    <div class="fade-in max-w-2xl mx-auto">
      <h2 class="text-2xl font-bold text-slate-800 border-r-4 border-gray-500 pr-3 mb-6">تنظیمات و پشتیبان‌گیری</h2>
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-2">نام مدرسه</label>
          <div class="flex gap-2">
            <input type="text" id="setting_school_name" value="${escapeHtml(state.settings.schoolName || '')}" class="flex-1 border rounded-xl px-4 py-2 outline-none focus:border-gray-500" maxlength="100">
            <button onclick="saveSettings()" class="bg-gray-800 text-white px-6 py-2 rounded-xl font-semibold hover:bg-gray-700 transition-colors">ذخیره</button>
          </div>
        </div>
        <hr class="border-slate-100">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <button onclick="exportData()" class="flex flex-col items-center gap-2 p-4 border-2 border-dashed border-blue-200 rounded-xl hover:bg-blue-50 text-blue-700 transition-colors">
             <span class="font-bold">دریافت فایل پشتیبان (JSON)</span>
          </button>
          <label class="flex flex-col items-center gap-2 p-4 border-2 border-dashed border-emerald-200 rounded-xl hover:bg-emerald-50 text-emerald-700 transition-colors cursor-pointer">
             <span class="font-bold">بازیابی اطلاعات (JSON)</span>
             <input type="file" class="hidden" accept=".json" onchange="importData(event)">
          </label>
        </div>
        <div class="pt-4 border-t border-slate-100 text-center">
          <button onclick="resetAllData()" class="text-red-600 hover:text-red-700 hover:bg-red-50 px-6 py-2 rounded-xl font-bold transition-colors">پاکسازی کامل تمامی اطلاعات سیستم</button>
        </div>
      </div>
    </div>`;
}

function saveSettings() {
  const name = document.getElementById('setting_school_name').value.trim();
  if(!name) return showToast('نام مدرسه نمی‌تواند خالی باشد', 'error');
  state.settings.schoolName = name.slice(0, 100);
  saveState(); showToast('تنظیمات ذخیره شد', 'success');
}
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
}

// FIX: try/catch + structure validation for importData
function importData(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if(validateStateStructure(data)) {
         Object.assign(state, data);
         // Sanitize imported data (+ فیلدهای زمان‌بندی جدید)
         state.subjects.forEach(s => { if(typeof s.name !== 'string') s.name = String(s.name || ''); ensureSubjectSchedulingFields(s); });
         state.teachers.forEach(t => { if(typeof t.name !== 'string') t.name = String(t.name || ''); if(!t.availability || t.availability.length < MAX_PERIODS) t.availability = generateDefaultAvailability(); });
         state.classes.forEach(c => {
            if(typeof c.name !== 'string') c.name = String(c.name || '');
            if(!Array.isArray(c.subjects)) c.subjects = [];
            c.subjects.forEach(cs => { if(cs) ensureClassSubjectFields(cs); });
         });
         if(!Array.isArray(state.sharedGroups)) state.sharedGroups = [];
         if(typeof state.settings.schoolName !== 'string') state.settings.schoolName = 'نام مدرسه';
         autoAssignTeachers();
         saveState();
         navigateTo('settings');
         showToast('بازیابی شد و اساتید به کلاس‌ها همگام شدند', 'success');
      } else {
         showToast('ساختار فایل نامعتبر است', 'error');
      }
    } catch(err) {
      showToast('فایل نامعتبر یا خراب است', 'error');
      console.error('Import error:', err);
    }
  };
  reader.onerror = function() { showToast('خطا در خواندن فایل', 'error'); };
  reader.readAsText(file);
}
function resetAllData() {
  if(confirm('تمام اطلاعات پاک خواهد شد. آیا مطمئنید؟')) {
      localStorage.removeItem('school_data');
      location.reload();
  }
}

// --- INIT ---
window.onload = () => {
  loadState();
  navigateTo('home');
};
