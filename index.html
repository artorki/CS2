  * { font-family: 'Vazirmatn', system-ui, sans-serif; }

<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <div id="toast-container" class="fixed top-4 left-4 z-[60] flex flex-col gap-2"></div>

  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" /></svg>
        <h1 class="font-bold text-xl">سامانه هوشمند برنامه کلاسی</h1>
      </div>
      <button onclick="navigateTo('home')" class="hover:bg-indigo-500 px-3 py-1.5 rounded-lg transition-colors text-sm font-medium flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        خانه
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8" id="app-content"></main>

  <div id="modal-backdrop" class="fixed inset-0 bg-black/50 hidden z-50 overflow-y-auto justify-center p-4 sm:p-10 fade-in items-start sm:items-center">
    <div id="modal-content" class="bg-white rounded-2xl shadow-xl w-full max-w-2xl flex flex-col overflow-visible my-auto"></div>
  </div>

<script>
// --- 1. DATA & STATE MANAGEMENT ---
const initialGradeLevels = ['اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم', 'یازدهم', 'دوازدهم'];
const majorsList = ['عمومی', 'ریاضی فیزیک', 'علوم تجربی', 'علوم انسانی'];
const DAYS_OF_WEEK = ['شنبه', 'یک‌شنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه'];
const MAX_PERIODS = 8;
const MAX_PERIODS_PER_SUBJECT = 10;
const MAX_PERIOD_DURATION = 120;

let state = {
  settings: { schoolName: 'نام مدرسه' },
  gradeLevels: [...initialGradeLevels],
  subjects: [],
  teachers: [],
  classes: [],
  sharedGroups: [],
  schedules: {}
};

let uiState = {
  sortRules: { subjects: 'date', teachers: 'date', classes: 'date' },
  teacherViewMode: 'grid',
  activeTomSelects: []
};

// --- FIX: XSS Prevention — Escape HTML for all user-provided data ---
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// --- FIX: Validation helpers ---
function safeParseInt(val, fallback) {
  const n = parseInt(val);
  return (isNaN(n) || n < 0) ? fallback : n;
}

// --- FIX (زمان‌بند): فیلدهای صریح «دشواری/انرژی» و «زمان ترجیحی» برای هر درس ---
// جایگزین تشخیص متنی نام درس (substring match) و type ثابت
const SUBJECT_DIFFICULTY_LEVELS = [
  { value: 1, label: '۱ — خیلی سبک' },
  { value: 2, label: '۲ — سبک' },
  { value: 3, label: '۳ — متوسط' },
  { value: 4, label: '۴ — سنگین' },
  { value: 5, label: '۵ — خیلی سنگین' }
];
const SUBJECT_PREFERRED_SLOTS = [
  { value: 'any', label: 'بدون ترجیح خاص' },
  { value: 'morning', label: 'صبح (زنگ‌های اول)' },
  { value: 'end', label: 'آخر روز (زنگ آخر)' }
];
const PREFERRED_SLOT_SHORT_LABELS = { morning: 'صبح', end: 'آخر روز' };

function clampInt(val, min, max, fallback) {
  const n = parseInt(val);
  if (isNaN(n)) return fallback;
  return Math.min(max, Math.max(min, n));
}

function ensureSubjectSchedulingFields(s) {
  if (typeof s.difficulty !== 'number' || s.difficulty < 1 || s.difficulty > 5) s.difficulty = 3;
  if (!['morning', 'end', 'any'].includes(s.preferredSlot)) {
    // مهاجرت یک‌بارهٔ داده‌های قدیمی (فقط تا اولین ذخیره): از نام درس حدس زده می‌شود؛
    // از این پس زمان‌بند صرفاً بر اساس این فیلد صریح کار می‌کند، نه متن نام درس.
    s.preferredSlot = /تربیت\s*بدنی|هنر|کار\s*و\s*فناوری|ورزش/.test(s.name || '') ? 'end' : 'any';
  }
}

function ensureClassSubjectFields(cs) {
  if (typeof cs.doublePeriod !== 'boolean') cs.doublePeriod = false;
  if (cs.sharedGroupId === undefined) cs.sharedGroupId = null;
}

function parsePreferredSlotLabel(v) {
  const s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
  if (['صبح', 'morning', 'اول روز', 'زنگ اول', 'اول'].includes(s)) return 'morning';
  if (['آخر', 'end', 'آخر روز', 'زنگ آخر', 'آخرین'].includes(s)) return 'end';
  return 'any';
}

function getClassCapacity(cls) {
  const activeDays = cls.config?.activeDays || [0,1,2,3,4];
  const periodsCount = cls.config?.periodsCount || 5;
  return activeDays.length * periodsCount;
}

function getClassUsedSlots(cls) {
  return cls.subjects.reduce((sum, cs) => sum + (cs.periods || 0), 0);
}

function validateStateStructure(data) {
  if (!data || typeof data !== 'object') return false;
  if (!Array.isArray(data.subjects)) return false;
  if (!Array.isArray(data.teachers)) return false;
  if (!Array.isArray(data.classes)) return false;
  if (!data.settings || typeof data.settings !== 'object') return false;
  return true;
}

function autoAssignTeachers() {
  let changed = false;
  state.classes.forEach(c => {
      c.subjects.forEach(cs => {
          if (cs.teacherId && !state.teachers.find(t => t.id === cs.teacherId)) {
              cs.teacherId = null;
              changed = true;
          }
          if (!cs.teacherId) {
              const specialized = state.teachers.filter(t => t.subjects.includes(cs.subjectId));
              if (specialized.length > 0) {
                  cs.teacherId = specialized[0].id;
                  changed = true;
              }
          }
      });
  });
  return changed;
}

// --- FIX: Crash prevention — try/catch around JSON.parse with structure validation ---
function loadState() {
  const saved = localStorage.getItem('school_data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (validateStateStructure(parsed)) {
        state = parsed;
      } else {
        console.warn('Saved state has invalid structure, using defaults.');
        // Backup corrupted data for potential recovery
        try { localStorage.setItem('school_data_corrupt_' + Date.now(), saved); } catch(_) {}
      }
    } catch(e) {
      console.error('Failed to parse saved state:', e);
      // Backup corrupted data
      try { localStorage.setItem('school_data_corrupt_' + Date.now(), saved); } catch(_) {}
      showToast('داده‌های ذخیره‌شده خراب بود؛ از حالت اولیه استفاده شد.', 'error');
    }
  }

  if (!state.gradeLevels) state.gradeLevels = [...initialGradeLevels];
  if (!state.subjects) state.subjects = [];
  if (!state.teachers) state.teachers = [];
  if (!state.classes) state.classes = [];
  if (!state.settings) state.settings = { schoolName: 'نام مدرسه' };
  if (!state.schedules) state.schedules = {};

  // Sanitize: ensure all names are strings
  state.subjects.forEach(s => {
    if(!s.createdAt) s.createdAt = Date.now();
    if(typeof s.name !== 'string') s.name = String(s.name || '');
    if(typeof s.grade !== 'string') s.grade = String(s.grade || '');
    if(typeof s.major !== 'string') s.major = String(s.major || 'عمومی');
    ensureSubjectSchedulingFields(s); // FIX (زمان‌بند): دشواری و زمان ترجیحی
  });
  state.teachers.forEach(t => {
      if(!t.createdAt) t.createdAt = Date.now();
      if(typeof t.name !== 'string') t.name = String(t.name || '');
      if(!t.availability || t.availability.length < MAX_PERIODS) t.availability = generateDefaultAvailability();
  });
  state.classes.forEach(c => {
      if(!c.createdAt) c.createdAt = Date.now();
      if(typeof c.name !== 'string') c.name = String(c.name || '');
      if(!Array.isArray(c.subjects)) c.subjects = [];
      c.subjects.forEach(cs => { if(cs) ensureClassSubjectFields(cs); }); // FIX (زمان‌بند): زنگ پیوسته
      // FIX: Validate config — ensure numeric values are within bounds
      if(!c.config) c.config = { activeDays: [0,1,2,3,4], periodsCount: 5, periodDuration: 45 };
      if(!Array.isArray(c.config.activeDays) || c.config.activeDays.length === 0) c.config.activeDays = [0,1,2,3,4];
      if(typeof c.config.periodsCount !== 'number' || c.config.periodsCount < 1 || c.config.periodsCount > MAX_PERIODS) c.config.periodsCount = 5;
      if(typeof c.config.periodDuration !== 'number' || c.config.periodDuration < 1 || c.config.periodDuration > MAX_PERIOD_DURATION) c.config.periodDuration = 45;
  });

  if (typeof state.settings.schoolName !== 'string') state.settings.schoolName = 'نام مدرسه';

  autoAssignTeachers();
  saveState();
}

function saveState() {
  try {
    localStorage.setItem('school_data', JSON.stringify(state));
  } catch(e) {
    console.error('Failed to save state:', e);
    showToast('خطا در ذخیره‌سازی اطلاعات. ممکن است حافظه پر باشد.', 'error');
  }
}

function generateId() { return '_' + Math.random().toString(36).substr(2, 9); }
function generateDefaultAvailability() {
    let avail = {};
    for(let d=0; d<6; d++) avail[d] = new Array(MAX_PERIODS).fill(true);
    return avail;
}

// --- 2. UTILITIES & UI COMPONENTS ---

// --- FIX: Bug in transition property ---
function showToast(msg, type = 'info') {
  const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600' };
  const toast = document.createElement('div');
  toast.className = `${colors[type] || colors.info} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium fade-in max-w-sm`;
  toast.textContent = msg; // textContent — safe from XSS
  document.getElementById('toast-container').appendChild(toast);
  setTimeout(() => {
    toast.style.transition = 'opacity .3s ease';  // FIX: was `transition = 'opacity .3s'`
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

const modalBackdrop = document.getElementById('modal-backdrop');
const modalContent = document.getElementById('modal-content');

modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) hideModal();
});

function showModal(title, bodyHTML, footerHTML, onOpen = null) {
  // Title is escaped since it may contain user data
  modalContent.innerHTML = `
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-50 rounded-t-2xl shrink-0">
      <h3 class="font-bold text-lg text-slate-800">${escapeHtml(title)}</h3>
      <button onclick="hideModal()" class="text-gray-400 hover:text-red-500 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </div>
    <div class="px-6 py-6 flex-1 overflow-visible">${bodyHTML}</div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-slate-50 rounded-b-2xl shrink-0">${footerHTML}</div>
  `;
  modalBackdrop.classList.remove('hidden');
  modalBackdrop.classList.add('flex');
  setTimeout(() => {
    initSearchableSelects();
    if(onOpen) onOpen();
  }, 50);
}

function hideModal() {
  modalBackdrop.classList.add('hidden');
  modalBackdrop.classList.remove('flex');
  destroyAllTomSelects();
}

function navigateTo(view) {
  destroyAllTomSelects();
  const content = document.getElementById('app-content');
  content.innerHTML = '';

  if (view === 'home') content.innerHTML = renderHome();
  else if (view === 'settings') content.innerHTML = renderSettings();
  else if (view === 'teachers') content.innerHTML = renderTeachers();
  else if (view === 'classes') content.innerHTML = renderClasses();
  else if (view === 'subjects') content.innerHTML = renderSubjects();
  else if (view === 'scheduler') content.innerHTML = renderScheduler();
  else if (view.startsWith('class_edit_')) {
    const classId = view.replace('class_edit_', '');
    content.innerHTML = renderClassEditor(classId);
  }

  setTimeout(() => initSearchableSelects(), 50);
}

function destroyAllTomSelects() {
    uiState.activeTomSelects.forEach(ts => {
        try {
            if (ts && typeof ts.destroy === 'function') ts.destroy();
        } catch(e) { console.warn("TomSelect destroy error:", e); }
    });
    uiState.activeTomSelects = [];
}

function initSearchableSelects() {
  destroyAllTomSelects();
  document.querySelectorAll('select.searchable').forEach(el => {
    if (!el.tomselect) {
      const ts = new TomSelect(el, {
        create: false,
        sortField: { field: "text", direction: "asc" },
        placeholder: el.getAttribute('placeholder') || 'جستجو و انتخاب...',
        render: { no_results: function(data, escape) { return '<div class="no-results p-2 text-sm text-gray-500">موردی یافت نشد</div>'; } }
      });
      uiState.activeTomSelects.push(ts);
    }
  });
}

function sortDataList(list, type) {
  return [...list].sort((a, b) => {
    if (type === 'alpha') return (a.name || '').localeCompare(b.name || '', 'fa');
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

function renderSortToggle(section, currentSort) {
  return `
    <select onchange="changeSort('${escapeHtml(section)}', this.value)" class="searchable text-sm border-gray-300 rounded-lg pr-8 bg-white" placeholder="مرتب‌سازی...">
      <option value="date" ${currentSort === 'date' ? 'selected' : ''}>مرتب‌سازی: تاریخ تغییرات</option>
      <option value="alpha" ${currentSort === 'alpha' ? 'selected' : ''}>مرتب‌سازی: حروف الفبا</option>
    </select>
  `;
}

function changeSort(section, val) {
  if (val !== 'date' && val !== 'alpha') return;
  uiState.sortRules[section] = val;
  navigateTo(section);
}

// --- 3. VIEWS ---

// HOME VIEW
function renderHome() {
  const menus = [
    { id: 'settings', title: 'تنظیمات', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z', color: 'bg-gray-500' },
    { id: 'teachers', title: 'اساتید', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z', color: 'bg-emerald-500' },
    { id: 'classes', title: 'کلاس‌ها', icon: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4', color: 'bg-blue-500' },
    { id: 'subjects', title: 'دروس', icon: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253', color: 'bg-indigo-500' },
    { id: 'scheduler', title: 'ساخت برنامه هوشمند', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z', color: 'bg-orange-500' },
  ];

  let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in">`;
  menus.forEach(m => {
    html += `
      <div onclick="navigateTo('${escapeHtml(m.id)}')" class="glass-card rounded-2xl p-6 cursor-pointer hover:-translate-y-1 transition-transform group flex flex-col items-center justify-center gap-4 text-center">
        <div class="w-16 h-16 rounded-full ${m.color} text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${m.icon}" /></svg>
        </div>
        <h2 class="text-xl font-bold text-slate-700">${escapeHtml(m.title)}</h2>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// SUBJECTS VIEW
function renderSubjects() {
  const grouped = {};
  const sortedData = sortDataList(state.subjects, uiState.sortRules.subjects);

  sortedData.forEach(s => {
    if(!grouped[s.grade]) grouped[s.grade] = [];
    grouped[s.grade].push(s);
  });

  const sortedGrades = state.gradeLevels.filter(g => grouped[g]);

  let html = `
    <div class="fade-in">
      <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">

function deleteGrade(grade) {
  if(!confirm(`آیا از حذف کامل پایه "${grade}" و تمامی دروس و کلاس‌های آن اطمینان دارید؟`)) return;
  deleteGradeMajor(grade, null, true);
}

function deleteGradeMajor(grade, major, skipConfirm = false) {
  const scope = major ? `پایه ${grade} / رشته ${major}` : `پایه ${grade}`;
  if (!skipConfirm && !confirm(`آیا از حذف کامل ${scope} و همه دروس و کلاس‌های مرتبط اطمینان دارید؟`)) return;

  const subjectIds = state.subjects.filter(s => s.grade === grade && (!major || s.major === major)).map(s => s.id);
  const classIdsToDelete = state.classes.filter(c => c.grade === grade && (!major || c.major === major)).map(c => c.id);

  state.subjects = state.subjects.filter(s => !(s.grade === grade && (!major || s.major === major)));
  state.classes = state.classes.filter(c => !(c.grade === grade && (!major || c.major === major)));

  state.teachers.forEach(t => {
    t.subjects = (t.subjects || []).filter(sid => !subjectIds.includes(sid));
  });

  state.sharedGroups = (state.sharedGroups || []).map(g => ({
    ...g,
    members: (g.members || []).filter(m => !subjectIds.includes(m.subjectId) && !classIdsToDelete.includes(m.classId))
  })).filter(g => (g.members || []).length >= 2);

  Object.keys(state.schedules || {}).forEach(cid => {
    if (classIdsToDelete.includes(cid)) delete state.schedules[cid];
  });

  if (!major) state.gradeLevels = state.gradeLevels.filter(g => g !== grade);

  saveState(); navigateTo('subjects'); showToast(`${scope} حذف شد.`, 'success');
}

function deleteSubject(id) {
  if(!confirm('حذف درس؟')) return;
  state.subjects = state.subjects.filter(s => s.id !== id);
  state.teachers.forEach(t => t.subjects = (t.subjects || []).filter(sid => sid !== id));
  state.classes.forEach(c => c.subjects = c.subjects.filter(cs => cs.subjectId !== id));
  state.sharedGroups = (state.sharedGroups || []).map(g => ({...g, members:(g.members || []).filter(m => m.subjectId !== id)})).filter(g => (g.members || []).length >= 2);
  Object.keys(state.schedules || {}).forEach(cid => {
    if (state.classes.some(c => c.id === cid)) {
      for (let d=0; d<6; d++) for (let p=0; p<MAX_PERIODS; p++) {
        const lesson = state.schedules[cid]?.[d]?.[p];
        if (lesson?.subjectId === id) state.schedules[cid][d][p] = null;
      }
    }
  });
  saveState(); navigateTo('subjects'); showToast('درس حذف شد', 'success');
}

function processSubjectsImport() {
  const file = document.getElementById('import_sub_file').files[0];
  if(!file) return showToast('لطفا یک فایل انتخاب کنید', 'error');
  const grade = document.getElementById('import_sub_grade').value;
  const major = document.getElementById('import_sub_major').value;
  // FIX: Validate grade/major before import
  if(!state.gradeLevels.includes(grade)) return showToast('پایه پیش‌فرض نامعتبر است', 'error');
  if(!majorsList.includes(major)) return showToast('رشته پیش‌فرض نامعتبر است', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

        let count = 0;
        json.slice(1).forEach(row => {
            if(row[0]) {
                const subName = String(row[0]).trim().slice(0, 100); // FIX: Sanitize and limit length
                const subGrade = String(row[1] || grade).trim();
                const subMajor = String(row[2] || major).trim();
                // Validate grade/major from file
                if(!state.gradeLevels.includes(subGrade) || !majorsList.includes(subMajor)) return;
                // FIX (زمان‌بند): ستون‌های اختیاری دشواری و زمان ترجیحی
                const subDifficulty = clampInt(row[3], 1, 5, 3);
                const subPreferred = parsePreferredSlotLabel(row[4]);
                state.subjects.push({ id: generateId(), name: subName, grade: subGrade, major: subMajor, difficulty: subDifficulty, preferredSlot: subPreferred, createdAt: Date.now() });
                count++;
            }
        });
        saveState(); hideModal(); navigateTo('subjects'); showToast(`${count} درس اضافه شد`, 'success');
      } catch(err) { showToast('خطا در خواندن فایل اکسل', 'error'); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
}

function getSubjectOwnerTeacherId(subjectId, excludeTeacherId = null) {
  const owner = state.teachers.find(t =>
    t.id !== excludeTeacherId && Array.isArray(t.subjects) && t.subjects.includes(subjectId)
  );
  return owner ? owner.id : null;
}

function getSharedGroupForSubject(classId, subjectId) {
  return state.sharedGroups.find(g =>
    Array.isArray(g.members) && g.members.some(m => m.classId === classId && m.subjectId === subjectId)
  ) || null;
}

function getSharedGroupMemberKeys(group) {
  return (group?.members || []).map(m => `${m.classId}::${m.subjectId}`);
}

function processTeachersImport() {
  const file = document.getElementById('import_teacher_file').files[0];
  if(!file) return showToast('لطفا یک فایل انتخاب کنید', 'error');

  const reader = new FileReader();
  reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {header: 1});

        let count = 0;
        json.forEach((row, index) => {
            const name = row[0];
            if(name && typeof name === 'string' && name.trim().length > 0) {
                if (index === 0 && (name.includes('نام') || name.includes('استاد') || name.includes('Name'))) return;
                const cleanName = name.trim().slice(0, 100); // FIX: Sanitize and limit length
                if (!state.teachers.find(t => t.name === cleanName)) {
                    state.teachers.push({
                        id: generateId(), name: cleanName, subjects: [],
                        availability: generateDefaultAvailability(), createdAt: Date.now()
                    });
                    count++;
                }
            }
        });
        saveState(); hideModal(); navigateTo('teachers');
        if (count > 0) showToast(`${count} استاد جدید با موفقیت اضافه شد.`, 'success');
        else showToast('استاد جدیدی یافت نشد یا تمامی اسامی تکراری بودند.', 'info');
      } catch(err) { showToast('خطا در خواندن فایل اکسل', 'error'); }
  };
  reader.readAsArrayBuffer(file);
}

function saveTeacher(id) {
  const name = document.getElementById('edit_teacher_name').value.trim();
  const selectedSubjects = Array.from(document.getElementById('edit_teacher_subjects').selectedOptions).map(opt => opt.value);

  if(!name) return showToast('نام الزامی است', 'error');
  if(name.length > 100) return showToast('نام نباید بیش از ۱۰۰ کاراکتر باشد', 'error');

  const duplicate = state.teachers.find(t => t.id !== id && String(t.name || '').trim().localeCompare(name, 'fa', {sensitivity:'base'}) === 0);
  if (duplicate) return showToast(`این استاد قبلاً با نام «${duplicate.name}» ثبت شده است.`, 'error');

  const invalidOwnedSubjects = selectedSubjects.filter(sid => {
    const ownerId = getSubjectOwnerTeacherId(sid, id || null);
    return ownerId && ownerId !== id;
  });
  if (invalidOwnedSubjects.length > 0) {
    return showToast('یکی از دروس انتخاب‌شده قبلاً به استاد دیگری تخصیص داده شده است.', 'error');
  }

  let availability = {};
  for(let d=0; d<DAYS_OF_WEEK.length; d++) {
    availability[d] = [];
    for(let p=0; p<MAX_PERIODS; p++) {
      const cb = document.getElementById(`avail_${d}_${p}`);
      availability[d][p] = cb ? cb.checked : true;
    }
  }

  let teacher_id = id;
  if (id) {
    const t = state.teachers.find(x => x.id === id);
    if(!t) return showToast('استاد یافت نشد', 'error');
    t.name = name;
    t.subjects = [...new Set(selectedSubjects)];
    t.availability = availability;
    t.updatedAt = Date.now();
  } else {
    teacher_id = generateId();
    state.teachers.push({ id: teacher_id, name, subjects: [...new Set(selectedSubjects)], availability, createdAt: Date.now() });
  }

  state.classes.forEach(c => {
    c.subjects.forEach(cs => {
      if (cs.teacherId === teacher_id && !selectedSubjects.includes(cs.subjectId)) cs.teacherId = null;
    });
  });

  const hasAnyAvailability = Object.values(availability).some(day => day && day.some(slot => slot));
  if (!hasAnyAvailability) showToast('هشدار: این استاد هیچ زمان آزادی ندارد و در زمان‌بندی قرار نخواهد گرفت.', 'error');

  autoAssignTeachers();
  saveState(); hideModal(); navigateTo('teachers'); showToast('اطلاعات استاد ذخیره شد', 'success');
}

function deleteTeacher(id) {
  if(!confirm('حذف استاد؟')) return;
  state.teachers = state.teachers.filter(t => t.id !== id);
  state.classes.forEach(c => c.subjects.forEach(cs => { if(cs.teacherId === id) cs.teacherId = null; }));
  saveState(); navigateTo('teachers');
}

function saveNewClass() {
  const name = document.getElementById('new_class_name').value.trim();
  const grade = document.getElementById('new_class_grade').value;
  const major = document.getElementById('new_class_major').value;
  // FIX: Validate all inputs
  if(!name) return showToast('نام کلاس الزامی است', 'error');
  if(name.length > 100) return showToast('نام کلاس نباید بیش از ۱۰۰ کاراکتر باشد', 'error');
  if(!state.gradeLevels.includes(grade)) return showToast('پایه تحصیلی نامعتبر است', 'error');
  if(!majorsList.includes(major)) return showToast('رشته نامعتبر است', 'error');

  let classSubjects = state.subjects.filter(s => s.grade === grade && (s.major === major || s.major === 'عمومی')).map(s => {
    const specializedTeachers = state.teachers.filter(t => t.subjects.includes(s.id));
    let defaultTeacherId = specializedTeachers.length > 0 ? specializedTeachers[0].id : null;
    return { subjectId: s.id, periods: 2, type: 'عادی', teacherId: defaultTeacherId, doublePeriod: false, sharedGroupId: null };
  });

  state.classes.push({ id: generateId(), name, grade, major, subjects: classSubjects, config: { activeDays: [0,1,2,3,4], periodsCount: 5, periodDuration: 45 }, createdAt: Date.now() });
  saveState(); hideModal(); navigateTo('classes'); showToast('کلاس ایجاد شد', 'success');
}

function duplicateClass(id) {
    const cls = state.classes.find(c => c.id === id);

    const newClass = JSON.parse(JSON.stringify(cls));

    newClass.createdAt = Date.now();
    newClass.subjects.forEach(cs => ensureClassSubjectFields(cs));
    state.classes.push(newClass);
    saveState(); navigateTo('classes'); showToast('کلاس کپی شد', 'success');
}

    let teacherOptions = `<option value="">بدون استاد (انتخاب کنید...)</option>`;

    if (specializedTeachers.length > 0) {
        teacherOptions += `<optgroup label="✅ اساتید تخصصی این درس">`;
        teacherOptions += specializedTeachers.map(t => `<option value="${escapeHtml(t.id)}" ${t.id === cSub.teacherId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('');
        teacherOptions += `</optgroup>`;
    }

    if (otherTeachers.length > 0) {
        teacherOptions += `<optgroup label="سایر اساتید">`;
        teacherOptions += otherTeachers.map(t => `<option value="${escapeHtml(t.id)}" ${t.id === cSub.teacherId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('');
        teacherOptions += `</optgroup>`;
    }

    html += `
      <tr class="hover:bg-slate-50 transition-colors">
        <td class="p-4 font-bold text-slate-700 text-sm">${escapeHtml(mainSub.name)}</td>
        <td class="p-4 text-center">

        </td>
        <td class="p-4">
          <select onchange="updateClassSubject('${escapeHtml(cls.id)}', ${index}, 'type', this.value)" class="w-full border rounded-lg px-2 py-1 outline-none focus:border-blue-500 bg-white shadow-sm text-sm">
            <option value="عادی" ${cSub.type === 'عادی' ? 'selected' : ''}>عادی</option>
            <option value="تخصصی" ${cSub.type === 'تخصصی' ? 'selected' : ''}>تخصصی</option>
          </select>
        </td>
        <td class="p-4 text-center">
          <input type="checkbox" ${cSub.doublePeriod ? 'checked' : ''} onchange="updateClassSubject('${escapeHtml(cls.id)}', ${index}, 'doublePeriod', this.checked)" class="w-5 h-5 text-blue-600 rounded cursor-pointer" title="اگر فعال باشد، این درس باید دو زنگ پشت‌سرهم (مثل آزمایشگاه) در برنامه قرار بگیرد">
        </td>
        <td class="p-4" style="min-width: 250px;">
           <select class="searchable w-full" onchange="assignTeacherToClass('${escapeHtml(cls.id)}', ${index}, this.value)" placeholder="انتخاب استاد...">
             ${teacherOptions}
           </select>
        </td>
        <td class="p-4 text-center">
          <div class="flex items-center justify-center gap-1">
          <button onclick="openSharedLessonModal('${escapeHtml(cls.id)}', ${index})" title="برگزاری مشترک" class="text-violet-500 hover:text-violet-700 bg-violet-50 p-1.5 rounded-lg transition-all text-xs">↔</button>
          <button onclick="removeClassSubject('${escapeHtml(cls.id)}', ${index})" class="text-red-400 hover:text-red-600 bg-red-50 p-1.5 rounded-lg transition-all"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
          </div>
        </td>
      </tr>`;
  });

  html += `</tbody></table></div>
        <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end flex-wrap gap-3">
           <button onclick="addAllGradeSubjectsToClass('${escapeHtml(cls.id)}')" class="text-emerald-600 hover:bg-emerald-100 px-4 py-2 rounded-xl font-semibold transition-colors flex items-center gap-1 text-sm border border-emerald-200">
             افزودن خودکار تمام دروس پایه
           </button>
           <button onclick="openAddSubjectToClassModal('${escapeHtml(cls.id)}')" class="text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-xl font-semibold transition-colors flex items-center gap-1 text-sm border border-blue-200">
             افزودن تک درس به کلاس
           </button>
        </div></div></div>`;
  return html;
}

function addAllGradeSubjectsToClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const existingSubIds = cls.subjects.map(cs => cs.subjectId);

  const availableSubjects = state.subjects.filter(s =>
      !existingSubIds.includes(s.id) && s.grade === cls.grade && (s.major === cls.major || s.major === 'عمومی')
  );

  if (availableSubjects.length === 0) return showToast('تمام دروس مرتبط قبلاً اضافه شده‌اند.', 'info');

  availableSubjects.forEach(sub => {
      const specializedTeachers = state.teachers.filter(t => t.subjects.includes(sub.id));
      let defaultTeacherId = specializedTeachers.length > 0 ? specializedTeachers[0].id : null;
      cls.subjects.push({ subjectId: sub.id, periods: 2, type: 'عادی', teacherId: defaultTeacherId, doublePeriod: false });
  });

  // FIX: Check capacity after adding
  const capacity = getClassCapacity(cls);
  const usedSlots = getClassUsedSlots(cls);
  if (usedSlots > capacity) {
    showToast(`${availableSubjects.length} درس اضافه شد، اما کل زنگ‌ها (${usedSlots}) از ظرفیت کلاس (${capacity}) بیشتر است.`, 'error');
  } else {
    showToast(`${availableSubjects.length} درس با موفقیت به کلاس اضافه شد.`, 'success');
  }
  saveState(); navigateTo(`class_edit_${classId}`);
}

function editClassName(id) {
    const cls = state.classes.find(c => c.id === id);
    if(cls) {
        const newName = prompt('نام جدید کلاس را وارد کنید:', cls.name);
        if(newName && newName.trim()) {
            cls.name = newName.trim().slice(0, 100);
            saveState(); navigateTo(`class_edit_${id}`);
        }
    }
}

function assignTeacherToClass(classId, subIndex, teacherId) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls || !cls.subjects[subIndex]) return;
  const cSub = cls.subjects[subIndex];
  const subId = cSub.subjectId;
  const oldTeacherId = cSub.teacherId;

  if (teacherId) {
    const ownerId = getSubjectOwnerTeacherId(subId, teacherId);
    if (ownerId && ownerId !== teacherId) {
      const owner = state.teachers.find(t => t.id === ownerId);
      return showToast(`این درس قبلاً به استاد «${owner?.name || ''}» تخصیص داده شده و دروس تخصصی اوست.`, 'error');
    }
  }

  cSub.teacherId = teacherId || null;

  if (teacherId) {
    const teacher = state.teachers.find(t => t.id === teacherId);
    if (teacher && !teacher.subjects.includes(subId)) teacher.subjects.push(subId);
    const hasAvailability = teacher?.availability && Object.values(teacher.availability).some(day => day && day.some(slot => slot));
    if (!hasAvailability) showToast(`هشدار: استاد «${teacher?.name || ''}» هیچ زمان آزادی ندارد و در زمان‌بندی قرار نخواهد گرفت.`, 'error');
  }

  if (oldTeacherId && oldTeacherId !== teacherId) {
    const oldTeacher = state.teachers.find(t => t.id === oldTeacherId);
    if (oldTeacher) {
      const stillTeachingElsewhere = state.classes.some(c => c.subjects.some(cs => cs.subjectId === subId && cs.teacherId === oldTeacherId));
      if (!stillTeachingElsewhere) oldTeacher.subjects = oldTeacher.subjects.filter(sid => sid !== subId);
    }
  }

  const group = getSharedGroupForSubject(classId, subId);
  if (group) {
    group.teacherId = teacherId || null;
    (group.members || []).forEach(m => {
      const c = state.classes.find(x => x.id === m.classId);
      const cs = c?.subjects.find(x => x.subjectId === m.subjectId);
      if (cs) cs.teacherId = teacherId || null;
    });
    if (teacherId) {
      const teacher = state.teachers.find(t => t.id === teacherId);
      if (teacher) (group.members || []).forEach(m => { if (!teacher.subjects.includes(m.subjectId)) teacher.subjects.push(m.subjectId); });
    }
  }

  saveState();
}

// FIX: Validate numeric inputs
function updateClassSubject(classId, subIndex, field, value) {
  const cls = state.classes.find(c => c.id === classId);
  if(!cls || !cls.subjects[subIndex]) return;

  if(field === 'periods') {
    let val = safeParseInt(value, 1);
    if(val < 1) val = 1;
    if(val > MAX_PERIODS_PER_SUBJECT) {
      val = MAX_PERIODS_PER_SUBJECT;
      showToast(`حداکثر زنگ برای هر درس ${MAX_PERIODS_PER_SUBJECT} است.`, 'info');
    }
    value = val;
  }

  if(field === 'type' && value !== 'عادی' && value !== 'تخصصی') return;

  // FIX (زمان‌بند): زنگ پیوسته — مقدار بولی از چک‌باکس
  if(field === 'doublePeriod') {
    value = (value === true || value === 'true');
    if (value && (cls.subjects[subIndex].periods || 1) % 2 !== 0) {
      showToast('تعداد زنگ این درس فرد است؛ یک زنگ بدون جفت خواهد ماند (بهتر است تعداد زنگ را زوج کنید).', 'info');
    }
  }

  cls.subjects[subIndex][field] = value;
  saveState();

  // FIX: Check capacity after update
  if(field === 'periods') {
    const capacity = getClassCapacity(cls);
    const usedSlots = getClassUsedSlots(cls);
    if(usedSlots > capacity) {
      showToast(`هشدار: کل زنگ‌ها (${usedSlots}) از ظرفیت کلاس (${capacity}) بیشتر شد.`, 'error');
    }
    if (cls.subjects[subIndex].doublePeriod && (value % 2 !== 0)) {
      showToast('تعداد زنگ این درس پیوسته فرد است؛ یک زنگ بدون جفت خواهد ماند.', 'info');
    }
  }
}

function removeClassSubject(classId, subIndex) {
  if(!confirm('حذف درس؟')) return;
  const cls = state.classes.find(c => c.id === classId);
  if(!cls || !cls.subjects[subIndex]) return;
  const subjectId = cls.subjects[subIndex].subjectId;
  const group = getSharedGroupForSubject(classId, subjectId);
  if (group) {
    group.members = (group.members || []).filter(m => !(m.classId === classId && m.subjectId === subjectId));
    if (group.members.length < 2) state.sharedGroups = state.sharedGroups.filter(g => g.id !== group.id);
  }
  cls.subjects.splice(subIndex, 1);
  delete state.schedules[classId];
  saveState(); navigateTo(`class_edit_${classId}`);
}

  if(!cls) return;
  const existingSubIds = cls.subjects.map(cs => cs.subjectId);

  const body = `
    <div class="space-y-4">
      <div class="bg-blue-50 text-blue-800 text-xs p-2 rounded">در این لیست فقط دروس مرتبط با ${escapeHtml(cls.grade)} (${escapeHtml(cls.major)}) نمایش داده می‌شود.</div>
      <div><label class="block text-sm font-medium mb-1">انتخاب درس</label>${selectHtml}</div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium mb-1">زنگ در هفته</label><input type="number" id="new_csub_periods" value="2" min="1" max="${MAX_PERIODS_PER_SUBJECT}" class="w-full border rounded-lg px-3 py-2"></div>
        <div><label class="block text-sm font-medium mb-1">نوع</label><select id="new_csub_type" class="w-full border rounded-lg px-3 py-2"><option value="عادی">عادی</option><option value="تخصصی">تخصصی</option></select></div>
      </div>
      <div>
        <label class="flex items-center gap-2 p-2.5 border rounded-lg bg-white cursor-pointer hover:bg-slate-50 text-sm">
          <input type="checkbox" id="new_csub_double" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
          <span>زنگ پیوسته (دو زنگ پشت‌سرهم — مناسب آزمایشگاه)</span>
        </label>
      </div>
    </div>`;
  showModal('افزودن درس', body, `<button onclick="hideModal()" class="px-4 py-2 bg-gray-100 rounded-xl">انصراف</button><button onclick="addSubjectToClass('${escapeHtml(classId)}')" class="px-5 py-2 bg-blue-600 text-white rounded-xl">افزودن</button>`);
}

function addSubjectToClass(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if(!cls) return;
  const subjectId = document.getElementById('new_csub_id').value;
  if(!subjectId || !state.subjects.find(s => s.id === subjectId)) return showToast('درس نامعتبر است', 'error');

  // FIX: Validate periods
  let periods = safeParseInt(document.getElementById('new_csub_periods').value, 2);
  if(periods < 1) periods = 1;
  if(periods > MAX_PERIODS_PER_SUBJECT) {
    periods = MAX_PERIODS_PER_SUBJECT;
    showToast(`حداکثر زنگ برای هر درس ${MAX_PERIODS_PER_SUBJECT} است.`, 'info');
  }

  const type = document.getElementById('new_csub_type').value;
  if(type !== 'عادی' && type !== 'تخصصی') return showToast('نوع درس نامعتبر است', 'error');

  // FIX (زمان‌بند): زنگ پیوسته
  const doublePeriod = document.getElementById('new_csub_double')?.checked === true;

  const specializedTeachers = state.teachers.filter(t => t.subjects.includes(subjectId));
  let defaultTeacherId = specializedTeachers.length > 0 ? specializedTeachers[0].id : null;

  cls.subjects.push({ subjectId, periods, type, teacherId: defaultTeacherId, doublePeriod, sharedGroupId: null });
  saveState(); hideModal(); navigateTo(`class_edit_${classId}`);
}


function deleteSharedGroup(groupId) {
  if (!confirm('آیا از حذف گروه برگزاری مشترک اطمینان دارید؟')) return;
  const group = (state.sharedGroups || []).find(g => g.id === groupId);
  if (group) {
    (group.members || []).forEach(m => {
      const c = state.classes.find(x => x.id === m.classId);
      const cs = c?.subjects.find(x => x.subjectId === m.subjectId);
      if (cs) cs.sharedGroupId = null;
    });
  }
  state.sharedGroups = (state.sharedGroups || []).filter(g => g.id !== groupId);
  saveState();
  navigateTo('classes');
  showToast('گروه برگزاری مشترک حذف شد.', 'success');
}

function openSharedLessonModal(classId, subIndex = null) {
  const cls = state.classes.find(c => c.id === classId);
  if (!cls) return;
  const currentSub = subIndex !== null && cls.subjects[subIndex] ? cls.subjects[subIndex] : null;
  const currentGroup = currentSub ? getSharedGroupForSubject(classId, currentSub.subjectId) : null;
  const currentKeys = new Set(currentGroup ? getSharedGroupMemberKeys(currentGroup) : []);
  if (currentSub) currentKeys.add(`${classId}::${currentSub.subjectId}`);

  const candidates = [];
  state.classes.forEach(otherClass => {
    if (otherClass.grade !== cls.grade) return;
    otherClass.subjects.forEach((cs, idx) => {
      const key = `${otherClass.id}::${cs.subjectId}`;
      if (key === `${classId}::${currentSub?.subjectId || ''}`) return;
      const alreadyInGroup = getSharedGroupForSubject(otherClass.id, cs.subjectId);
      if (alreadyInGroup && (!currentGroup || alreadyInGroup.id !== currentGroup.id)) return;
      const sub = state.subjects.find(s => s.id === cs.subjectId);
      if (!sub) return;
      candidates.push({classId: otherClass.id, className: otherClass.name, subjectId: cs.subjectId, subjectName: sub.name, major: otherClass.major, periods: cs.periods || 1});
    });
  });

  if (!currentSub && candidates.length === 0) return showToast('درس دیگری در همین پایه برای برگزاری مشترک یافت نشد.', 'info');

  const selectedMemberKeys = new Set((currentGroup?.members || []).map(m => `${m.classId}::${m.subjectId}`));
  const currentPeriods = currentSub?.periods || currentGroup?.periods || 1;
  const currentTeacherId = currentSub?.teacherId || currentGroup?.teacherId || '';

  const body = `
    <div class="space-y-4">
      <div class="bg-violet-50 text-violet-800 text-xs p-3 rounded-xl border border-violet-100">
        درس‌های انتخاب‌شده در <b>همان روز و همان زنگ</b> برنامه‌ریزی می‌شوند و یک استاد مشترک خواهند داشت. برای سادگی زمان‌بندی، تعداد زنگ هفتگی همه اعضای یک گروه باید برابر باشد.
      </div>
      ${currentSub ? `<div class="bg-slate-50 rounded-xl p-3 border border-slate-200 text-sm"><b>درس اصلی:</b> ${escapeHtml(state.subjects.find(s=>s.id===currentSub.subjectId)?.name || '')} — ${escapeHtml(cls.name)} (${escapeHtml(cls.major)})</div>` : ''}
      <div>
        <label class="block text-sm font-bold mb-2">انتخاب درس‌های همراه از رشته‌های دیگر</label>
        <div class="max-h-64 overflow-y-auto border rounded-xl divide-y">
          ${candidates.map(c => `<label class="flex items-center gap-3 p-3 hover:bg-slate-50 cursor-pointer">
            <input type="checkbox" class="shared-member-check w-4 h-4 text-violet-600" data-class-id="${escapeHtml(c.classId)}" data-subject-id="${escapeHtml(c.subjectId)}" data-periods="${c.periods}" ${selectedMemberKeys.has(`${c.classId}::${c.subjectId}`) ? 'checked' : ''}>
            <span class="text-sm"><b>${escapeHtml(c.subjectName)}</b> — ${escapeHtml(c.className)} / ${escapeHtml(c.major)} <span class="text-xs text-slate-400">(${c.periods} زنگ)</span></span>
          </label>`).join('') || `<div class="p-4 text-sm text-slate-400">موردی برای انتخاب وجود ندارد.</div>`}
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">استاد مشترک</label>
          <select id="shared_teacher_id" class="searchable w-full">
            <option value="">انتخاب استاد...</option>
            ${state.teachers.map(t => `<option value="${escapeHtml(t.id)}" ${t.id === currentTeacherId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">تعداد زنگ مشترک در هفته</label>
          <input type="number" id="shared_periods" min="1" max="${MAX_PERIODS_PER_SUBJECT}" value="${currentPeriods}" class="w-full border rounded-lg px-3 py-2">
        </div>
      </div>
    </div>`;

  const footer = `<button onclick="hideModal()" class="px-4 py-2 bg-gray-100 rounded-xl">انصراف</button>
    ${currentGroup ? `<button onclick="deleteSharedGroup('${escapeHtml(currentGroup.id)}'); hideModal();" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl">حذف گروه</button>` : ''}
    <button onclick="saveSharedLessonGroup('${escapeHtml(classId)}','${escapeHtml(currentSub?.subjectId || '')}','${escapeHtml(currentGroup?.id || '')}')" class="px-5 py-2 bg-violet-600 text-white rounded-xl">ذخیره برگزاری مشترک</button>`;
  showModal('تنظیم برگزاری مشترک', body, footer);
}

function saveSharedLessonGroup(baseClassId, baseSubjectId, groupId = '') {
  const baseCls = state.classes.find(c => c.id === baseClassId);
  const baseSub = baseCls?.subjects.find(cs => cs.subjectId === baseSubjectId);
  const checks = Array.from(document.querySelectorAll('.shared-member-check:checked')).map(el => ({classId: el.dataset.classId, subjectId: el.dataset.subjectId, periods: safeParseInt(el.dataset.periods, 1)}));
  const teacherId = document.getElementById('shared_teacher_id')?.value || '';
  let periods = safeParseInt(document.getElementById('shared_periods')?.value, baseSub?.periods || 1);
  periods = Math.max(1, Math.min(periods, MAX_PERIODS_PER_SUBJECT));

  if (!baseCls || !baseSub) return showToast('درس اصلی انتخاب نشده است.', 'error');
  if (!teacherId || !state.teachers.some(t => t.id === teacherId)) return showToast('استاد مشترک را انتخاب کنید.', 'error');

  const members = [{classId: baseClassId, subjectId: baseSubjectId}, ...checks.map(c => ({classId: c.classId, subjectId: c.subjectId}))];
  const uniqueKeys = new Set(members.map(m => `${m.classId}::${m.subjectId}`));
  if (uniqueKeys.size < 2) return showToast('حداقل دو درس از دو کلاس/رشته برای برگزاری مشترک لازم است.', 'error');

  for (const m of members) {
    const c = state.classes.find(x => x.id === m.classId);
    const cs = c?.subjects.find(x => x.subjectId === m.subjectId);
    if (!c || !cs) return showToast('یکی از درس‌های انتخاب‌شده دیگر وجود ندارد.', 'error');
    if ((cs.periods || 1) !== periods) {
      return showToast(`تعداد زنگ درس «${state.subjects.find(s=>s.id===m.subjectId)?.name || ''}» باید با زنگ مشترک (${periods}) برابر باشد.`, 'error');
    }
    const existing = getSharedGroupForSubject(m.classId, m.subjectId);
    if (existing && existing.id !== groupId) return showToast('یکی از درس‌های انتخاب‌شده قبلاً عضو گروه مشترک دیگری است.', 'error');
  }

  let group = groupId ? state.sharedGroups.find(g => g.id === groupId) : null;
  const oldMembers = group ? [...(group.members || [])] : [];
  if (!group) {
    group = { id: generateId(), grade: baseCls.grade, periods, teacherId, members: [] };
    state.sharedGroups.push(group);
  }
  group.grade = baseCls.grade;
  group.periods = periods;
  group.teacherId = teacherId;
  group.members = members;

  oldMembers.forEach(m => {
    if (!members.some(n => n.classId === m.classId && n.subjectId === m.subjectId)) {
      const c = state.classes.find(x => x.id === m.classId);
      const cs = c?.subjects.find(x => x.subjectId === m.subjectId);
      if (cs) cs.sharedGroupId = null;
    }
  });

  members.forEach(m => {
    const c = state.classes.find(x => x.id === m.classId);
    const cs = c.subjects.find(x => x.subjectId === m.subjectId);
    cs.periods = periods;
    cs.teacherId = teacherId;
    cs.sharedGroupId = group.id;
  });

  // این استاد مالک تخصصی تمام درس‌های گروه می‌شود تا همان درس دوباره در منوی تخصص استاد دیگری ظاهر نشود.
  state.teachers.forEach(t => {
    t.subjects = (t.subjects || []).filter(sid => !members.some(m => m.subjectId === sid) || t.id === teacherId);
  });
  const teacher = state.teachers.find(t => t.id === teacherId);
  if (teacher) members.forEach(m => { if (!teacher.subjects.includes(m.subjectId)) teacher.subjects.push(m.subjectId); });

  saveState(); hideModal(); navigateTo(`class_edit_${baseClassId}`); showToast('برگزاری مشترک با موفقیت ذخیره شد.', 'success');
}

// FIX: Comprehensive validation for class config
function saveClassConfig(classId) {
  const cls = state.classes.find(c => c.id === classId);
  if(!cls) return;

  let activeDays = [];
  for(let i=0; i<6; i++) {
    const cb = document.getElementById(`cfg_day_${i}`);
    if(cb && cb.checked) activeDays.push(i);
  }

  if(activeDays.length === 0) {
    return showToast('حداقل یک روز باید فعال باشد.', 'error');
  }

  let periodsCount = safeParseInt(document.getElementById('cfg_periods').value, 5);
  if(periodsCount < 1) {
    periodsCount = 1;
    showToast('تعداد زنگ حداقل ۱ است.', 'info');
  }
  if(periodsCount > MAX_PERIODS) {
    periodsCount = MAX_PERIODS;
    showToast(`تعداد زنگ نمی‌تواند بیشتر از ${MAX_PERIODS} باشد.`, 'info');
  }

  let periodDuration = safeParseInt(document.getElementById('cfg_duration').value, 45);
  if(periodDuration < 1) {
    periodDuration = 45;
    showToast('مدت زمان زنگ نامعتبر بود، به ۴۵ دقیقه تنظیم شد.', 'info');
  }
  if(periodDuration > MAX_PERIOD_DURATION) {
    periodDuration = MAX_PERIOD_DURATION;
    showToast(`مدت زمان زنگ نمی‌تواند بیشتر از ${MAX_PERIOD_DURATION} دقیقه باشد.`, 'info');
  }

  // FIX: Capacity check — warn if existing subjects exceed new capacity
  const capacity = activeDays.length * periodsCount;
  const usedSlots = getClassUsedSlots(cls);
  if(usedSlots > capacity) {
    showToast(`هشدار: ظرفیت جدید (${capacity} زنگ) کمتر از کل زنگ‌های دروس موجود (${usedSlots} زنگ) است.`, 'error');
  }

  cls.config = { activeDays, periodsCount, periodDuration };
  saveState(); hideModal(); navigateTo(`class_edit_${classId}`);
}
